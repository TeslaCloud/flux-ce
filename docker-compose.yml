# Development setup: a dedicated server that runs a checkout of a schema with this
# checkout of Flux as its "flux" package, both mounted into the container, so that
# changes to the code are picked up by the Lua refresh of the running server.
#
#   docker compose up                       SQLite, kept in docker/sqlite/sv.db
#   docker compose --profile postgres up    PostgreSQL
#   docker compose --profile mariadb up     MariaDB
#
# The schema checkout is mounted at garrysmod/gamemodes/<schema>. Its "packages"
# folder is covered by an empty tmpfs, and this checkout is mounted at
# packages/flux inside it, so whatever packages/flux is in the schema checkout (a
# link made by "fpkg link ../flux-ce", relative or absolute, a copy, or nothing),
# the server always loads this checkout. The entry point links the other package
# folders that "fpkg install" put into the schema checkout into the tmpfs. Links
# of the schema checkout, such as gmsv_file linked with "fpkg link ../gmsv_file",
# point outside of the container: add a bind mount of the folder each one
# resolves to on the host to
# /home/steam/flux_server/garrysmod/gamemodes/<schema>/packages/<id> in
# docker-compose.override.yml. The entry point names the ones it misses.
#
# The server is published on FLUX_PORT of every address of the host. It is kept
# off the master server list and does not answer server browser queries, so
# connect to it with "connect localhost" (or the address of the host) from the
# game console. It still has outgoing access to Steam, which Workshop downloads
# need.
#
# "docker compose attach flux" opens the server console; Ctrl+P, Ctrl+Q leaves it
# again. Stopping the container kills the server right away, enter "quit" in the
# console if you need it to shut down cleanly. "docker compose down -v" deletes
# the databases and all other data in the volumes, the SQLite database is reset
# by deleting docker/sqlite/sv.db.
#
# Settings, taken from the environment or from an .env file next to this one:
#
#   FLUX_SCHEMA                 folder name of the schema (hl2rp)
#   FLUX_SCHEMA_PATH            checkout of the schema (../<FLUX_SCHEMA>)
#   FLUX_ENV                    Flux environment (development)
#   FLUX_MAP                    map to start on (gm_construct)
#   FLUX_PORT                   port on the host (27015)
#   FLUX_WORKSHOP_COLLECTION    ID of a Workshop collection to download and mount
#   FLUX_LUA_SHARED             local build of lua_shared.so to mount over the one in the image
#
# Mounts that only exist on one machine, such as a locally built srcds, belong
# in docker-compose.override.yml next to this file, which Compose merges in and
# Git ignores.
#
# Docker creates the mount points "packages" and "config" in the schema checkout,
# owned by root, when the checkout has no such folders; create them first. Nothing
# else is written into it apart from what the server itself writes there, such as
# db/.
#
# The owner of the files in the checkouts needs to have the user ID 1000, which
# is the one the server runs as.

services:
  flux:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: flux-dev
    init: true
    tty: true
    stdin_open: true
    environment:
      FLUX_SCHEMA: ${FLUX_SCHEMA:-hl2rp}
      FLUX_ENV: ${FLUX_ENV:-development}
      FLUX_WORKSHOP_COLLECTION: ${FLUX_WORKSHOP_COLLECTION:-}
    command: ["+map", "${FLUX_MAP:-gm_construct}", "+maxplayers", "128", "-tickrate", "30", "+host_workshop_collection", "1683881254"]
    ports:
      - "${FLUX_PORT:-27015}:27015/udp"
      - "${FLUX_PORT:-27015}:27015/tcp"
    volumes:
      - type: bind
        source: ${FLUX_SCHEMA_PATH:-../${FLUX_SCHEMA:-hl2rp}}
        target: /home/steam/flux_server/garrysmod/gamemodes/${FLUX_SCHEMA:-hl2rp}
        bind:
          create_host_path: false
      # The schema checkout once more, read-only, for the entry point to copy its
      # config files from and to compare its packages with the mounted ones.
      - type: bind
        source: ${FLUX_SCHEMA_PATH:-../${FLUX_SCHEMA:-hl2rp}}
        target: /home/steam/schema
        read_only: true
        bind:
          create_host_path: false
      - .:/home/steam/flux_server/garrysmod/gamemodes/${FLUX_SCHEMA:-hl2rp}/packages/flux
      - ./docker/sqlite:/home/steam/sqlite
      - data:/home/steam/flux_server/garrysmod/data
      - settings:/home/steam/flux_server/garrysmod/settings/flux
      # Workshop downloads. They fail when garrysmod/cache is a mount instead.
      - workshop:/home/steam/flux_server/steam_cache
      # A local build of Flux's Lua library, used instead of the one in the image.
      - type: bind
        source: ${FLUX_LUA_SHARED:-/home/luna/code/gmod-lua-shared/build-docker/lua_shared.so}
        target: /home/steam/flux_server/bin/linux64/lua_shared.so
        bind:
          create_host_path: false
    tmpfs:
      # The packages folder of the schema checkout is replaced by an empty one,
      # which this checkout and the other mounted packages are put into.
      - /home/steam/flux_server/garrysmod/gamemodes/${FLUX_SCHEMA:-hl2rp}/packages:uid=1000,gid=1000,mode=755
      # The config folder of the schema is replaced by a copy that the entry point
      # adds the database and environment settings to, see docker/entrypoint.sh.
      - /home/steam/flux_server/garrysmod/gamemodes/${FLUX_SCHEMA:-hl2rp}/config:uid=1000,gid=1000,mode=755
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      mariadb:
        condition: service_healthy
        required: false

  postgres:
    image: postgres:18.7
    profiles: [postgres]
    environment:
      POSTGRES_USER: flux
      POSTGRES_PASSWORD: flux
      POSTGRES_DB: flux
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "flux", "-d", "flux"]
      interval: 2s
      timeout: 5s
      retries: 30

  mariadb:
    image: mariadb:11.8
    profiles: [mariadb]
    environment:
      MARIADB_USER: flux
      MARIADB_PASSWORD: flux
      MARIADB_DATABASE: flux
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  data:
  settings:
  workshop:
  postgres:
  mariadb:
