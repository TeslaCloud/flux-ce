en:
  command:
    announce:
      description: Shows a notice to everyone on the server.
      syntax: <text>
    ban:
      description: Bans players and lifts bans.
      add:
        description: Ban this sucker! A Steam ID bans somebody who is not on the server.
        syntax: <target or Steam ID> <duration> [reason]
        message: "{player} has banned {target} for {time}. ({reason})."
        message_permanent: "{player} has banned {target} permanently. ({reason})."
      remove:
        description: Lifts the ban of a Steam ID.
        syntax: <Steam ID>
        message: "{player} has unbanned {target}."
    bots:
      description: Adds, kicks, freezes and unfreezes bots.
      add:
        description: Adds the specified amount of bots to the server.
        syntax: "[amount]"
        message:
          "1": "{player} has added {amount} bot to the server."
          "2": "{player} has added {amount} bots to the server."
      kick:
        description: Kicks all bots.
        message: "{player} has kicked all bots."
      freeze:
        description: Freezes all of the bots.
        message: "{player} has frozen all bots."
      unfreeze:
        description: Unfreezes all of the bots.
        message: "{player} has unfrozen all bots."
    changelevel:
      description: Changes the level to the specified map.
      syntax: <map> [delay]
      message: "{player} is changing the level to {map} in {delay} second(s)!"
    charpermission:
      description: Manages the permissions that are set for the characters that players have loaded.
      grant:
        description: Allows a permission for the character a player has loaded, for good or for the given time, whatever the role allows, unless the player is denied it.
        syntax: <target> <permission> [duration]
        message: "{player} has granted the character {character} the {permission} permission."
        message_temporary: "{player} has granted the character {character} the {permission} permission for {time}."
      revoke:
        description: Denies a permission to the character a player has loaded, for good or for the given time, whatever the player and their role have.
        syntax: <target> <permission> [duration]
        message: "{player} has denied the character {character} the {permission} permission."
        message_temporary: "{player} has denied the character {character} the {permission} permission for {time}."
      reset:
        description: Removes what was set for a permission of the character a player has loaded, so that the player's own permissions and role decide again.
        syntax: <target> <permission>
        message: "{player} has reset the {permission} permission of the character {character}."
        message_temporary: "{player} has removed the temporary value of the {permission} permission of the character {character}."
      list:
        description: Lists the permissions that were set for the character a player has loaded.
        syntax: <target>
        allowed: "Allowed for the character {character}: {permissions}."
        denied: "Denied for the character {character}: {permissions}."
        temporary_allowed: "Temporarily allowed for the character {character}: {permission} ({time} left)."
        temporary_denied: "Temporarily denied for the character {character}: {permission} ({time} left)."
        none: "The character {character} has no permissions of its own."
    freeze:
      description: Freezes players in place or unfreezes them.
      "on":
        description: Freezes a player.
        syntax: <target>
        message: "{player} has frozen {target}."
      "off":
        description: Unfreezes a player.
        syntax: <target>
        message: "{player} has unfrozen {target}."
    fullbright:
      description: Turns fullbright mode, which ignores the lighting of the map, on or off for a player.
      "on":
        description: Turns fullbright mode on for a player.
        syntax: <target>
        message: "{player} has enabled fullbright mode for {target}."
      "off":
        description: Turns fullbright mode off for a player.
        syntax: <target>
        message: "{player} has disabled fullbright mode for {target}."
    godmode:
      description: Turns god mode on or off for a player.
      "on":
        description: Turns god mode on for a player.
        syntax: <target>
        message: "{player} has enabled god mode for {target}."
      "off":
        description: Turns god mode off for a player.
        syntax: <target>
        message: "{player} has disabled god mode for {target}."
    kick:
      description: Kicks a player from the server.
      syntax: <target> [reason]
      message: "{player} has kicked {target} ({reason})."
    permission:
      description: Manages the permissions that are set for players individually.
      grant:
        description: Allows a permission for a player, for good or for the given time.
        syntax: <target> <permission> [duration]
        message: "{player} has granted {target} the {permission} permission."
        message_temporary: "{player} has granted {target} the {permission} permission for {time}."
      revoke:
        description: Denies a permission to a player, for good or for the given time.
        syntax: <target> <permission> [duration]
        message: "{player} has denied {target} the {permission} permission."
        message_temporary: "{player} has denied {target} the {permission} permission for {time}."
      reset:
        description: Removes what was set for a permission of a player, so that their role decides again.
        syntax: <target> <permission>
        message: "{player} has reset the {permission} permission of {target}."
      list:
        description: Lists the permissions that were set for a player individually.
        syntax: <target>
        role: "{target} has the {role} role."
        allowed: "Allowed for {target}: {permissions}."
        denied: "Denied for {target}: {permissions}."
        temporary_allowed: "Temporarily allowed for {target}: {permission} ({time} left)."
        temporary_denied: "Temporarily denied for {target}: {permission} ({time} left)."
        none: "{target} has no permissions of their own."
        character_allowed: "Allowed by the loaded character {character}: {permissions}."
        character_denied: "Denied by the loaded character {character}: {permissions}."
    respawn:
      description: "Respawns a player where they are, or where you are looking."
      syntax: "<target> [stay / tp]"
      message: "{target} was respawned by {player}."
    restart:
      description: Restarts the current map.
      syntax: "[delay]"
      message: "{player} is restarting the map in {delay} second(s)!"
    return:
      description: Bring a player back to their previous position before teleport.
      syntax: <target>
      message: "{player} returned {target} to their previous position."
    role:
      description: Sets and removes the roles of players.
      set:
        description: "Sets the role of a player. Roles: {groups}"
        syntax: <target> <role>
        message: "{player} has set {target}'s role to {group}."
      remove:
        description: Sets the role of a player back to user. A Steam ID demotes somebody who is not on the server.
        syntax: <target or Steam ID>
        message: "{player} has demoted {target} to user."
    send:
      description: Teleport a player to another player.
      syntax: <target> <destination player>
      message: "{player} has teleported {target} to {destination}."
    slay:
      description: Kills a player.
      syntax: <target>
      message: "{player} has slain {target}."
    report:
      description: 'Report to the staff members on those pesky issues.'
      syntax: <message>
    setarmor:
      description: 'Set the armor of a character to a custom value.'
      syntax: <target> <value>
      message: '{player} has set the armor of {target} to {armor}.'
    sethealth:
      description: 'Set the health of a character to a custom value.'
      syntax: <target> <value>
      message: '{player} has set the health of {target} to {health}.'
    staff:
      description: 'Talk to fellow staff members.'
      syntax: <message>
    tp:
      description: Teleport the player to the position you are looking at.
      syntax: <target>
      message: "{player} has teleported {target}."
    tpto:
      description: Teleport to the target's position.
      syntax: <target>
      message: "{player} has teleported to {target}."
    warn:
      description: Warns a player.
      syntax: <target> [reason]
      message: "{player} has warned {target} for {reason}."
  condition:
    role:
      name: Player with specific role
      text: Role {operator} {role}
      message: Select role
    roles: Roles
  config:
    bolt:
      title: Administration
      desc: Settings of the admin mod.
      ban_message_language:
        name: Ban message language
        desc: Code of the language (such as en or ru) of the message that banned players read when they try to join.
      root_steamid:
        name: Root access SteamID
        desc: Gives root access to the player with this SteamID.
      external_admin:
        name: External admin mod
        desc: Leaves the usergroups and privileges to another admin mod that speaks CAMI, which Bolt asks whether a player has a permission. When turned off, Bolt is the admin mod of the server and shares its roles with the other addons through CAMI.
  error:
    already_user: "{target} is a user already."
    banned:
      temporary: "You are banned from this server. Reason: {reason}. The ban ends in {time}."
      permanent: "You are permanently banned from this server. Reason: {reason}."
    character_permission:
      no_character: None of these players has a character loaded.
      not_set: "Nothing is set for the {permission} permission of the characters of these players."
    group_not_valid: "'{group}' is not a valid user group!"
    map_not_valid: "The server has no map called '{map}'!"
    not_banned: Steam ID '{steam_id}' is not banned!
    no_permission: You have no permissions to do that.
    permission_not_set: "Nothing is set for the {permission} permission of these players."
    permission_not_valid: "'{permission}' is not a valid permission!"
    permission_not_yours: "You cannot grant or revoke the {permission} permission, because you do not have it yourself."
    send_same: A player cannot be sent to themselves.
    slay: None of these players is alive.
    user_not_found: "Nobody with the Steam ID '{steam_id}' has ever joined this server."
  notification:
    announcement: "[Announcement] {text}"
    character_permission:
      granted: "Your character has been granted the {permission} permission."
      revoked: "Your character has been denied the {permission} permission."
      reset: "The {permission} permission of your character has been reset to what you and your role have."
    demote: You have been demoted from {group} to user.
    fullbright:
      enabled: Fullbright mode enabled.
      disabled: Fullbright mode disabled.
    permission:
      granted: "You have been granted the {permission} permission."
      revoked: "You have been denied the {permission} permission."
      reset: "Your {permission} permission has been reset to what your role allows."
    plugin_disabled: "{player} has disabled the {plugin} plugin. It stays loaded until the server restarts."
    plugin_enabled: "{player} has enabled the {plugin} plugin. It will be loaded after the server restarts."
    return: You have been returned to your previous position.
    setgroup: Your usergroup was set to {group}.
    slay: "You have been slain by {player}."
    setarmor: 'Your armor has been set to {armor}.'
    sethealth: 'Your health has been set to {health}.'
    tp: You have been teleported.
    freeze: "You've been frozen by {player}."
    unfreeze: "You've been unfrozen by {player}."
    warn: "You have been warned for {reason}."
    godmode:
      enabled: "God mode enabled."
      disabled: "God mode disabled."
    respawn: "You've been respawned by {player}."
    config_changed: "{player} has changed the {config} config to {value}."
    config_changed_restart: "{player} has changed the {config} config to {value}. The change takes effect after the server restarts."
  permission:
    categories:
      administration: Administration
      tools: Tools
      spawn: Spawn
      general: General
      misc: Misc
      level_design: Level design
      server_management: Server management
      player_management: Player management
      configuration: Configuration
      compatibility: Compatibility
    manage_plugins:
      name: Plugin manager
      description: Grants access to disable and enable plugins.
  role:
    user: The base rank that is automatically given to the player.
    assistant: A staff rank with the basic moderation tools, such as kicking, banning, vanishing and noclip.
    gamemaster: A trusted staff rank that runs the game world, with the spawning, item, money and level design tools.
    admin: The highest staff rank, with access to everything, including the configuration, permissions and plugins.
  ui:
    admin:
      player_management: Player management
      players: Players
      role: Role
      allow_all: Allow all
      no_all: "'No' for all"
      never_all: Forbid all
      expires: Expires in
      loading: Loading...
      layer:
        user: Player
        user_tooltip: The permissions of the player, on top of what their role allows. They apply to all of the player's characters.
        character: "Character: {name}"
        character_tooltip: The permissions of the character the player has loaded. They only apply while this character is loaded. A denial here or on the player always wins; an allowance here or on the player comes before the role.
        no_character: No character loaded
      decided:
        allowed: Allowed
        denied: Denied
        tooltip: What the player may do now, and what decides it. A denial set on the character or on the player wins, then an allowance set on either of them, then the role; a temporary value comes before a lasting one.
        root: root access
        character: character
        character_temporary: character, temporary
        user: player
        user_temporary: player, temporary
        role: role
      temp_permission:
        title: Give temporary permission
        message: Specify the permission duration. If the permission is already given, this time will be added to it. Leave empty to take the temporary permission.
      selector:
        title: Changing player's role
        message: Select a new role.
        roles: Roles
      config_editor: Config editor
      new_config: Add new table value
      new_config_text: Enter a new value.
      delete_config: Delete table value
      delete_config_text: Are you sure that you want to delete this value?
      config:
        reset: Reset to the default value
        static: This config is set in the files of the server and cannot be changed in game.
        reveal: Show or hide the value
        needs_restart: Changes of this config take effect after the server restarts.
        pending: "Until then its value is: {value}"
        select: Select a value
      bans:
        title: Bans
        search: Search by name, Steam ID or reason
        page:
          "1": "Page {page} of {pages} ({count} ban)"
          "2": "Page {page} of {pages} ({count} bans)"
        empty: There are no bans to show.
        permanent: Permanent
        expired: Expired
        banned_by: "banned by {admin}"
        unban: Unban
        unban_message: "Are you sure that you want to unban {name}?"
      staff:
        title: Staff
        empty: Nobody has a role other than user.
        online: Online
        offline: Offline
        demote: Demote
        demote_message: "Are you sure that you want to demote {name} from {role} to user?"
      plugins:
        title: Plugins
        notice: Disabling or enabling a plugin only takes effect after the server restarts or changes the map. Until then a disabled plugin stays loaded, and an enabled one stays out.
        enabled: Enabled. Click to disable.
        disabled: Disabled. Click to enable.
        author: "Author: {author}"
        depends: "Depends on: {plugins}"
        required_by: "Required by: {plugins}"
        state:
          loaded: Loaded
