      external_admin:
        name: "Mod d'administration externe"
        desc: "Laisse les groupes d'utilisateurs et les privilèges à un autre mod d'administration compatible CAMI, auquel Bolt demande si un joueur a une permission. Désactivé, Bolt est le mod d'administration du serveur et partage ses rangs avec les autres addons via CAMI."
