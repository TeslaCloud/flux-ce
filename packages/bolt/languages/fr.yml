fr:
  command:
    announce:
      description: "Affiche une annonce à tout le serveur."
      syntax: "<texte>"
    ban:
      description: "Bannit des joueurs et lève des bannissements."
      add:
        description: "Bannissez-moi ce vaurien ! Un Steam ID permet de bannir quelqu'un qui n'est pas sur le serveur."
        syntax: "<cible ou Steam ID> <durée> [raison]"
        message: "{player} a banni {target} pendant {time}. ({reason})."
        message_permanent: "{player} a banni {target} définitivement. ({reason})."
      remove:
        description: "Lève le bannissement d'un Steam ID."
        syntax: "<Steam ID>"
        message: "{player} a débanni {target}."
    bots:
      description: "Ajoute, expulse, gèle et dégèle des bots."
      add:
        description: "Ajoute le nombre de bots indiqué au serveur."
        syntax: "[quantité]"
        message:
          "1": "{player} a ajouté {amount} bot au serveur."
          "2": "{player} a ajouté {amount} bots au serveur."
      kick:
        description: "Expulse tous les bots."
        message: "{player} a expulsé tous les bots."
      freeze:
        description: "Gèle tous les bots."
        message: "{player} a gelé tous les bots."
      unfreeze:
        description: "Dégèle tous les bots."
        message: "{player} a dégelé tous les bots."
    changelevel:
      description: "Change de niveau pour la carte indiquée."
      syntax: "<carte> [délai]"
      message: "{player} change de niveau pour {map} dans {delay} seconde(s) !"
    charpermission:
      description: "Gère les permissions attribuées aux personnages que les joueurs ont chargés."
      grant:
        description: "Accorde une permission au personnage qu'un joueur a chargé, définitivement ou pour la durée indiquée, quoi qu'en dise le rôle, sauf si elle est refusée au joueur."
        syntax: "<cible> <permission> [durée]"
        message: "{player} a accordé au personnage {character} la permission {permission}."
        message_temporary: "{player} a accordé au personnage {character} la permission {permission} pour {time}."
      revoke:
        description: "Refuse une permission au personnage qu'un joueur a chargé, définitivement ou pour la durée indiquée, quoi qu'en disent le joueur et son rôle."
        syntax: "<cible> <permission> [durée]"
        message: "{player} a refusé au personnage {character} la permission {permission}."
        message_temporary: "{player} a refusé au personnage {character} la permission {permission} pour {time}."
      reset:
        description: "Retire ce qui a été défini pour une permission du personnage qu'un joueur a chargé, afin que les permissions propres du joueur et son rôle décident de nouveau."
        syntax: "<cible> <permission>"
        message: "{player} a réinitialisé la permission {permission} du personnage {character}."
        message_temporary: "{player} a retiré la valeur temporaire de la permission {permission} du personnage {character}."
      list:
        description: "Affiche les permissions définies pour le personnage qu'un joueur a chargé."
        syntax: "<cible>"
        allowed: "Autorisé pour le personnage {character} : {permissions}."
        denied: "Refusé pour le personnage {character} : {permissions}."
        temporary_allowed: "Autorisé temporairement pour le personnage {character} : {permission} ({time} restant)."
        temporary_denied: "Refusé temporairement pour le personnage {character} : {permission} ({time} restant)."
        none: "Le personnage {character} n'a aucune permission propre."
    freeze:
      description: "Gèle des joueurs sur place ou les dégèle."
      on:
        description: "Gèle un joueur."
        syntax: "<cible>"
        message: "{player} a gelé {target}."
      off:
        description: "Dégèle un joueur."
        syntax: "<cible>"
        message: "{player} a dégelé {target}."
    fullbright:
      description: "Active ou désactive pour un joueur le mode pleine lumière, qui ignore l'éclairage de la carte."
      on:
        description: "Active le mode pleine lumière pour un joueur."
        syntax: "<cible>"
        message: "{player} a activé le mode pleine lumière pour {target}."
      off:
        description: "Désactive le mode pleine lumière pour un joueur."
        syntax: "<cible>"
        message: "{player} a désactivé le mode pleine lumière pour {target}."
    godmode:
      description: "Active ou désactive le mode dieu pour un joueur."
      on:
        description: "Active le mode dieu pour un joueur."
        syntax: "<cible>"
        message: "{player} a activé le mode dieu pour {target}."
      off:
        description: "Désactive le mode dieu pour un joueur."
        syntax: "<cible>"
        message: "{player} a désactivé le mode dieu pour {target}."
    kick:
      description: "Expulse un joueur du serveur."
      syntax: "<cible> [raison]"
      message: "{player} a expulsé {target} ({reason})."
    permission:
      description: "Gère les permissions définies individuellement pour des joueurs."
      grant:
        description: "Accorde une permission à un joueur, définitivement ou pour la durée indiquée."
        syntax: "<cible> <permission> [durée]"
        message: "{player} a accordé la permission {permission} à {target}."
        message_temporary: "{player} a accordé la permission {permission} à {target} pendant {time}."
      revoke:
        description: "Refuse une permission à un joueur, définitivement ou pour la durée indiquée."
        syntax: "<cible> <permission> [durée]"
        message: "{player} a refusé la permission {permission} à {target}."
        message_temporary: "{player} a refusé la permission {permission} à {target} pendant {time}."
      reset:
        description: "Retire ce qui a été défini pour une permission d'un joueur, afin que son rôle en décide à nouveau."
        syntax: "<cible> <permission>"
        message: "{player} a réinitialisé la permission {permission} de {target}."
      list:
        description: "Liste les permissions définies individuellement pour un joueur."
        syntax: "<cible>"
        role: "{target} a le rôle {role}."
        allowed: "Accordées à {target} : {permissions}."
        denied: "Refusées à {target} : {permissions}."
        temporary_allowed: "Accordée temporairement à {target} : {permission} ({time} restant)."
        temporary_denied: "Refusée temporairement à {target} : {permission} ({time} restant)."
        none: "{target} n'a aucune permission qui lui soit propre."
        character_allowed: "Autorisé par le personnage chargé {character} : {permissions}."
        character_denied: "Refusé par le personnage chargé {character} : {permissions}."
    respawn:
      description: "Fait réapparaître un joueur là où il se trouve, ou là où vous regardez."
      syntax: "<cible> [stay / tp]"
      message: "{player} a fait réapparaître {target}."
    restart:
      description: "Redémarre la carte actuelle."
      syntax: "[délai]"
      message: "{player} redémarre la carte dans {delay} seconde(s) !"
    return:
      description: "Ramène un joueur à la position où il se trouvait avant d'être téléporté."
      syntax: "<cible>"
      message: "{player} a ramené {target} à sa position précédente."
    role:
      description: "Attribue et retire les rôles des joueurs."
      set:
        description: "Attribue un rôle à un joueur. Rôles : {groups}"
        syntax: "<cible> <rôle>"
        message: "{player} a attribué le rôle {group} à {target}."
      remove:
        description: "Remet le rôle d'un joueur à utilisateur. Un Steam ID permet de rétrograder quelqu'un qui n'est pas sur le serveur."
        syntax: "<cible ou Steam ID>"
        message: "{player} a rétrogradé {target} au rang d'utilisateur."
    send:
      description: "Téléporte un joueur auprès d'un autre joueur."
      syntax: "<cible> <joueur de destination>"
      message: "{player} a téléporté {target} auprès de {destination}."
    slay:
      description: "Tue un joueur."
      syntax: "<cible>"
      message: "{player} a tué {target}."
    report:
      description: "Signale aux membres de l'équipe ces problèmes agaçants."
      syntax: "<message>"
    setarmor:
      description: "Règle l'armure d'un personnage sur une valeur personnalisée."
      syntax: "<cible> <valeur>"
      message: "{player} a réglé l'armure de {target} sur {armor}."
    sethealth:
      description: "Règle la santé d'un personnage sur une valeur personnalisée."
      syntax: "<cible> <valeur>"
      message: "{player} a réglé la santé de {target} sur {health}."
    staff:
      description: "Parler aux autres membres de l'équipe."
      syntax: "<message>"
    tp:
      description: "Téléporte le joueur à l'endroit que vous regardez."
      syntax: "<cible>"
      message: "{player} a téléporté {target}."
    tpto:
      description: "Vous téléporte à la position de la cible."
      syntax: "<cible>"
      message: "{player} s'est téléporté auprès de {target}."
    warn:
      description: "Avertit un joueur."
      syntax: "<cible> [raison]"
      message: "{player} a averti {target} pour {reason}."
  condition:
    role:
      name: "Joueur ayant un rôle précis"
      text: "Rôle {operator} {role}"
      message: "Sélectionnez un rôle"
    roles: "Rôles"
  config:
