pt-br:
  command:
    announce:
      description: Mostra um aviso para todos no servidor.
      syntax: <texto>
    ban:
      description: Bane jogadores e remove banimentos.
      add:
        description: Bana esse infeliz! Com um Steam ID dá para banir alguém que não está no servidor.
        syntax: <alvo ou Steam ID> <duração> [motivo]
        message: "{player} baniu {target} por {time}. ({reason})."
        message_permanent: "{player} baniu {target} permanentemente. ({reason})."
      remove:
        description: Remove o banimento de um Steam ID.
        syntax: <Steam ID>
        message: "{player} desbaniu {target}."
    bots:
      description: Adiciona, expulsa, congela e descongela bots.
      add:
        description: Adiciona ao servidor a quantidade de bots especificada.
        syntax: "[quantidade]"
        message:
          "1": "{player} adicionou {amount} bot ao servidor."
          "2": "{player} adicionou {amount} bots ao servidor."
      kick:
        description: Expulsa todos os bots.
        message: "{player} expulsou todos os bots."
      freeze:
        description: Congela todos os bots.
        message: "{player} congelou todos os bots."
      unfreeze:
        description: Descongela todos os bots.
        message: "{player} descongelou todos os bots."
    changelevel:
      description: Muda o servidor para o mapa especificado.
      syntax: <mapa> [atraso]
      message: "{player} vai mudar o mapa para {map} em {delay} segundo(s)!"
    charpermission:
      description: Gerencia as permissões definidas para os personagens que os jogadores têm carregados.
      grant:
        description: Concede uma permissão ao personagem que um jogador tem carregado, permanentemente ou pelo tempo informado, não importa o que o cargo permita, a menos que ela esteja negada ao jogador.
        syntax: <alvo> <permissão> [duração]
        message: "{player} concedeu ao personagem {character} a permissão {permission}."
        message_temporary: "{player} concedeu ao personagem {character} a permissão {permission} por {time}."
      revoke:
        description: Nega uma permissão ao personagem que um jogador tem carregado, permanentemente ou pelo tempo informado, não importa o que o jogador e o cargo dele tenham.
        syntax: <alvo> <permissão> [duração]
        message: "{player} negou ao personagem {character} a permissão {permission}."
        message_temporary: "{player} negou ao personagem {character} a permissão {permission} por {time}."
      reset:
        description: Remove o que foi definido para uma permissão do personagem que um jogador tem carregado, para que as permissões do próprio jogador e o cargo dele voltem a decidir.
        syntax: <alvo> <permissão>
        message: "{player} redefiniu a permissão {permission} do personagem {character}."
        message_temporary: "{player} removeu o valor temporário da permissão {permission} do personagem {character}."
      list:
        description: Lista as permissões definidas para o personagem que um jogador tem carregado.
        syntax: <alvo>
        allowed: "Permitido para o personagem {character}: {permissions}."
        denied: "Negado para o personagem {character}: {permissions}."
        temporary_allowed: "Permitido temporariamente para o personagem {character}: {permission} (tempo restante: {time})."
        temporary_denied: "Negado temporariamente para o personagem {character}: {permission} (tempo restante: {time})."
        none: "O personagem {character} não tem permissões próprias."
    freeze:
      description: Congela jogadores no lugar ou os descongela.
      "on":
        description: Congela um jogador.
        syntax: <alvo>
        message: "{player} congelou {target}."
      "off":
        description: Descongela um jogador.
        syntax: <alvo>
        message: "{player} descongelou {target}."
    fullbright:
      description: Ativa ou desativa para um jogador o modo de brilho total, que ignora a iluminação do mapa.
      "on":
        description: Ativa o modo de brilho total para um jogador.
        syntax: <alvo>
        message: "{player} ativou o modo de brilho total para {target}."
      "off":
        description: Desativa o modo de brilho total para um jogador.
        syntax: <alvo>
        message: "{player} desativou o modo de brilho total para {target}."
    godmode:
      description: Ativa ou desativa o modo deus para um jogador.
      "on":
        description: Ativa o modo deus para um jogador.
        syntax: <alvo>
        message: "{player} ativou o modo deus para {target}."
      "off":
        description: Desativa o modo deus para um jogador.
        syntax: <alvo>
        message: "{player} desativou o modo deus para {target}."
    kick:
      description: Expulsa um jogador do servidor.
      syntax: <alvo> [motivo]
      message: "{player} expulsou {target} ({reason})."
    permission:
      description: Gerencia as permissões definidas individualmente para os jogadores.
      grant:
        description: Concede uma permissão a um jogador, permanentemente ou pelo tempo informado.
        syntax: <alvo> <permissão> [duração]
        message: "{player} concedeu a {target} a permissão {permission}."
        message_temporary: "{player} concedeu a {target} a permissão {permission} por {time}."
      revoke:
        description: Nega uma permissão a um jogador, permanentemente ou pelo tempo informado.
        syntax: <alvo> <permissão> [duração]
        message: "{player} negou a {target} a permissão {permission}."
        message_temporary: "{player} negou a {target} a permissão {permission} por {time}."
      reset:
        description: Remove o que foi definido para uma permissão de um jogador, para que o cargo dele volte a decidir.
        syntax: <alvo> <permissão>
        message: "{player} redefiniu a permissão {permission} de {target}."
      list:
        description: Lista as permissões definidas individualmente para um jogador.
        syntax: <alvo>
        role: "{target} tem o cargo {role}."
        allowed: "Permitido para {target}: {permissions}."
        denied: "Negado para {target}: {permissions}."
        temporary_allowed: "Permitido temporariamente para {target}: {permission} (tempo restante: {time})."
        temporary_denied: "Negado temporariamente para {target}: {permission} (tempo restante: {time})."
        none: "{target} não tem permissões próprias."
        character_allowed: "Permitido pelo personagem carregado {character}: {permissions}."
        character_denied: "Negado pelo personagem carregado {character}: {permissions}."
    respawn:
      description: "Faz um jogador renascer onde está, ou onde você está olhando."
      syntax: "<alvo> [stay / tp]"
      message: "{player} fez {target} renascer."
    restart:
      description: Reinicia o mapa atual.
      syntax: "[atraso]"
      message: "{player} vai reiniciar o mapa em {delay} segundo(s)!"
    return:
      description: Devolve um jogador à posição em que estava antes do teleporte.
      syntax: <alvo>
      message: "{player} devolveu {target} à posição anterior."
    role:
      description: Define e remove os cargos dos jogadores.
      set:
        description: "Define o cargo de um jogador. Cargos: {groups}"
        syntax: <alvo> <cargo>
        message: "{player} definiu o cargo de {target} como {group}."
      remove:
        description: Devolve um jogador ao cargo de usuário. Com um Steam ID dá para rebaixar alguém que não está no servidor.
        syntax: <alvo ou Steam ID>
        message: "{player} rebaixou {target} a usuário."
    send:
      description: Teleporta um jogador até outro jogador.
      syntax: <alvo> <jogador de destino>
      message: "{player} teleportou {target} até {destination}."
    slay:
      description: Mata um jogador.
      syntax: <alvo>
      message: "{player} matou {target}."
    report:
      description: Avisa os membros da staff sobre aqueles problemas chatos.
      syntax: <mensagem>
    setarmor:
      description: Define a armadura de um personagem com um valor personalizado.
      syntax: <alvo> <valor>
      message: "{player} definiu a armadura de {target} como {armor}."
    sethealth:
      description: Define a vida de um personagem com um valor personalizado.
      syntax: <alvo> <valor>
      message: "{player} definiu a vida de {target} como {health}."
    staff:
      description: Fala com os outros membros da staff.
      syntax: <mensagem>
    tp:
      description: Teleporta o jogador para a posição que você está olhando.
      syntax: <alvo>
      message: "{player} teleportou {target}."
    tpto:
      description: Teleporta você para a posição do alvo.
      syntax: <alvo>
      message: "{player} se teleportou até {target}."
    warn:
      description: Dá uma advertência a um jogador.
      syntax: <alvo> [motivo]
      message: "{player} advertiu {target} por {reason}."
  condition:
    role:
      name: Jogador com um cargo específico
      text: "Cargo {operator} {role}"
      message: Selecione um cargo
    roles: Cargos
  config:
    bolt:
      title: Administração
      desc: Configurações do mod de administração.
      ban_message_language:
        name: Idioma da mensagem de banimento
        desc: Código do idioma (como en ou ru) da mensagem que os jogadores banidos leem ao tentar entrar.
      root_steamid:
        name: SteamID com acesso root
        desc: Dá acesso root ao jogador com este SteamID.
      external_admin:
        name: Mod de administração externo
        desc: Deixa os grupos de usuários e os privilégios por conta de outro mod de administração compatível com CAMI, ao qual o Bolt pergunta se um jogador tem uma permissão. Com a opção desativada, o Bolt é o mod de administração do servidor e compartilha seus cargos com os outros addons por meio do CAMI.
  error:
