# Plugin profiles: named sets of framework plugins that a schema picks with `profile:` in its
# <schema>.yml. A profile lists its plugins under `plugins` and may build on another profile
# with `extends`, whose plugins come first. The schema adds plugins with `depends` (and, in
# development, `depends_development`) and leaves profile plugins out with `exclude`; a plugin
# that another loaded plugin depends on is loaded all the same. A schema without `profile`
# loads its `depends` alone. A `profiles.local.yml` next to this file is read in its place.
#
# Opt-in plugins, in no profile, for a schema to add with `depends`:
#   cinematics, combat, d20, gamemastery, levels, limbs, radios, srcdsproxy
# Development tools, for `depends_development`: dev_hud, profiler
# Libraries that load as dependencies of other plugins: areas (area_display, srcdsproxy; listed
# in sandbox)

base:
  plugins:
    - 3d_texts
    - chatbox
    - crosshair
    - hints
    - observer
    - stamina
    - static_ents
    - third_person
    - weapon_select

sandbox:
  extends: base
  plugins:
    - areas
    - prop_protection

roleplay:
  extends: base
  plugins:
    - characters
    - factions
    - auto_walk
    - raise_gun

roleplay_full:
  extends: roleplay
  plugins:
    - items
    - containers
    - currencies
    - vendors
    - doors
    - door_keys
    - area_display
    - map_scenes
    - ragdoll
    - visible_legs
    - shared_flashlight
    - pickup_objects
    - display_typing
    - spawn_points
    - spawn_saver
    - stats
    - damage
    - prop_protection
    - map_cleaner
    - game_time
    - screen_effects
    - rp_commands
    - recognize
    - voice_lines
    - player_search
    - animations
