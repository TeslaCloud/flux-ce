#
# Use this file to register new configs related to Flux itself.
#
# Looking for Flux framework settings? Check out the settings.yml file!
#
# !!!!
# DO NOT USE THIS FILE TO REGISTER CONFIGURATION FOR YOUR SCHEMA
# OR PLUGIN.
#
# If you wish to add configuration to your plugin, create a similar
# file in the following path:
# plugins/<your_plugin>/plugin/config/config.yml
# gamemodes/<your_schema>/schema/config/config.yml
# !!!!
#
# Besides the fields used below, a config can be marked with:
#   hidden: true          - the value is never sent to clients.
#   static: true          - cannot be changed in game, the value comes from
#                           the files only.
#   private: true         - the value is only sent to the players who are
#                           allowed to edit the configuration, and is masked
#                           when a change is announced.
#   needs_restart: true   - a change made in game is stored and takes effect
#                           the next time the server starts.
#
categories:
  flow:
    name: config.flow.title
    description: config.flow.desc
configs:
  flow_walk_speed:
    renamed_from: walk_speed
    name: config.flow.walk_speed.name
    description: config.flow.walk_speed.desc
    category: flow
    type: number
    min_value: 0
    max_value: 1024
    default_value: 100
  flow_run_speed:
    renamed_from: run_speed
    name: config.flow.run_speed.name
    description: config.flow.run_speed.desc
    category: flow
    type: number
    min_value: 0
    max_value: 1024
    default_value: 200
  flow_crouch_speed:
    renamed_from: crouched_speed
    name: config.flow.crouch_speed.name
    description: config.flow.crouch_speed.desc
    category: flow
    type: number
    min_value: 0
    max_value: 1024
    default_value: 50
  flow_respawn_delay:
    renamed_from: respawn_delay
    name: config.flow.respawn_delay.name
    description: config.flow.respawn_delay.desc
    category: flow
    type: number
    min_value: 0
    max_value: 600
    default_value: 30
  flow_command_prefixes:
    renamed_from: command_prefixes
    name: config.flow.command_prefixes.name
    description: config.flow.command_prefixes.desc
    category: flow
    type: table
    default_value: ["!", "/"]
  flow_jump_power:
    renamed_from: jump_power
    name: config.flow.jump_power.name
    description: config.flow.jump_power.desc
    category: flow
    type: number
    min_value: 0
    max_value: 1024
    default_value: 150
  flow_data_save_interval:
    renamed_from: data_save_interval
    name: config.flow.data_save_interval.name
    description: config.flow.data_save_interval.desc
    category: flow
    type: number
    min_value: 0
    max_value: 3600
    default_value: 360
