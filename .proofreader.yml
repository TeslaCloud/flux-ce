AllReaders:
  Exclude:
    - 'docs/**/*'
    - '**/*.min.lua'
    - 'packages/yaml/lib/yaml.lua'
    - 'packages/sfs/lib/sfs.lua'
    - 'packages/cami/lib/cami.lua'
    - 'packages/tween/**/*'
    - 'packages/utf8/**/*'

Style/IncompleteDocumentation:
  Enabled: true

Lint/UncheckedEntityInCallback:
  EntityNames: ['actor', 'ply', 'player', 'pl', 'client', 'ent', 'entity', 'target', 'victim',
                'attacker', 'inflictor', 'owner', 'weapon', 'wep', 'npc', 'vehicle', 'ragdoll',
                'prop', 'panel']

Style/BitOperators:
  Enabled: true

Style/CompoundAssignment:
  Enabled: true

Style/NumericSeparators:
  Enabled: true

Style/ShortFunction:
  Enabled: true

Style/TernaryOperator:
  Enabled: true
