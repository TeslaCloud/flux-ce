ru:
  config:
    containers:
      title: Контейнеры
      desc: Настройка контейнеров для вашего сервера.
      password_delay:
        name: Задержка после неверного пароля
        desc: Сколько секунд игрок должен ждать после ввода неверного пароля от контейнера, прежде чем попробовать снова.
      spill_items:
        name: Высыпать предметы при удалении
        desc: Выпадают ли предметы контейнера на землю при его удалении. Иначе они уничтожаются вместе с ним.
  container:
    box:
      title: Картонная коробка
      desc: Обыкновенная картонная коробка. Нет, Вы не можете спрятаться в ней.
    cupboard:
      title: Настенный шкаф
      desc: Деревянный настенный шкаф с тремя полочками внутри.
    drawer:
      title: Комод
      desc: Очень старый тяжелый комод со множеством выдвижных ящиков.
    small_drawer:
      title: Прикроватный комод
      desc: Небольшой прикроватный комод с единственным ящичком.
    tall_drawer:
      title: Высокий комод
      desc: Узкий высокий комод со множеством выдвижных ящичков.
    dresser:
      title: Шкаф
      desc: Большой шкаф для одежды. Внутри есть несколько вешалок.
    fridge:
      title: Старый холодильник
      desc: Небольшой старенький холодильник, из которого доносится характерный запах.
    lockers:
      title: Металлические шкафчики
      desc: Четыре металлических шкафчика с крючком для одежды и парой полок внутри.
    barrel:
      title: Бочка
      desc: Самая обычная бочка, слегка покрытая ржавчиной.
    desk:
      title: Письменный стол
      desc: Стол для письма с несколькими выдвижными ящичками.
    medium_box:
      title: Коробка
      desc: Небольшая картонная коробка.
    small_box:
      title: Маленькая коробка
      desc: Очень маленькая коробочка, в которой удобно хранить всякую мелочь.
    trash_bin:
      title: Мусорный бак
      desc: Вполне вместительный мусорный бак из пластика.
    dumpster:
      title: Большой мусорный бак
      desc: Огромный бак, в который может вместиться очень много мусора.
    wooden_crate:
      title: Деревянный ящик
      desc: Обычный ящик из дерева.
    big_wooden_crate:
      title: Большой деревянный ящик
      desc: Обычный ящик из дерева, только подлиннее.
    file_cabinet:
      title: Картотечный шкаф
      desc: Небольшой шкаф, который обычно используют для хранения бумаг.
    tall_file_cabinet:
      title: Высокий картотечный шкаф
      desc: Высокий шкаф с четырьмя выдвижными ящиками под документы и бумаги.
    storage_closet:
      title: Металлический шкаф
      desc: Большой металлический шкаф с несколькими полками внутри.
    large_fridge:
      title: Большой холодильник
      desc: Просто огромный холодильник со множеством полок как внутри, так и на дверце.
    counter:
      title: Кухонная стойка
      desc: Вместительная стойка для хранения кухонных принадлежностей.
    metal_box:
      title: Металлический ящик
      desc: Большой ящик, который обычно используют для хранения оружия.
    medium_wooden_crate:
      title: Небольшой деревянный ящик
      desc: Средних размеров ящик из дерева.
    small_parts_bin:
      title: Шкафчик для запчастей
      desc: Небольшой шкафчик со множеством отсеков для хранения самых разных мелочей.
    small_dresser_table:
      title: Стол для макияжа
      desc: Старый стол без зеркала в нём.
    medium_water_barrel:
      title: Бочка для воды
      desc: Высокая пластиковая бочка, используемая для хранения воды.
    medium_cash_reg:
      title: Кассовый аппарат
      desc: Кассовый аппарат старого образца.
  error:
    container:
      not_valid: Это не контейнер!
      wrong_password: Вы ввели неверный пароль!
      password_wait: "Подождите {time}, прежде чем вводить пароль снова!"
      no_items: Нет предметов, которыми можно заполнить этот контейнер!
      no_space: В этот контейнер ничего не удалось добавить!
  notification:
    container:
      message: "{name}: {message}"
      name_set: "Вы назвали этот контейнер '{name}'."
      name_removed: Вы убрали название этого контейнера.
      message_set: Вы установили сообщение этого контейнера.
      message_removed: Вы убрали сообщение этого контейнера.
      password_set: "Вы установили пароль этого контейнера: '{password}'."
      password_removed: Вы убрали пароль этого контейнера.
      filled:
        "1": "Вы добавили в этот контейнер {count} случайный предмет."
        "2": "Вы добавили в этот контейнер {count} случайных предмета."
        "5": "Вы добавили в этот контейнер {count} случайных предметов."
  tool:
    container:
      name: Редактор Контейнеров
      desc: Задаёт название, сообщение или пароль контейнера либо заполняет его случайными предметами.
      "0": "ЛКМ: Применить, ПКМ: Убрать название, сообщение или пароль."
      mode: Режим
      mode_name: Задать название
      mode_message: Задать сообщение
      mode_password: Задать пароль
      mode_fill: Заполнить случайными предметами
      custom_name: Название
      message: Сообщение
      password: Пароль
      share: "Заполнить до (% слотов)"
      category: Категория
      any_category: Любая категория
  ui:
    container:
      open: Открыть
      password:
        title: Пароль
        message: Какой пароль у этого контейнера?
