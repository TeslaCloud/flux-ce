en:
  config:
    containers:
      title: Containers
      desc: Customize how containers work on your server!
      password_delay:
        name: Password retry delay
        desc: How long a player has to wait after entering a wrong container password before they can try again (in seconds).
      spill_items:
        name: Spill items on removal
        desc: Whether the items of a container are dropped on the ground when the container is removed. They are destroyed with it otherwise.
