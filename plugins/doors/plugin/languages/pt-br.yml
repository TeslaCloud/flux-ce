pt-br:
  config:
    doors:
      title: Portas
      desc: Configurações de propriedade e trancamento de portas.
      price:
        name: Preço da porta
        desc: Quanto custa uma porta que pode ter dono, a menos que a staff tenha dado a ela um preço próprio. Defina como 0 para que as portas sejam gratuitas.
      sell_share:
        name: Reembolso na venda
        desc: A porcentagem do preço pago por uma porta que o dono recebe de volta ao vendê-la.
      limit:
        name: Limite de portas
        desc: Quantas portas um personagem pode ter, com as portas vinculadas contando como uma só. Defina como 0 para desativar o limite.
      lock_time:
        name: Tempo para trancar
        desc: Quantos segundos leva para trancar uma porta. Defina como 0 para trancar as portas na hora.
      unlock_time:
        name: Tempo para destrancar
        desc: Quantos segundos leva para destrancar uma porta. Defina como 0 para destrancar as portas na hora.
      text_length:
        name: Tamanho do texto da porta
        desc: O texto mais longo, em caracteres, que o dono de uma porta pode colocar nela.
      access_entries:
        name: Entradas de acesso da porta
        desc: Quantos personagens podem receber acesso a uma mesma porta, com as portas vinculadas contando como uma só.
  door:
    categories:
      general: Geral
      ownership: Propriedade
    properties:
      name: Nome
      title_type:
        name: Tipo de título
        select: Selecione...
      locked: Trancada
      ownable: Pode ter dono
      price: Preço (vazio para o padrão)
    title_type:
      none: "Desativado"
      center: "Centralizado"
  error:
