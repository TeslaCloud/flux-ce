      cant_afford: "Você não tem como pagar por esta porta, ela custa {value} {currency}!"
      cannot_buy: Você não pode comprar esta porta!
      cannot_sell: Você não pode vender esta porta!
      cannot_change_access: Você não pode alterar o acesso a esta porta!
      invalid_character: Não é possível dar nem negar acesso a este personagem!
