ru:
  config:
    doors:
      title: Двери
      desc: Настройки владения дверьми и их запирания.
      price:
        name: Цена двери
        desc: Сколько стоит доступная для покупки дверь, если администрация не назначила ей свою цену. Установите 0, чтобы двери были бесплатными.
      sell_share:
        name: Доля при продаже двери
        desc: Какой процент уплаченной за дверь цены владелец получает обратно при её продаже.
      limit:
        name: Лимит дверей
        desc: Сколько дверей может принадлежать одному персонажу, связанные двери считаются за одну. Установите 0, чтобы отключить лимит.
      lock_time:
        name: Время запирания двери
        desc: Сколько секунд занимает запирание двери. Установите 0, чтобы двери запирались мгновенно.
      unlock_time:
        name: Время отпирания двери
        desc: Сколько секунд занимает отпирание двери. Установите 0, чтобы двери отпирались мгновенно.
      text_length:
        name: Длина текста на двери
        desc: Самый длинный текст в символах, который владелец двери может на ней разместить.
      access_entries:
        name: Записи доступа к двери
        desc: Скольким персонажам можно выдать доступ к одной двери, связанные двери считаются за одну.
