ru:
  command:
    settime:
      description: "Устанавливает игровую дату и время. Укажите дату, время суток или и то, и другое, например 2020-01-01 08:00."
      syntax: "[ГГГГ-ММ-ДД] [ЧЧ:ММ]"
      message: "{player} устанавливает игровое время на {time}."
  config:
    gametime:
      title: Игровое время
      desc: Настройки игровых часов и календаря.
      minute_length:
        name: Длина минуты
        desc: "Сколько реальных секунд длится игровая минута. При значении 60 игровые часы идут с той же скоростью, что и настоящие."
      start:
        name: Начальная дата
        desc: "Дата и время, с которых начинают идти игровые часы, пока игровое время ещё не было сохранено, в виде ГГГГ-ММ-ДД ЧЧ:ММ."
      real_time:
        name: Следовать реальному времени
        desc: "Игровые часы показывают реальные дату и время сервера, а не идут сами по себе."
  error:
    gametime:
      invalid: Эта дата выходит за пределы игрового календаря.
      invalid_format: "Это не дата и не время. Запишите их в виде ГГГГ-ММ-ДД ЧЧ:ММ или укажите только дату или только время."
      not_ready: Игровые часы ещё не запущены.
      real_time: Игровые часы следуют реальному времени сервера, установить их нельзя.
  gametime:
    am: ДП
    pm: ПП
    format:
      date: "{weekday}, {day} {month} {year} г."
      date_short: "{day}.{month}.{year}"
      date_time: "{date}, {time}"
    months:
      january: января
      february: февраля
      march: марта
      april: апреля
      may: мая
      june: июня
      july: июля
      august: августа
      september: сентября
      october: октября
      november: ноября
      december: декабря
    weekdays:
      monday: Понедельник
      tuesday: Вторник
      wednesday: Среда
      thursday: Четверг
      friday: Пятница
      saturday: Суббота
      sunday: Воскресенье
  settings:
    gametime:
      clock:
        name: Показывать игровые часы
        desc: "Показывать игровые дату и время в правом верхнем углу меню, которое открывается клавишей TAB."
      twelve_hour:
        name: "12-часовой формат игровых часов"
        desc: "Показывать игровое время в 12-часовом формате (5:05 ПП) вместо 24-часового (17:05)."
