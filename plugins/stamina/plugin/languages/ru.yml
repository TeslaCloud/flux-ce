ru:
  config:
    stamina:
      title: Выносливость
      desc: Настройка плагина на выносливость.
      stam_drain_scale:
        name: Скорость убывания
        desc: Как быстро должна кончаться выносливость. Зависит от тикрейта сервера.
      stam_regen_scale:
        name: Скорость восстановления
        desc: Как быстро восстанавливается выносливость. Зависит от тикрейта сервера.
      stam_jump_penalty:
        name: Затраты на прыжок
        desc: Как много выносливости будет тратиться на прыжок.
      stam_max:
        name: Максимальная выносливость
        desc: Максимальный уровень выносливости игрока.
      stam_regen_delay:
        name: Задержка перед восстановлением
        desc: Как долго нужно подождать, прежде чем выносливость начнет восстанавливаться.
      stam_health_drain_scale:
        name: Влияние здоровья на убывание
        desc: Насколько быстрее убывает выносливость раненого игрока. При значении 1 игрок, который почти мёртв, устаёт вдвое быстрее; 0 отключает эту зависимость.
      stam_crouch_regen_scale:
        name: Скорость восстановления сидя
        desc: Во сколько раз быстрее восстанавливается выносливость, пока игрок сидит. 1 отключает ускорение.
      stam_slowdown_threshold:
        name: Порог замедления
        desc: Процент от максимальной выносливости, ниже которого бегущий игрок постепенно замедляется до скорости ходьбы и должен перестать бежать, чтобы восстановить силы. При значении 0 игрок бежит с полной скоростью, пока выносливость не закончится.
      stam_persistent:
        name: Сохранять выносливость
        desc: Сохранять ли выносливость вместе с персонажем и восстанавливать её при его загрузке. Иначе загруженный персонаж всегда начинает с полной выносливостью.
