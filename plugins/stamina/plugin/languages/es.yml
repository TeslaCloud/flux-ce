es:
  config:
    stamina:
      title: Aguante
      desc: Ajustes del plugin de aguante.
      drain_scale:
        name: Escala de consumo
        desc: Lo rápido que se consume el aguante.
      regen_scale:
        name: Escala de regeneración
        desc: Lo rápido que se regenera el aguante.
      jump_penalty:
        name: Penalización por salto
        desc: Cuántos puntos de aguante se quitan cuando el jugador salta.
      max:
        name: Aguante máximo
        desc: Valor máximo del aguante del jugador.
      regen_delay:
        name: Retraso de regeneración
        desc: Cuántos segundos esperar antes de empezar a regenerar el aguante.
      health_drain_scale:
        name: Escala de consumo por salud
        desc: Cuánto más rápido se consume el aguante de un jugador herido. Con 1, un jugador casi muerto se cansa el doble de rápido; 0 lo desactiva.
      crouch_regen_scale:
        name: Escala de regeneración agachado
        desc: Cuántas veces más rápido se regenera el aguante mientras el jugador está agachado. 1 lo desactiva.
      slowdown_threshold:
        name: Umbral de ralentización
        desc: Porcentaje del aguante máximo por debajo del cual un jugador que corre se ralentiza poco a poco hasta la velocidad de caminar y tiene que dejar de esprintar para recuperarse. Con 0, el jugador corre a toda velocidad hasta que se le acaba el aguante.
      persistent:
        name: Guardar aguante
        desc: Si el aguante se guarda con el personaje y se restaura al cargarlo. De lo contrario, un personaje cargado siempre empieza con el aguante al máximo.
