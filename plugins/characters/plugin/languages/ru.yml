ru:
  command:
    charsetname:
      description: Выставляет имя персонажа.
      syntax: <игрок> <новое имя>
      message: "{player} меняет имя {target} на {name}."
    charsetmodel:
      description: Выставляет модель персонажа.
      syntax: <игрок> <новая модель>
      message: "{player} меняет модель {target} на {model}."
    charsetdesc:
      description: Выставляет описание персонажа.
      syntax: <игрок> <новое описание>
      message: "{player} меняет описание {target} на {desc}."
    charsetgender:
      description: "Выставляет пол персонажа: male, female или no_gender."
      syntax: <игрок> <новый пол>
      message: "{player} меняет пол {target} на {gender}."
    charban:
      description: Блокирует активного персонажа игрока.
      syntax: <игрок>
      message: "{player} блокирует персонажа {target}."
    charunban:
      description: Снимает блокировку с персонажа по его имени, даже если игрок не в сети.
      syntax: <имя персонажа>
      message: "{player} снимает блокировку с персонажа {target}."
    charphysdesc:
      description: Меняет описание вашего персонажа.
      syntax: "[новое описание]"
  condition:
    character:
      name: Определенный персонаж
