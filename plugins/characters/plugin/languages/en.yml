en:
  command:
    charsetname:
      description: "Set a character's name."
      syntax: <target> <new name>
      message: "{player} has set {target}'s name to {name}."
    charsetmodel:
      description: "Set a character's model."
      syntax: <target> <new model>
      message: "{player} has set {target}'s model to {model}."
    charsetdesc:
      description: "Set a character's physical description."
      syntax: <target> <new desc>
      message: "{player} has set {target}'s description to {desc}."
    charsetgender:
      description: "Set a character's gender: male, female or no_gender."
      syntax: <target> <new gender>
      message: "{player} has set {target}'s gender to {gender}."
    charban:
      description: "Ban a player's active character."
      syntax: <target>
      message: "{player} has banned the character {target}."
    charunban:
      description: "Unban a character by its name, even if its player is offline."
      syntax: <character name>
      message: "{player} has unbanned the character {target}."
    charphysdesc:
      description: "Change your character's physical description."
      syntax: "[new description]"
  condition:
