es:
  command:
    charsetname:
      description: "Cambia el nombre de un personaje."
      syntax: <jugador> <nuevo nombre>
      message: "{player} ha cambiado el nombre de {target} a {name}."
    charsetmodel:
      description: "Cambia el modelo de un personaje."
      syntax: <jugador> <nuevo modelo>
      message: "{player} ha cambiado el modelo de {target} a {model}."
    charsetdesc:
      description: "Cambia la descripción física de un personaje."
      syntax: <jugador> <nueva descripción>
      message: "{player} ha cambiado la descripción de {target} a {desc}."
    charsetgender:
      description: "Cambia el género de un personaje: male, female o no_gender."
      syntax: <jugador> <nuevo género>
      message: "{player} ha cambiado el género de {target} a {gender}."
    charban:
      description: "Bloquea y desbloquea personajes."
      add:
        description: "Bloquea el personaje activo de un jugador."
        syntax: <jugador>
        message: "{player} ha bloqueado al personaje {target}."
      remove:
        description: "Desbloquea un personaje por su nombre completo, aunque su jugador no esté conectado."
        syntax: <nombre del personaje>
        message: "{player} ha desbloqueado al personaje {target}."
    charphysdesc:
      description: "Cambia la descripción física de tu personaje."
      syntax: "[nueva descripción]"
