fr:
  command:
    charsetname:
      description: "Change le nom d'un personnage."
      syntax: "<cible> <nouveau nom>"
      message: "{player} a changé le nom de {target} en {name}."
    charsetmodel:
      description: "Change le modèle d'un personnage."
      syntax: "<cible> <nouveau modèle>"
      message: "{player} a changé le modèle de {target} en {model}."
    charsetdesc:
      description: "Change la description physique d'un personnage."
      syntax: "<cible> <nouvelle description>"
      message: "{player} a changé la description de {target} en {desc}."
    charsetgender:
      description: "Change le genre d'un personnage : male, female ou no_gender."
      syntax: "<cible> <nouveau genre>"
      message: "{player} a changé le genre de {target} en {gender}."
    charban:
      description: "Bannit et débannit des personnages."
      add:
        description: "Bannit le personnage actif d'un joueur."
        syntax: "<cible>"
        message: "{player} a banni le personnage {target}."
      remove:
        description: "Débannit un personnage d'après son nom complet, même si son joueur n'est pas connecté."
        syntax: "<nom du personnage>"
        message: "{player} a débanni le personnage {target}."
    charphysdesc:
      description: "Change la description physique de votre personnage."
      syntax: "[nouvelle description]"
  condition:
    character:
