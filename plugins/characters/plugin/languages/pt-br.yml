pt-br:
  command:
    charsetname:
      description: "Define o nome de um personagem."
      syntax: <alvo> <novo nome>
      message: "{player} definiu o nome de {target} como {name}."
    charsetmodel:
      description: "Define o modelo de um personagem."
      syntax: <alvo> <novo modelo>
      message: "{player} definiu o modelo de {target} como {model}."
    charsetdesc:
      description: "Define a descrição física de um personagem."
      syntax: <alvo> <nova descrição>
      message: "{player} definiu a descrição de {target} como {desc}."
    charsetgender:
      description: "Define o gênero de um personagem: male, female ou no_gender."
      syntax: <alvo> <novo gênero>
      message: "{player} definiu o gênero de {target} como {gender}."
    charban:
      description: "Bane e desbane personagens."
      add:
        description: "Bane o personagem ativo de um jogador."
        syntax: <alvo>
        message: "{player} baniu o personagem {target}."
      remove:
        description: "Desbane um personagem pelo nome completo, mesmo que o jogador dele esteja offline."
        syntax: <nome do personagem>
        message: "{player} desbaniu o personagem {target}."
    charphysdesc:
      description: "Muda a descrição física do seu personagem."
      syntax: "[nova descrição]"
  condition:
