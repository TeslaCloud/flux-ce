ru:
  config:
    pickup:
      title: Поднятие предметов
      desc: Перенос, бросание и перетаскивание предметов руками.
      max_mass:
        name: Максимальная масса
        desc: Самый тяжелый предмет в килограммах, который игрок может поднять и нести в руках. Плагины могут менять предел для каждого игрока.
      throw_force:
        name: Сила броска
        desc: Насколько сильно бросается несомый предмет. Установите 0, чтобы отключить бросание.
      drag_ragdolls:
        name: Перетаскивание регдоллов
        desc: Тащится ли регдолл по земле за схваченную конечность вместо того, чтобы нести его, независимо от его веса.
