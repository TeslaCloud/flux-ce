ru:
  config:
    shared_flashlight:
      title: Общий фонарик
      desc: Настройки фонарика, который видят все игроки.
      enabled:
        name: Общий фонарик
        desc: Является ли фонарик светом, который видят все игроки. Если выключено, используется фонарик движка, который видит только его владелец.
      fov:
        name: Ширина луча
        desc: Угол луча фонарика в градусах.
      distance:
        name: Дальность луча
        desc: Как далеко светит фонарик, в юнитах.
      brightness:
        name: Яркость
        desc: Насколько ярок фонарик. 1 соответствует яркости фонарика движка.
      shadows:
        name: Тени
        desc: Отбрасывает ли фонарик тени. Тени снижают производительность на загруженных серверах.
