categories:
  shared_flashlight:
    name: config.shared_flashlight.title
    description: config.shared_flashlight.desc
configs:
  shared_flashlight_enabled:
    name: config.shared_flashlight.enabled.name
    description: config.shared_flashlight.enabled.desc
    category: shared_flashlight
    type: boolean
    default_value: true
  shared_flashlight_fov:
    renamed_from: flashlight_fov
    name: config.shared_flashlight.fov.name
    description: config.shared_flashlight.fov.desc
    category: shared_flashlight
    type: number
    min_value: 10
    max_value: 120
    default_value: 50
  shared_flashlight_distance:
    renamed_from: flashlight_distance
    name: config.shared_flashlight.distance.name
    description: config.shared_flashlight.distance.desc
    category: shared_flashlight
    type: number
    min_value: 128
    max_value: 4096
    default_value: 1024
  shared_flashlight_brightness:
    renamed_from: flashlight_brightness
    name: config.shared_flashlight.brightness.name
    description: config.shared_flashlight.brightness.desc
    category: shared_flashlight
    type: number
    min_value: 0.1
    max_value: 10
    decimals: 1
    default_value: 1
  shared_flashlight_shadows:
    renamed_from: flashlight_shadows
    name: config.shared_flashlight.shadows.name
    description: config.shared_flashlight.shadows.desc
    category: shared_flashlight
    type: boolean
    default_value: true
  shared_flashlight_item:
    name: config.shared_flashlight.item.name
    description: config.shared_flashlight.item.desc
    category: shared_flashlight
    type: string
    default_value: ''
