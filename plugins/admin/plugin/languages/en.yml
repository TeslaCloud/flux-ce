en:
  command:
    announce:
      description: Shows a notice to everyone on the server.
      syntax: <text>
    ban:
      description: Ban this sucker! A Steam ID bans somebody who is not on the server.
      syntax: <target or Steam ID> <duration> [reason]
      message: "{player} has banned {target} for {time}. ({reason})."
      message_permanent: "{player} has banned {target} permanently. ({reason})."
    freezebots:
      description: Freezes all of the bots.
      message: "{player} has frozen all bots."
    unfreezebots:
      description: Unfreezes all of the bots.
      message: "{player} has unfrozen all bots."
    addbots:
      description: Adds the specified amount of bots to the server.
      syntax: "[number Amount]"
      message:
        "1": "{player} has added {amount} bot to the server."
        "2": "{player} has added {amount} bots to the server."
    kickbots:
      description: Kicks all bots.
      message: "{player} has kicked all bots."
    changelevel:
      description: Changes the level to the specified map.
      syntax: <string Map> [number Delay]
      message: "{player} is changing the level to {map} in {delay} second(s)!"
    demote:
      description: Demote a player to user. A Steam ID demotes somebody who is not on the server.
      syntax: <target or Steam ID>
      message: "{player} has demoted {target} to user."
    grant:
      description: Allows a permission for a player, for good or for the given time.
      syntax: <target> <permission> [duration]
      message: "{player} has granted {target} the {permission} permission."
      message_temporary: "{player} has granted {target} the {permission} permission for {time}."
    kick:
      description: Kicks a player from the server.
      syntax: <target> [reason]
      message: "{player} has kicked {target} ({reason})."
    permissions:
      description: Lists the permissions that were set for a player individually.
      syntax: <target>
      role: "{target} has the {role} role."
      allowed: "Allowed for {target}: {permissions}."
      denied: "Denied for {target}: {permissions}."
      temporary_allowed: "Temporarily allowed for {target}: {permission} ({time} left)."
      temporary_denied: "Temporarily denied for {target}: {permission} ({time} left)."
      none: "{target} has no permissions of their own."
    resetpermission:
      description: Removes what was set for a permission of a player, so that their role decides again.
      syntax: <target> <permission>
      message: "{player} has reset the {permission} permission of {target}."
    revoke:
      description: Denies a permission to a player, for good or for the given time.
      syntax: <target> <permission> [duration]
      message: "{player} has denied {target} the {permission} permission."
      message_temporary: "{player} has denied {target} the {permission} permission for {time}."
    warn:
      description: Warns a player.
      syntax: <target> [reason]
      message: "{player} has warned {target} for {reason}."
    restart:
      description: Restarts the current map.
      syntax: "[number Delay]"
      message: "{player} is restarting the map in {delay} second(s)!"
    return:
      description: Bring a player back to their previous position before teleport.
      syntax: <target>
      message: "{player} returned {target} to their previous position."
    send:
      description: Teleport a player to another player.
      syntax: <target> <destination player>
      message: "{player} has teleported {target} to {destination}."
    setgroup:
      description: "Sets the player's usergroup. Usergroups: {groups}"
      syntax: <target> <usergroup>
      message: "{player} has set {target}'s user group to {group}."
    slay:
      description: Kills a player.
      syntax: <target>
      message: "{player} has slain {target}."
    staff:
      description: 'Talk to fellow staff members.'
      syntax: <message>
    tp:
      description: Teleport the player to the position you are looking at.
      syntax: <target>
      message: "{player} has teleported {target}."
    tpto:
      description: Teleport to the target's position.
      syntax: <target>
      message: "{player} has teleported to {target}."
    unban:
      description: Unban the specified SteamID if it is banned.
      syntax: <target SteamID>
      message: "{player} has unbanned {target}."
    vanish:
      description: "Completely hides the specified player from everyone else on the server."
      syntax: "<string player> [bool should_vanish]"
      enabled: "{target} has been vanished by {player}."
      disabled: "{target} has been unvanished by {player}."
    fullbright:
      description: "Disables lights for the specified player."
      syntax: "<string player> <bool should_hide>"
      enabled: "{player} has enabled fullbright mode for {target}."
      disabled: "{player} has disabled fullbright mode for {target}."
    freeze:
      description: "Freezes a player."
      syntax: "<string player>"
      message: "{player} has frozen {target}."
    unfreeze:
      description: "Unfreezes a player."
      syntax: "<string player>"
      message: "{player} has unfrozen {target}."
    respawn:
      description: "Respawns a player where they are, or where you are looking."
      syntax: "<string player> [tp / stay]"
      message: "{target} was respawned by {player}."
    godmode:
      description: "Sets god mode for a player."
      syntax: "<string player> [bool boolean]"
      enabled: "{player} has enabled god mode for {target}."
      disabled: "{player} has disabled god mode for {target}."
  condition:
    role:
      name: Player with specific role
      text: Role {operator} {role}
      message: Select role
    roles: Roles
  config:
    admin:
      title: Administration
      desc: Settings of the admin mod.
      ban_message_language:
        name: Ban message language
        desc: Code of the language (such as en or ru) of the message that banned players read when they try to join.
  error:
    already_user: "{target} is a user already."
    banned:
      temporary: "You are banned from this server. Reason: {reason}. The ban ends in {time}."
      permanent: "You are permanently banned from this server. Reason: {reason}."
    group_not_valid: "'{group}' is not a valid user group!"
    map_not_valid: "The server has no map called '{map}'!"
    not_banned: Steam ID '{steam_id}' is not banned!
    no_permission: You have no permissions to do that.
    permission_not_set: "Nothing is set for the {permission} permission of these players."
    permission_not_valid: "'{permission}' is not a valid permission!"
    permission_not_yours: "You cannot grant or revoke the {permission} permission, because you do not have it yourself."
    plugin:
      admin: The admin plugin cannot be disabled from its own menu.
    send_same: A player cannot be sent to themselves.
    slay: None of these players is alive.
    user_not_found: "Nobody with the Steam ID '{steam_id}' has ever joined this server."
  notification:
    announcement: "[Announcement] {text}"
    demote: You have been demoted from {group} to user.
    fullbright:
      enabled: Fullbright mode enabled.
      disabled: Fullbright mode disabled.
    permission:
      granted: "You have been granted the {permission} permission."
      revoked: "You have been denied the {permission} permission."
      reset: "Your {permission} permission has been reset to what your role allows."
    plugin_disabled: "{player} has disabled the {plugin} plugin. It stays loaded until the server restarts."
    plugin_enabled: "{player} has enabled the {plugin} plugin. It will be loaded after the server restarts."
    return: You have been returned to your previous position.
    setgroup: Your usergroup was set to {group}.
    slay: "You have been slain by {player}."
    tp: You have been teleported.
    vanish:
      enabled: You are now vanished.
      disabled: You are now unvanished.
    freeze: "You've been frozen by {player}."
    unfreeze: "You've been unfrozen by {player}."
    warn: "You have been warned for {reason}."
    godmode:
      enabled: "God mode enabled."
      disabled: "God mode disabled."
    respawn: "You've been respawned by {player}."
    config_changed: "{player} has changed the {config} config to {value}."
    config_changed_restart: "{player} has changed the {config} config to {value}. The change takes effect after the server restarts."
  permission:
    categories:
      administration: Administration
      tools: Tools
      spawn: Spawn
      general: General
      misc: Misc
      level_design: Level design
      server_management: Server management
      player_management: Player management
      configuration: Configuration
      compatibility: Compatibility
    manage_plugins:
      name: Plugin manager
      description: Grants access to disable and enable plugins.
  role:
    user: The base rank that is automatically given to the player.
    assistant: A low clearance administrative rank given to assistant staff members.
    moderator: An administrative rank given to trusted staff members.
    admin: A high level administrative rank given to the most trusted of staff members.
