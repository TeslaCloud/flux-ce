    group_not_valid: "¡'{group}' no es un grupo de usuarios válido!"
    map_not_valid: "¡El servidor no tiene ningún mapa llamado '{map}'!"
    not_banned: ¡El Steam ID '{steam_id}' no está baneado!
    no_permission: No tienes permiso para hacer eso.
    permission_not_set: "No hay nada asignado para el permiso {permission} de estos jugadores."
    permission_not_valid: "¡'{permission}' no es un permiso válido!"
    permission_not_yours: "No puedes conceder ni retirar el permiso {permission}, porque tú no lo tienes."
    plugin:
