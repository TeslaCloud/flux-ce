es:
  command:
    announce:
      description: Muestra un aviso a todos los del servidor.
      syntax: <texto>
    ban:
      description: Banea jugadores y levanta baneos.
      add:
        description: ¡Banea a este infeliz! Con un Steam ID puedes banear a alguien que no está en el servidor.
        syntax: <jugador o Steam ID> <duración> [motivo]
        message: "{player} ha baneado a {target} durante {time}. ({reason})."
        message_permanent: "{player} ha baneado a {target} permanentemente. ({reason})."
      remove:
        description: Levanta el baneo de un Steam ID.
        syntax: <Steam ID>
        message: "{player} ha desbaneado a {target}."
    bots:
      description: Añade, expulsa, congela y descongela bots.
      add:
        description: Añade al servidor la cantidad de bots indicada.
        syntax: "[cantidad]"
        message:
          "1": "{player} ha añadido {amount} bot al servidor."
          "2": "{player} ha añadido {amount} bots al servidor."
      kick:
        description: Expulsa a todos los bots.
        message: "{player} ha expulsado a todos los bots."
      freeze:
        description: Congela a todos los bots.
        message: "{player} ha congelado a todos los bots."
      unfreeze:
        description: Descongela a todos los bots.
        message: "{player} ha descongelado a todos los bots."
    changelevel:
      description: Cambia el nivel al mapa indicado.
      syntax: <mapa> [retraso]
      message: "¡{player} va a cambiar el nivel a {map} en {delay} segundo(s)!"
    charpermission:
      description: Gestiona los permisos establecidos para los personajes que los jugadores tienen cargados.
      grant:
        description: Concede un permiso al personaje que un jugador tiene cargado, para siempre o durante el tiempo indicado, sin importar lo que permita el rol, salvo que al jugador se le haya denegado.
        syntax: <objetivo> <permiso> [duración]
        message: "{player} ha concedido al personaje {character} el permiso {permission}."
        message_temporary: "{player} ha concedido al personaje {character} el permiso {permission} durante {time}."
      revoke:
        description: Deniega un permiso al personaje que un jugador tiene cargado, para siempre o durante el tiempo indicado, sin importar lo que tengan el jugador y su rol.
        syntax: <objetivo> <permiso> [duración]
        message: "{player} ha denegado al personaje {character} el permiso {permission}."
        message_temporary: "{player} ha denegado al personaje {character} el permiso {permission} durante {time}."
      reset:
        description: Quita lo que se estableció para un permiso del personaje que un jugador tiene cargado, para que vuelvan a decidir los permisos propios del jugador y su rol.
        syntax: <objetivo> <permiso>
        message: "{player} ha restablecido el permiso {permission} del personaje {character}."
        message_temporary: "{player} ha quitado el valor temporal del permiso {permission} del personaje {character}."
      list:
        description: Muestra los permisos establecidos para el personaje que un jugador tiene cargado.
        syntax: <objetivo>
        allowed: "Permitido para el personaje {character}: {permissions}."
        denied: "Denegado para el personaje {character}: {permissions}."
        temporary_allowed: "Permitido temporalmente para el personaje {character}: {permission} (quedan {time})."
        temporary_denied: "Denegado temporalmente para el personaje {character}: {permission} (quedan {time})."
        none: "El personaje {character} no tiene permisos propios."
    freeze:
      description: Congela a jugadores en su sitio o los descongela.
      "on":
        description: Congela a un jugador.
        syntax: <jugador>
        message: "{player} ha congelado a {target}."
      "off":
        description: Descongela a un jugador.
        syntax: <jugador>
        message: "{player} ha descongelado a {target}."
    fullbright:
      description: Activa o desactiva para un jugador el modo de brillo total, que ignora la iluminación del mapa.
      "on":
        description: Activa el modo de brillo total para un jugador.
        syntax: <jugador>
        message: "{player} ha activado el modo de brillo total para {target}."
      "off":
        description: Desactiva el modo de brillo total para un jugador.
        syntax: <jugador>
        message: "{player} ha desactivado el modo de brillo total para {target}."
    godmode:
      description: Activa o desactiva el modo dios para un jugador.
      "on":
        description: Activa el modo dios para un jugador.
        syntax: <jugador>
        message: "{player} ha activado el modo dios para {target}."
      "off":
        description: Desactiva el modo dios para un jugador.
        syntax: <jugador>
        message: "{player} ha desactivado el modo dios para {target}."
    kick:
      description: Expulsa a un jugador del servidor.
      syntax: <jugador> [motivo]
      message: "{player} ha expulsado a {target} ({reason})."
    permission:
      description: Gestiona los permisos asignados a cada jugador de forma individual.
      grant:
        description: Concede un permiso a un jugador, para siempre o durante el tiempo indicado.
        syntax: <jugador> <permiso> [duración]
        message: "{player} ha concedido a {target} el permiso {permission}."
        message_temporary: "{player} ha concedido a {target} el permiso {permission} durante {time}."
      revoke:
        description: Deniega un permiso a un jugador, para siempre o durante el tiempo indicado.
        syntax: <jugador> <permiso> [duración]
        message: "{player} ha denegado a {target} el permiso {permission}."
        message_temporary: "{player} ha denegado a {target} el permiso {permission} durante {time}."
      reset:
        description: Quita lo que se haya asignado a un jugador para un permiso, de modo que vuelva a decidirlo su rol.
        syntax: <jugador> <permiso>
        message: "{player} ha restablecido el permiso {permission} de {target}."
      list:
        description: Muestra los permisos asignados a un jugador de forma individual.
        syntax: <jugador>
        role: "{target} tiene el rol {role}."
        allowed: "Permitido para {target}: {permissions}."
        denied: "Denegado para {target}: {permissions}."
        temporary_allowed: "Permitido temporalmente para {target}: {permission} (quedan {time})."
        temporary_denied: "Denegado temporalmente para {target}: {permission} (quedan {time})."
        none: "{target} no tiene permisos propios."
        character_allowed: "Permitido por el personaje cargado {character}: {permissions}."
        character_denied: "Denegado por el personaje cargado {character}: {permissions}."
    respawn:
      description: "Hace reaparecer a un jugador donde está, o donde estás mirando."
      syntax: "<jugador> [stay / tp]"
      message: "{player} ha hecho reaparecer a {target}."
    restart:
      description: Reinicia el mapa actual.
      syntax: "[retraso]"
      message: "¡{player} va a reiniciar el mapa en {delay} segundo(s)!"
    return:
      description: Devuelve a un jugador a la posición en la que estaba antes de teletransportarse.
      syntax: <jugador>
      message: "{player} ha devuelto a {target} a su posición anterior."
    role:
      description: Asigna y quita los roles de los jugadores.
      set:
        description: "Asigna el rol de un jugador. Roles: {groups}"
        syntax: <jugador> <rol>
        message: "{player} ha asignado a {target} el rol {group}."
      remove:
        description: Devuelve a un jugador al rol de usuario. Con un Steam ID puedes degradar a alguien que no está en el servidor.
        syntax: <jugador o Steam ID>
        message: "{player} ha degradado a {target} a usuario."
    send:
      description: Teletransporta a un jugador hasta otro jugador.
      syntax: <jugador> <jugador de destino>
      message: "{player} ha teletransportado a {target} hasta {destination}."
    slay:
      description: Mata a un jugador.
      syntax: <jugador>
      message: "{player} ha matado a {target}."
    staff:
      description: 'Habla con los demás miembros del staff.'
      syntax: <mensaje>
    tp:
      description: Teletransporta al jugador a la posición a la que estás mirando.
      syntax: <jugador>
      message: "{player} ha teletransportado a {target}."
    tpto:
      description: Te teletransporta a la posición del objetivo.
      syntax: <jugador>
      message: "{player} se ha teletransportado hasta {target}."
    warn:
      description: Advierte a un jugador.
      syntax: <jugador> [motivo]
      message: "{player} ha advertido a {target} por {reason}."
  condition:
    role:
      name: Jugador con un rol concreto
      text: Rol {operator} {role}
      message: Selecciona un rol
    roles: Roles
