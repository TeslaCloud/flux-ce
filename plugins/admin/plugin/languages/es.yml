    plugin_enabled: "{player} ha activado el plugin {plugin}. Se cargará cuando se reinicie el servidor."
    return: Has vuelto a tu posición anterior.
    setgroup: Tu grupo de usuario se ha cambiado a {group}.
    slay: "{player} te ha matado."
    tp: Te han teletransportado.
    freeze: "{player} te ha congelado."
    unfreeze: "{player} te ha descongelado."
    warn: "Te han advertido por {reason}."
    godmode:
      enabled: "Modo dios activado."
