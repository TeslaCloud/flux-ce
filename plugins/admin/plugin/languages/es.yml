    respawn: "{player} te ha hecho reaparecer."
    config_changed: "{player} ha cambiado el ajuste {config} a {value}."
    config_changed_restart: "{player} ha cambiado el ajuste {config} a {value}. El cambio se aplicará cuando se reinicie el servidor."
