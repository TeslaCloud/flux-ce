      revoked: "Se ha denegado a tu personaje el permiso {permission}."
      reset: "El permiso {permission} de tu personaje se ha restablecido a lo que tenéis tú y tu rol."
    demote: Te han degradado de {group} a usuario.
    fullbright:
      enabled: Modo de brillo total activado.
      disabled: Modo de brillo total desactivado.
    permission:
      granted: "Te han concedido el permiso {permission}."
