          unknown: Не загружен
        restart:
          disabled: будет отключен после перезапуска
          enabled: будет включен после перезапуска
        force:
          title: Отключение необходимого плагина
          message: "Плагин {plugin} требуется для: {plugins}. Все, что от него зависит, тоже не будет загружено, а схема без него может сломаться. Все равно отключить?"
