        user: Игрок
        user_tooltip: Разрешения игрока в дополнение к тому, что позволяет его роль. Действуют для всех персонажей игрока.
        character: "Персонаж: {name}"
        character_tooltip: Разрешения персонажа, которого загрузил игрок. Действуют, только пока загружен этот персонаж. Запрет здесь или у игрока всегда важнее; разрешение здесь или у игрока важнее роли.
        no_character: Персонаж не загружен
      decided:
