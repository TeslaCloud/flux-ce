en:
  command:
    givemoney:
      description: "Give money to the player you are looking at. Currencies: {currencies}"
      syntax: <amount> [currency]
    dropmoney:
      description: "Drop money at your target location. Currencies: {currencies}"
      syntax: <amount> [currency]
    setmoney:
      description: "Set money for a player. Currencies: {currencies}"
      syntax: <target> <amount> [currency]
      message: "{player} has set {target}'s {currency} to {value}."
  config:
    currencies:
      title: Currencies
      desc: Money and currency settings.
      default_currency:
        name: Default Currency
        desc: ID of the currency that is used whenever none is named, for instance by the money commands. Leave it empty to use the only registered currency.
      starting_money:
        name: Starting Money
        desc: How much of the default currency new characters start with. Leave it at 0 to use the amount the currency itself is registered with.
      save_dropped_money:
        name: Save Dropped Money
        desc: Should the money lying on the ground be saved and put back when the map is loaded again.
  error:
    not_enough_money: Insufficient funds.
    invalid_currency: This is not a valid currency.
    money_refused: The money was not accepted.
  notification:
    currency:
      pickup: You picked up {value} {currency}.
      receive: You received {value} {currency} from {target}.
      give: You gave {value} {currency} to {target}.
      drop: You dropped {value} {currency}.
      set: Your {currency} balance has been set to {value}.
  ui:
    currency:
      menu:
        give: Give
      title: Money
      give:
        title: Give money
        message: Please, enter the amount of {currency} to give.
      drop:
        title: Drop money
        message: Please, enter the amount of {currency} to drop.
      take:
        title: Take money
        message: Please, enter the amount of {currency} to take.
