ru:
  config:
    damage:
      title: Урон
      desc: Множители урона, восстановление здоровья, утопление и журналы урона.
      scale_head:
        name: Множитель урона в голову
        desc: На сколько умножается урон от попадания в голову, поверх того, что уже делают игровой режим и схема. 1 ничего не меняет.
      scale_chest:
        name: Множитель урона в грудь
        desc: На сколько умножается урон от попадания в грудь, поверх того, что уже делают игровой режим и схема. 1 ничего не меняет.
      scale_stomach:
        name: Множитель урона в живот
        desc: На сколько умножается урон от попадания в живот, поверх того, что уже делают игровой режим и схема. 1 ничего не меняет.
      scale_arms:
        name: Множитель урона по рукам
        desc: На сколько умножается урон от попадания в руку, поверх того, что уже делают игровой режим и схема. 1 ничего не меняет.
      scale_legs:
        name: Множитель урона по ногам
        desc: На сколько умножается урон от попадания в ногу, поверх того, что уже делают игровой режим и схема. 1 ничего не меняет.
      scale_fall:
        name: Множитель урона от падения
        desc: На сколько умножается урон от падения. 1 ничего не меняет, 0 отключает урон от падения.
      health_regen:
        name: Восстановление здоровья
        desc: Будут ли раненые игроки постепенно восстанавливать здоровье.
      health_regen_amount:
        name: Количество восстанавливаемого здоровья
        desc: Сколько здоровья игрок восстанавливает за один раз.
      health_regen_interval:
        name: Интервал восстановления здоровья
        desc: Сколько секунд проходит между двумя восстановлениями здоровья. Отсчет начинается заново, когда игрок получает урон.
      health_regen_fast_interval:
        name: Интервал быстрого восстановления здоровья
        desc: Сколько секунд проходит между двумя восстановлениями здоровья, пока здоровье игрока не ниже порога быстрого восстановления.
      health_regen_fast_share:
        name: Порог быстрого восстановления здоровья
        desc: Процент от максимального здоровья, начиная с которого используется быстрый интервал.
      drowning:
        name: Утопление
        desc: Будут ли игроки, слишком долго находящиеся под водой, получать урон, пока не всплывут.
      drowning_time:
        name: Запас воздуха
        desc: Сколько секунд игрок может находиться полностью под водой, прежде чем начнет тонуть.
      drowning_damage:
        name: Урон от утопления
        desc: Сколько урона тонущий игрок получает за один раз.
      drowning_interval:
        name: Интервал урона от утопления
        desc: Сколько секунд проходит между двумя получениями урона от утопления.
      view_punch:
        name: Встряска камеры при уроне
        desc: Будет ли камера игрока вздрагивать, когда он получает урон.
      view_punch_scale:
        name: Сила встряски камеры при уроне
        desc: На сколько градусов самое большее вздрагивает камера за каждую единицу урона. Одно попадание никогда не сдвигает ее больше чем на 30 градусов.
      log_damage:
        name: Журнал урона
        desc: Будет ли урон, получаемый игроками, записываться в журнал.
      log_kills:
        name: Журнал убийств
        desc: Будут ли смерти игроков записываться в журнал.
