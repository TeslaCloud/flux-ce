categories:
  mapscenes:
    name: config.mapscenes.title
    description: config.mapscenes.desc
configs:
  mapscenes_speed:
    name: config.mapscenes.mapscenes_speed.name
    description: config.mapscenes.mapscenes_speed.desc
    category: mapscenes
    type: number
    min_value: 1
    max_value: 300
    default_value: 15
  mapscenes_animated:
    name: config.mapscenes.mapscenes_animated.name
    description: config.mapscenes.mapscenes_animated.desc
    category: mapscenes
    type: boolean
    default_value: false
  mapscenes_rotate_speed:
    name: config.mapscenes.mapscenes_rotate_speed.name
    description: config.mapscenes.mapscenes_rotate_speed.desc
    category: mapscenes
    type: number
    min_value: 0
    max_value: 1
    decimals: 2
    default_value: 0.05
