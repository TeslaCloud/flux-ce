ru:
  command:
    fall:
      description: Упасть на землю.
      syntax: "[время на подъем]"
    forcefall:
      description: Уронить игрока на землю.
      syntax: "<игрок> [время на подъем]"
      message: "{player} уронил {target} на {time} с."
    forcegetup:
      description: Поднять игрока с земли.
      syntax: "<игрок> [время на подъем]"
      message: "{player} поднимает {target} на ноги, это займет {time} с."
    getup:
      description: Подняться с земли.
      syntax: "[время на подъем]"
    knockout:
      description: Лишить игрока сознания. Он не сможет подняться сам, пока не придёт в себя.
      syntax: "<игрок> [время без сознания]"
      message: "{player} лишил {target} сознания на {time} с."
  config:
    ragdoll:
      title: Рэгдоллы
      desc: Падения, потеря сознания и трупы.
      getup_time:
        name: Время подъёма
        desc: Сколько секунд упавший игрок поднимается на ноги.
      fall_cooldown:
        name: Задержка падения
        desc: Сколько секунд игрок должен подождать, прежде чем снова использовать команду падения. Установите 0, чтобы отключить.
      immunity_time:
        name: Время неуязвимости рэгдолла
        desc: Сколько секунд после падения рэгдолл игрока не получает урон, нанесённый не игроком, например от удара о землю. Установите 0, чтобы отключить.
      decay_time:
        name: Время исчезновения трупа
        desc: Сколько секунд рэгдолл игрока остаётся после того, как игрок возродился или покинул сервер. Установите 0, чтобы убирать его сразу.
      fall_damage:
        name: Падение с ног от падения с высоты
        desc: Падение с высоты, нанёсшее не меньше этого урона, сбивает игрока с ног. Установите 0, чтобы отключить.
      hit_damage:
        name: Падение с ног от удара
        desc: Один удар, нанёсший не меньше этого урона, сбивает игрока с ног. Установите 0, чтобы отключить.
      hit_time:
        name: Время на земле после удара
        desc: Сколько секунд игрок, сбитый с ног сильным ударом, лежит, прежде чем подняться. Установите 0, чтобы он поднимался сам.
  error:
    ragdoll:
      fall_cooldown: "Подождите {time} с., прежде чем снова упасть."
  ui:
    hud:
      press_jump_to_getup: Нажмите 'прыжок', чтобы встать...
      knocked_out: Вы без сознания...
      bar_text:
        wakeup: ВЫ ПРИХОДИТЕ В СОЗНАНИЕ...
