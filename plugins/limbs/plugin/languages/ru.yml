ru:
  command:
    heallimbs:
      description: Вылечить все части тела персонажа игрока.
      syntax: <игрок>
      message: "{player} вылечил части тела {target}."
      notification: Ваши части тела были вылечены.
  config:
    limbs:
      title: Повреждения частей тела
      desc: Настройка повреждений частей тела.
      enabled:
        name: Повреждения частей тела
        desc: Учитывать урон по каждой части тела. Если выключено, части тела не получают урон, повреждения ни на что не влияют, а схема тела скрыта.
      damage_scale:
        name: Множитель урона по частям тела
        desc: Сколько урона получает часть тела за каждую единицу здоровья, потерянную игроком при попадании в неё. При 100 часть тела искалечена.
      legs_slow:
        name: Повреждённые ноги замедляют
        desc: Повреждённые ноги замедляют бег и снижают высоту прыжка, вплоть до половины при искалеченной ноге.
      fall_damage:
        name: Урон от падения повреждает ноги
        desc: Делить урон от падения между обеими ногами.
      arms_sway:
        name: Повреждённые руки сбивают прицел
        desc: При повреждённых руках прицел оружия в руках начинает плавать.
      recovery:
        name: Восстановление частей тела
        desc: Сколько урона каждая повреждённая часть тела восстанавливает в минуту сама по себе. При значении 0 части тела излечиваются только лечением или смертью.
  settings:
    limbs_hud:
      name: Схема тела
      desc: Когда показывать схему ваших частей тела на экране.
      hurt: При повреждениях
      always: Всегда
      never: Никогда
  ui:
    limbs:
      head: Голова
      chest: Грудь
      stomach: Живот
      left_arm: Левая рука
      right_arm: Правая рука
      left_leg: Левая нога
      right_leg: Правая нога
