en:
  command:
    setclass:
      description: "Set a character's class within their faction. Classes: {classes}"
      syntax: "<target> <class> [is class search strict]"
      message: "{player} has set {target}'s class to {class}."
  config:
    classes:
      title: Classes
      desc: Classes and wages settings.
      class_change_cooldown:
        name: Class Change Cooldown
        desc: How many seconds a player has to wait before they can switch their class again. Set to 0 to disable.
      wages_interval:
        name: Wages Interval
        desc: How often players are paid the wage of their class, in seconds. Set to 0 to disable wages.
  error:
    class:
      invalid: "'{class}' is not a valid class!"
      wrong_faction: "The {class} class does not belong to the character's faction."
      already: You already hold this class.
      not_selectable: You cannot pick this class yourself.
      cooldown: "You can change your class again in {time}."
      full: This class is full.
      not_allowed: You cannot switch to this class.
      not_selected: "The character's class is not valid."
  notification:
    class_changed: Your class was set to {class}.
    class_joined: You have switched your class to {class}.
    wage: "You have received your wage: {value} {currency}."
  ui:
    classes:
      title: Classes
      join: Switch
      current: Current class
      players: "Players: {count}"
      players_limited: "Players: {count}/{limit}"
      wage: "Wage: {value} {currency}"
    tab_menu:
      classes: Classes
