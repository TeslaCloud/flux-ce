        message: "{player} deixou {target} invisível."
      "off":
        description: Volta a mostrar a todos um jogador escondido.
        syntax: <alvo>
        message: "{player} deixou {target} visível de novo."
  notification:
    vanish:
      enabled: Agora você está invisível.
      disabled: Agora você está visível.
  ui:
    hud:
      vanish: "Você está invisível"
  permission:
    admin_esp:
      name: ESP de administrador
      description: Dá acesso para ver os outros jogadores através das paredes durante o noclip.
