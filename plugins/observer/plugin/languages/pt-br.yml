pt-br:
  config:
    observer:
      title: Observador
      desc: Configurações do plugin de observador.
      reset:
        name: Restaurar ao sair do observador
        desc: "A posição do jogador deve ser restaurada quando ele sai do modo observador?"
  command:
    vanish:
      description: Esconde completamente um jogador de todos os outros no servidor, ou volta a mostrá-lo.
      "on":
        description: Esconde um jogador de todos, menos da staff.
