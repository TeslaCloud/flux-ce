en:
  config:
    observer:
      title: Observer
      desc: Observer plugin settings.
      reset:
        name: Observer reset
        desc: "Whether or not the player's position should be restored when they leave observer mode?"
  command:
    vanish:
      description: Completely hides a player from everyone else on the server, or shows them again.
      "on":
        description: Hides a player from everyone but the staff.
        syntax: <target>
        message: "{target} has been vanished by {player}."
      "off":
        description: Shows a hidden player to everyone again.
        syntax: <target>
        message: "{target} has been unvanished by {player}."
  notification:
    vanish:
      enabled: You are now vanished.
      disabled: You are now unvanished.
  ui:
    hud:
      vanish: "You are vanished"
