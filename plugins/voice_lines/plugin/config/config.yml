categories:
  voice_lines:
    name: config.voice_lines.title
    description: config.voice_lines.desc
configs:
  voice_lines_interval:
    name: config.voice_lines.interval.name
    description: config.voice_lines.interval.desc
    category: voice_lines
    type: number
    min_value: 0
    max_value: 60
    decimals: 1
    default_value: 2
  voice_lines_radio_volume:
    name: config.voice_lines.radio_volume.name
    description: config.voice_lines.radio_volume.desc
    category: voice_lines
    type: number
    min_value: 0
    max_value: 1
    decimals: 2
    default_value: 0.5
  voice_lines_default_duration:
    name: config.voice_lines.default_duration.name
    description: config.voice_lines.default_duration.desc
    category: voice_lines
    type: number
    min_value: 0.1
    max_value: 30
    decimals: 1
    default_value: 2
  voice_lines_max_chain:
    name: config.voice_lines.max_chain.name
    description: config.voice_lines.max_chain.desc
    category: voice_lines
    type: number
    min_value: 2
    max_value: 20
    default_value: 6
