categories:
  display_typing:
    name: config.display_typing.title
    description: config.display_typing.desc
configs:
  display_exact_message:
    name: config.display_typing.exact_message.name
    description: config.display_typing.exact_message.desc
    category: display_typing
    type: boolean
    default_value: true
  display_typing_range:
    name: config.display_typing.range.name
    description: config.display_typing.range.desc
    category: display_typing
    type: number
    min_value: 32
    max_value: 4096
    default_value: 350
  display_typing_through_walls:
    name: config.display_typing.through_walls.name
    description: config.display_typing.through_walls.desc
    category: display_typing
    type: boolean
    default_value: false
