es:
  command:
    voicelines:
      description: Muestra las líneas de voz que puede decir tu personaje, o las busca por comando, texto o alias.
      syntax: "[búsqueda]"
  config:
    voicelines:
      title: Líneas de voz
      desc: Ajustes de las líneas de voz que los personajes dicen en el chat.
      voicelines_interval:
        name: Intervalo de líneas de voz
        desc: Cuántos segundos debe esperar un jugador antes de que suene otra línea de voz. Una línea dicha antes se muestra en el chat sin su sonido.
      voicelines_radio_volume:
        name: Volumen de las líneas de voz por radio
        desc: Volumen, de 0 a 1, del sonido de una línea de voz para los jugadores que la oyen por radio.
  notification:
    voice_lines:
      none: Tu personaje no tiene líneas de voz.
      not_found: 'Ninguna línea de voz coincide con "{query}".'
  ui:
    voice_lines:
      title: Líneas de voz
      description: Para decir una línea, escribe en el chat su comando, su texto o uno de sus alias en un mensaje aparte. Ponla entre paréntesis para susurrarla, o añade !! para gritarla.
      search: Buscar por comando, texto o alias...
      all: Todas
      empty: Ninguna línea de voz coincide con la búsqueda.
      truncated: Se muestran {shown} de {total} líneas. Busca para acotarlas.
      listen: Escuchar
      say: Decir
      say_tooltip: Decir esta línea en personaje.
      aliases: Alias
      list_header: "Líneas de voz de tu personaje (consulta la página Líneas de voz de la pestaña Ayuda, o busca con /voicelines <texto>):"
      line_count:
        "1": "{count} línea"
        "2": "{count} líneas"
      results:
        "1": "Se ha encontrado {count} línea de voz, se muestra {shown}:"
        "2": "Se han encontrado {count} líneas de voz, se muestran {shown}:"
