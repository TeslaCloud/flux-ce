ru:
  command:
    voicelines:
      description: Показать голосовые фразы, доступные вашему персонажу, или найти их по команде, тексту или псевдониму.
      syntax: "[поиск]"
  config:
    voicelines:
      title: Голосовые фразы
      desc: Настройки голосовых фраз, которые персонажи произносят в чате.
      voicelines_interval:
        name: Интервал голосовых фраз
        desc: Сколько секунд игрок должен подождать, прежде чем прозвучит следующая голосовая фраза. Фраза, сказанная раньше, появляется в чате без звука.
      voicelines_radio_volume:
        name: Громкость голосовых фраз по рации
        desc: Громкость (от 0 до 1) звука голосовой фразы для игроков, которые слышат её по рации.
  notification:
    voice_lines:
      none: У вашего персонажа нет голосовых фраз.
      not_found: Нет голосовых фраз, подходящих под «{query}».
  ui:
    voice_lines:
      title: Голосовые фразы
      description: Чтобы сказать фразу, напишите в чат её команду, текст или один из псевдонимов отдельным сообщением. Возьмите её в скобки, чтобы прошептать, или добавьте !!, чтобы прокричать.
      search: Поиск по команде, тексту или псевдониму...
      all: Все
      empty: Нет голосовых фраз, подходящих под запрос.
      truncated: Показано {shown} из {total}. Уточните поиск.
      listen: Прослушать
      say: Сказать
      say_tooltip: Произнести эту фразу от лица персонажа.
      aliases: Псевдонимы
      list_header: "Голосовые фразы вашего персонажа (см. страницу «Голосовые фразы» во вкладке «Помощь» или ищите командой /voicelines <текст>):"
      line_count:
        "1": "{count} фраза"
        "2": "{count} фразы"
        "5": "{count} фраз"
      results:
        "1": "Найдено голосовых фраз: {count}, показано: {shown}."
        "2": "Найдено голосовых фраз: {count}, показано: {shown}."
        "5": "Найдено голосовых фраз: {count}, показано: {shown}."
