ru:
  config:
    screen_effects:
      title: Экранные эффекты
      desc: Настройка плагина экранных эффектов
      low_health:
        name: Разрешить эффект низкого здоровья
        desc: Разрешить выцветание и размытие изображения по мере потери игроком здоровья, а также серый экран после его смерти.
      heartbeat:
        name: Разрешить сердцебиение
        desc: Разрешить игрокам слышать сердцебиение, которое учащается по мере потери здоровья.
      underwater:
        name: Разрешить подводный эффект
        desc: Разрешить размытие и искажение изображения, пока взгляд игрока находится под водой.
      headbob:
        name: Разрешить покачивание камеры
        desc: Разрешить покачивание камеры при ходьбе и беге и её встряску при приземлении после падения.
  settings:
    categories:
      screen_effects: Экранные эффекты
    screen_effects:
      low_health:
        name: Эффект низкого здоровья
        desc: Обесцвечивать и размывать изображение по мере потери здоровья.
        strength:
          name: Сила эффекта низкого здоровья
          desc: Насколько сильно проявляется эффект низкого здоровья, в процентах.
      heartbeat:
        name: Сердцебиение
        desc: Проигрывать сердцебиение, которое учащается по мере потери здоровья.
        strength:
          name: Громкость сердцебиения
          desc: Насколько громко звучит сердцебиение, в процентах.
      underwater:
        name: Подводный эффект
        desc: Размывать и искажать изображение, пока вы находитесь под водой.
        strength:
          name: Сила подводного эффекта
          desc: Насколько сильно проявляется подводный эффект, в процентах.
      headbob:
        name: Покачивание камеры
        desc: Покачивать камеру при ходьбе и беге и встряхивать её при приземлении после падения.
        strength:
          name: Сила покачивания камеры
          desc: Насколько сильны покачивание камеры и встряска при приземлении, в процентах.
