ru:
  config:
    d20:
      title: D20
      desc: Урон кубиками, здоровье NPC, класс брони и броски атаки.
      enabled:
        name: Урон кубиками
        desc: "Бросать кубики для урона каждого попадания по игроку или NPC вместо урона движка, бросать кубики для урона от падения и масштабировать здоровье NPC."
      default_dice:
        name: Кубики урона по умолчанию
        desc: "Формула кубиков, которая бросается для попадания, для которого ни оружие, ни NPC, ни тип урона не задают формулу и урон которого по движку равен 0."
      fall_dice:
        name: Кубики урона от падения
        desc: "Формула кубиков урона от падения. Переменная steps равна 1 для самого медленного падения, которое наносит урон, и растёт на 1 за каждые 150 юнитов в секунду скорости падения. Множитель урона от падения из плагина Damage по-прежнему действует."
      weapon_dice:
        name: Кубики урона оружия
        desc: "Записи вида 'weapon_pistol = 1d8', которые задают формулу кубиков для класса оружия или снаряда поверх формулы, заданной в коде."
      npc_dice:
        name: Кубики урона NPC
        desc: "Записи вида 'npc_zombie = 1d8', которые задают формулу кубиков для атак класса NPC поверх формулы, заданной в коде. NPC с оружием в руках бросает кубики оружия."
      npc_health_scale:
        name: Множитель здоровья NPC
        desc: "На что умножается максимальное здоровье NPC при появлении, чтобы он выдерживал примерно столько же попаданий с бросками, сколько выдержал бы попаданий движка."
      npc_armor_class:
        name: Класс брони NPC
        desc: "Класс брони NPC: чего должен достичь бросок атаки против него, чтобы попасть."
      npc_attack_bonus:
        name: Бонус атаки NPC
        desc: "Что NPC прибавляет к d20 своих бросков атаки."
