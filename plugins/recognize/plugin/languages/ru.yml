ru:
  command:
    charforget:
      description: Заставляет персонажа забыть персонажей других игроков.
      syntax: <игрок> <кого забыть>
      message: "{player} заставляет {target} забыть {forgotten}."
    charclearrecognition:
      description: "Стирает знакомства персонажа: тех, кого знает он (own), тех, кто знает его (others), или и тех, и других (all)."
      syntax: "<игрок> [own|others|all]"
      message:
        own: "{player} заставляет {target} забыть всех."
        others: "{player} заставляет всех забыть {target}."
        all: "{player} заставляет {target} забыть всех, а всех - забыть {target}."
  config:
    recognize:
      title: Идентификация
      desc: Настройки системы узнавания персонажей.
      enabled:
        name: Система узнавания
        desc: Должны ли персонажи представляться, чтобы другие знали их имена. Если выключено, все узнают всех.
      must_see:
        name: Представляться только на виду
        desc: Запоминает ли персонаж имя представившегося только тогда, когда между ними нет преград.
      forget_on_death:
        name: Забывать всех при смерти
        desc: Забывает ли погибший персонаж всех, кого он узнавал.
      forgotten_on_death:
        name: Забвение при смерти
        desc: Забывают ли погибшего персонажа все, кто знал его под реальным именем. Те, кто знал только ложное имя, продолжают его помнить.
  error:
    recognize:
      invalid_name: Вы не можете представиться этим именем.
      invalid_mode: "'{mode}' - недопустимый режим! Используйте own, others или all."
      no_character: Ни у одного из этих игроков не загружен персонаж.
      nothing_to_forget: Никто из этих персонажей не знает тех, кого нужно забыть.
  notification:
    recognize:
      new_name: "Вы запомнили новое имя: {name}"
      change_name: Теперь вы знаете {name} как {new_name}
      true_name: Вы представились реальным именем {name}
      false_name: Вы представились ложным именем {name}
      forgotten: Вы больше не помните {name}.
      forgot_everyone: Вы больше не помните никого из тех, кого знали.
  ui:
    hud:
      stranger_male: Незнакомец
      stranger_female: Незнакомка
    recognize:
      title: Идентификация
      message: Как Вы хотите представиться?
      character_name: Реальное имя
      fake_name: Ложное имя
      enter_fake_name: Указать ложное имя...
      forget: Забыть
      range: Дальность
      previous_names: Вы также известны как
      types:
        whisper: Все персонажи в радиусе слышимости шепота
        talk: Все персонажи в радиусе слышимости разговора
        yell: Все персонажи в радиусе слышимости крика
        target: Персонаж, на которого Вы смотрите
