fr:
  config:
    prop_protection:
      title: "Protection des props"
      desc: "La propriété des entités et les règles de bac à sable qui en découlent."
      owned:
        name: "Protéger les entités possédées"
        desc: "Indique si les joueurs sont empêchés de ramasser, geler, conduire et d'utiliser des outils et des propriétés sur les entités des autres personnages."
      map:
        name: "Protéger les entités de la carte"
        desc: "Indique si les joueurs sont empêchés de faire de même avec les entités qui font partie de la carte."
      world:
        name: "Protéger les entités sans propriétaire"
        desc: "Indique si les joueurs sont empêchés de faire de même avec les entités qui n'appartiennent à personne, comme les objets, les joueurs, les ragdolls et les props statiques."
      players:
        name: "Protéger les joueurs du physics gun"
        desc: "Indique si les joueurs sont empêchés de saisir d'autres joueurs avec le physics gun."
      vehicles:
        name: "Protéger les véhicules occupés du physics gun"
        desc: "Indique si les joueurs sont empêchés de saisir les véhicules qui ont un conducteur, y compris les leurs."
      ragdolls:
        name: "Protéger les ragdolls des joueurs du physics gun"
        desc: "Indique si les joueurs sont empêchés de saisir les ragdolls des joueurs morts ou assommés."
      removal_delay:
        name: "Délai de suppression des entités abandonnées"
        desc: "Combien de temps les entités d'un joueur restent après sa déconnexion ou un changement de personnage (en secondes). Il garde ses entités s'il revient à temps. Mettez 0 pour ne jamais les supprimer."
      remove_staff:
        name: "Supprimer les entités abandonnées de l'équipe"
        desc: "Indique si les entités des membres de l'équipe qui contournent la protection des props sont elles aussi supprimées après leur départ."
      prop_kill:
        name: "Protection contre le prop kill"
        desc: "Indique si les joueurs sont protégés des impacts des props tenus avec le physics gun, qui viennent d'être lâchés par celui-ci ou qui viennent d'apparaître."
      prop_kill_time:
        name: "Durée de la protection contre le prop kill"
        desc: "Combien de temps un prop reste inoffensif pour les joueurs après son apparition ou après avoir été lâché par le physics gun (en secondes)."
  error:
    prop_protection:
      not_yours: "Cela ne vous appartient pas !"
      protected: "Cette entité est protégée !"
  notification:
    prop_protection:
      returned: "Vos entités vous appartiennent à nouveau ({count})."
  permission:
    bypass_prop_protection:
      name: "Contourner la protection des props"
      description: "Donne accès aux entités des autres joueurs, de la carte et de personne."
