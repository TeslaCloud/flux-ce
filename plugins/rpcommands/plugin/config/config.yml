categories:
  roleplay_chat:
    name: config.roleplay_chat.title
    description: config.roleplay_chat.desc
configs:
  talk_radius:
    name: config.roleplay_chat.talk_radius.name
    description: config.roleplay_chat.talk_radius.desc
    category: roleplay_chat
    type: number
    min_value: 32
    max_value: 4096
    default_value: 350
  ooc_interval:
    name: config.roleplay_chat.ooc_interval.name
    description: config.roleplay_chat.ooc_interval.desc
    category: roleplay_chat
    type: number
    min_value: 0
    max_value: 3600
    default_value: 0
  looc_interval:
    name: config.roleplay_chat.looc_interval.name
    description: config.roleplay_chat.looc_interval.desc
    category: roleplay_chat
    type: number
    min_value: 0
    max_value: 3600
    default_value: 0
  ooc_avatars:
    name: config.roleplay_chat.ooc_avatars.name
    description: config.roleplay_chat.ooc_avatars.desc
    category: roleplay_chat
    type: boolean
    default_value: true
  roll_versus:
    name: config.roleplay_chat.roll_versus.name
    description: config.roleplay_chat.roll_versus.desc
    category: roleplay_chat
    type: boolean
    default_value: true
  chat_ic_color:
    name: config.roleplay_chat.chat_ic_color.name
    description: config.roleplay_chat.chat_ic_color.desc
    category: roleplay_chat
    type: color
    default_value:
      r: 240
      g: 230
      b: 140
  chat_whisper_color:
    name: config.roleplay_chat.chat_whisper_color.name
    description: config.roleplay_chat.chat_whisper_color.desc
    category: roleplay_chat
    type: color
    default_value:
      r: 214
      g: 208
      b: 154
  chat_yell_color:
    name: config.roleplay_chat.chat_yell_color.name
    description: config.roleplay_chat.chat_yell_color.desc
    category: roleplay_chat
    type: color
    default_value:
      r: 255
      g: 247
      b: 130
  chat_it_color:
    name: config.roleplay_chat.chat_it_color.name
    description: config.roleplay_chat.chat_it_color.desc
    category: roleplay_chat
    type: color
    default_value:
      r: 173
      g: 216
      b: 230
  chat_me_color:
    name: config.roleplay_chat.chat_me_color.name
    description: config.roleplay_chat.chat_me_color.desc
    category: roleplay_chat
    type: color
    default_value:
      r: 144
      g: 238
      b: 144
