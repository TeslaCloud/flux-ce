ru:
  config:
    chatbox:
      title: Окно чата
      desc: Настройка окна чата для вашего сервера.
      message_margin:
        name: Отступ
        desc: Размер вертикального отступа между сообщениями.
      message_fade_delay:
        name: Задержка исчезновения сообщения
        desc: Как долго сообщения будут задерживаться на экране прежде чем исчезнуть.
      max_messages:
        name: Максимальное количество сообщений
        desc: Максимальный размер истории сообщений.
      default_font_size:
        name: Размер шрифта по умолчанию
        desc: Размер шрифта в чате, используемый по умолчанию.
      small_font_size:
        name: Размер мелкого шрифта
        desc: Размер шрифта в чате, используемый для мелкого текста.
      big_font_size:
        name: Размер крупного шрифта
        desc: азмер шрифта в чате, используемый для крупного текста.
      max_message_length:
        name: Максимальная длина сообщения
        desc: Насколько длинным может быть сообщение в чате.
      chat_interval:
        name: Интервал между сообщениями
        desc: Наименьшее время в миллисекундах между двумя сообщениями одного игрока в чате. 0 отключает ограничение.
      chat_avatars:
        name: Аватары в чате
        desc: Показывать ли аватар Steam перед именем игрока в обычных сообщениях чата.
      chat_timestamps:
        name: Время сообщений
        desc: Показывать ли время отправки перед каждым сообщением в чате.
  error:
    chat:
      too_fast: Вы отправляете сообщения слишком часто!
  ui:
    chat:
      aliases: Алиасы
      no_commands_found: Команды не найдены.
      everyone: весь сервер
