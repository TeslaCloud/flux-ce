en:
  command:
    message:
      description: 'Send a private message to another player.'
      syntax: <target> <message>
  config:
    chatbox:
      title: Chatbox
      desc: Customize how the chat box works for your server!
      message_margin:
        name: Message margin
        desc: How much vertical space to put between two messages.
      message_fade_delay:
        name: Message fade delay
        desc: How long should the messages stay on the screen before fading away.
      max_messages:
        name: Max messages
        desc: How many messages should the chat history hold.
      default_font_size:
        name: Default Font Size
        desc: Default font size to use for the Chat Box.
      small_font_size:
        name: Small Font Size
        desc: Font size to use for smaller text in the chatbox.
      big_font_size:
        name: Big Font Size
        desc: Font size to use for bigger text in the chatbox.
      max_message_length:
        name: Maximum Message Length
        desc: How long a chat message can be.
      interval:
        name: Message Interval
        desc: The shortest time, in milliseconds, between two chat messages of the same player. 0 turns the limit off.
      avatars:
        name: Chat Avatars
        desc: Whether to show the Steam avatar of the speaker before their name in regular chat messages.
      timestamps:
        name: Message Timestamps
        desc: Whether to show the time a message was sent at before every chat message.
  error:
    chat:
      too_fast: You are sending messages too fast!
    message:
      self: You cannot send a private message to yourself.
  ui:
    chat:
      aliases: Aliases
      alias_of: "(alias of {command})"
      no_commands_found: No commands found!
      more_above: "{count} more above"
      more_below: "{count} more below"
      everyone: everyone
