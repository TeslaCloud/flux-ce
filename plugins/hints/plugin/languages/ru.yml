ru:
  hint:
    forums:
      Зайдите на форум TeslaCloud, чтобы получить поддержку, скачать плагины и
      просто общаться с другими пользователями Flux!
    hints: Эти подсказки можно выключить на вкладке настроек в меню.
    tab: Нажмите кнопку показа счёта (по умолчанию TAB), чтобы открыть меню.
    commands:
      Начните вводить команду в чат, чтобы увидеть её описание и документацию
      по использованию.
    bugs:
      Нашли баг? У вас есть идея, которую мы могли бы воплотить в Flux?
      Посетите наш форум TeslaCloud.net и расскажите нам об этом!
    setting:
      name: Показывать подсказки
      desc: Время от времени показывать случайную подсказку в углу экрана.
