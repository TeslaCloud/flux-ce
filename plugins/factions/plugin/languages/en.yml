en:
  command:
    whitelist:
      description: "Manage the faction whitelists of players, which let them create characters that start in a faction."
      add:
        description: "Let a player create characters that start in a faction."
        syntax: "<target> <faction>"
        message: "{player} has added {target} to the {faction} whitelist."
        none: "None of these players could be added to the {faction} whitelist: they are on it already or their data has not loaded yet."
      remove:
        description: "Stop a player from creating characters that start in a faction. Their characters keep what they have."
        syntax: "<target> <faction>"
        message: "{player} has removed {target} from the {faction} whitelist."
        none: "None of these players is on the {faction} whitelist."
    setfaction:
      description: "Give a character the starter kit of a faction, which makes them a member. Factions: {factions}"
      syntax: "<target> <faction>"
      message: "{player} has given {target} the starter kit of the {faction} faction."
    rank:
      description: "Change the ranks of characters in their factions."
      set:
        description: "Set a character's rank in their faction, by its number, ID or name."
        syntax: "<target> <rank>"
        message: "{player} has set {target}'s rank in their faction to {rank}."
      promote:
        description: "Promote a character in their faction."
        syntax: "<target>"
        message: "{player} has promoted {target} in their faction."
      demote:
        description: "Demote a character in their faction."
        syntax: "<target>"
        message: "{player} has demoted {target} in their faction."
  condition:
    faction:
      name: Player in specific faction
      text: Faction {operator} {faction}
      message: Select faction
    rank:
      name: Player with certain rank in specific faction
      text: Rank {faction} {operator} {rank}
      message: Select rank
    factions: Factions
    ranks: Ranks
  error:
    faction:
      invalid: "'{faction}' is not a valid faction!"
      creation_refused: This faction does not accept this character.
      transfer_refused: "{target} cannot be given the starter kit of the {faction} faction."
      wrong_species: "{target} is not of the species of the {faction} faction."
      no_kit: "The {faction} faction has no starter kit to give."
      kit_incomplete: "These items of the starter kit could not be given to {target}: {items}"
      no_character: "{target} has no character."
    rank:
      cannot_promote: You cannot promote any of these players.
      cannot_demote: You cannot demote any of these players.
      not_found: "None of these characters' factions has the rank '{rank}'."
  notification:
    demote_rank: You have been demoted to rank {rank}.
    promote_rank: You have been promoted to rank {rank}.
    faction_kit_given: You have been given the starter kit of the {faction} faction.
    faction_kit_incomplete: "These items of your starter kit could not be given to you: {items}"
    rank_changed: Your faction rank was set to {rank}.
    whitelist_taken: You can no longer create characters that start in the {faction} faction.
    whitelist_given: You can now create characters that start in the {faction} faction.
  faction:
    unknown:
      title: "Unknown Faction"
      description: "This faction has no description."
  permission:
    manage_ranks:
      name: Manage faction ranks
      description: "Grants access to promote and demote any character, regardless of the ranks."
