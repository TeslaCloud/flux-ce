es:
  command:
    whitelist:
      description: "Gestiona las listas blancas de facciones de los jugadores, que les permiten crear personajes que empiecen en una facción."
      add:
        description: "Permite a un jugador crear personajes que empiecen en una facción."
        syntax: "<jugador> <facción>"
        message: "{player} ha añadido a {target} a la lista blanca de {faction}."
        none: "No se ha podido añadir a ninguno de estos jugadores a la lista blanca de {faction}: ya están en ella o sus datos aún no se han cargado."
      remove:
        description: "Impide a un jugador crear personajes que empiecen en una facción. Sus personajes conservan lo que tienen."
        syntax: "<jugador> <facción>"
        message: "{player} ha quitado a {target} de la lista blanca de {faction}."
        none: "Ninguno de estos jugadores está en la lista blanca de {faction}."
    setfaction:
      description: "Da a un personaje el equipo inicial de una facción, que lo hace miembro de ella. Facciones: {factions}"
      syntax: "<jugador> <facción>"
      message: "{player} ha dado a {target} el equipo inicial de la facción {faction}."
    rank:
      description: "Cambia los rangos de los personajes en sus facciones."
      set:
        description: "Establece el rango de un personaje en su facción, por su número, ID o nombre."
        syntax: "<jugador> <rango>"
        message: "{player} ha establecido el rango de {target} en su facción a {rank}."
      promote:
        description: "Asciende a un personaje en su facción."
        syntax: "<jugador>"
        message: "{player} ha ascendido a {target} en su facción."
      demote:
        description: "Degrada a un personaje en su facción."
        syntax: "<jugador>"
        message: "{player} ha degradado a {target} en su facción."
  condition:
    faction:
      name: Jugador en una facción concreta
      text: "Facción {operator} {faction}"
      message: Selecciona una facción
    rank:
      name: Jugador con cierto rango en una facción concreta
      text: "Rango {faction} {operator} {rank}"
      message: Selecciona un rango
    factions: Facciones
    ranks: Rangos
  error:
    faction:
      invalid: "¡'{faction}' no es una facción válida!"
      creation_refused: Esta facción no acepta a este personaje.
      transfer_refused: "No se puede dar a {target} el equipo inicial de la facción {faction}."
      wrong_species: "{target} no es de la raza de la facción {faction}."
      no_kit: "La facción {faction} no tiene equipo inicial que dar."
      kit_incomplete: "No se han podido dar a {target} estos objetos del equipo inicial: {items}"
      no_character: "{target} no tiene personaje."
    rank:
      cannot_promote: No puedes ascender a ninguno de estos jugadores.
      cannot_demote: No puedes degradar a ninguno de estos jugadores.
      not_found: "Ninguna de las facciones de estos personajes tiene el rango '{rank}'."
  notification:
    demote_rank: "Has sido degradado al rango {rank}."
    promote_rank: "Has sido ascendido al rango {rank}."
    faction_kit_given: "Has recibido el equipo inicial de la facción {faction}."
    faction_kit_incomplete: "No se te han podido dar estos objetos de tu equipo inicial: {items}"
    rank_changed: "Tu rango en la facción ha cambiado a {rank}."
    whitelist_taken: "Ya no puedes crear personajes que empiecen en la facción {faction}."
    whitelist_given: "Ahora puedes crear personajes que empiecen en la facción {faction}."
  faction:
    unknown:
      title: "Facción desconocida"
      description: "Esta facción no tiene descripción."
  permission:
    manage_ranks:
      name: "Gestionar rangos de facción"
      description: "Da acceso para ascender y degradar a cualquier personaje, sin importar los rangos."
