fr:
  command:
    whitelist:
      description: "Gère les whitelists de factions des joueurs, qui leur permettent de créer des personnages qui commencent dans une faction."
      add:
        description: "Permet à un joueur de créer des personnages qui commencent dans une faction."
        syntax: "<cible> <faction>"
        message: "{player} a ajouté {target} à la whitelist de la faction {faction}."
        none: "Aucun de ces joueurs n'a pu être ajouté à la whitelist de la faction {faction} : ils y figurent déjà ou leurs données ne sont pas encore chargées."
      remove:
        description: "Empêche un joueur de créer des personnages qui commencent dans une faction. Ses personnages gardent ce qu'ils ont."
        syntax: "<cible> <faction>"
        message: "{player} a retiré {target} de la whitelist de la faction {faction}."
        none: "Aucun de ces joueurs n'est sur la whitelist de la faction {faction}."
    setfaction:
      description: "Donne à un personnage le paquetage de départ d'une faction, qui en fait un membre. Factions : {factions}"
      syntax: "<cible> <faction>"
      message: "{player} a donné à {target} le paquetage de départ de la faction {faction}."
    rank:
      description: "Change le rang des personnages dans leur faction."
      set:
        description: "Définit le rang d'un personnage dans sa faction, d'après son numéro, son ID ou son nom."
        syntax: "<cible> <rang>"
        message: "{player} a défini le rang de {target} dans sa faction : {rank}."
      promote:
        description: "Promeut un personnage dans sa faction."
        syntax: "<cible>"
        message: "{player} a promu {target} dans sa faction."
      demote:
        description: "Rétrograde un personnage dans sa faction."
        syntax: "<cible>"
        message: "{player} a rétrogradé {target} dans sa faction."
  condition:
    faction:
      name: "Joueur d'une faction précise"
      text: "Faction {operator} {faction}"
      message: "Sélectionnez une faction"
    rank:
      name: "Joueur d'un certain rang dans une faction précise"
      text: "Rang {faction} {operator} {rank}"
      message: "Sélectionnez un rang"
    factions: "Factions"
    ranks: "Rangs"
  error:
    faction:
      invalid: "« {faction} » n'est pas une faction valide !"
      creation_refused: "Cette faction n'accepte pas ce personnage."
      transfer_refused: "{target} ne peut pas recevoir le paquetage de départ de la faction {faction}."
      wrong_species: "{target} n'est pas de la race de la faction {faction}."
      no_kit: "La faction {faction} n'a pas de paquetage de départ à donner."
      kit_incomplete: "Ces objets du paquetage de départ n'ont pas pu être donnés à {target} : {items}"
      no_character: "{target} n'a pas de personnage."
    rank:
      cannot_promote: "Vous ne pouvez promouvoir aucun de ces joueurs."
      cannot_demote: "Vous ne pouvez rétrograder aucun de ces joueurs."
      not_found: "Aucune des factions de ces personnages n'a le rang « {rank} »."
  notification:
    demote_rank: "Vous avez été rétrogradé au rang {rank}."
    promote_rank: "Vous avez été promu au rang {rank}."
    faction_kit_given: "Vous avez reçu le paquetage de départ de la faction {faction}."
    faction_kit_incomplete: "Ces objets de votre paquetage de départ n'ont pas pu vous être donnés : {items}"
    rank_changed: "Votre rang dans la faction est désormais {rank}."
    whitelist_taken: "Vous ne pouvez plus créer de personnages qui commencent dans la faction {faction}."
    whitelist_given: "Vous pouvez désormais créer des personnages qui commencent dans la faction {faction}."
  faction:
    unknown:
      title: "Faction inconnue"
      description: "Cette faction n'a pas de description."
  permission:
    manage_ranks:
      name: "Gérer les rangs des factions"
      description: "Permet de promouvoir et de rétrograder n'importe quel personnage, quels que soient les rangs."
