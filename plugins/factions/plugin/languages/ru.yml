ru:
  command:
    whitelist:
      description: "Управляет доступом игроков к фракциям: доступ позволяет создавать персонажей, которые начинают игру во фракции."
      add:
        description: "Позволяет игроку создавать персонажей, которые начинают игру во фракции."
        syntax: "<игрок> <фракция>"
        message: "{player} дает {target} доступ к фракции {faction}."
        none: "Ни одному из этих игроков не удалось дать доступ к фракции {faction}: он у них уже есть или их данные еще не загружены."
      remove:
        description: "Запрещает игроку создавать персонажей, которые начинают игру во фракции. Его персонажи сохраняют то, что у них есть."
        syntax: "<игрок> <фракция>"
        message: "{player} забирает у {target} доступ к фракции {faction}."
        none: "Ни у одного из этих игроков нет доступа к фракции {faction}."
    setfaction:
      description: "Выдать персонажу стартовый набор фракции, который делает его ее членом. Фракции: {factions}"
      syntax: "<игрок> <фракция>"
      message: "{player} выдает {target} стартовый набор фракции {faction}."
    rank:
      description: "Меняет ранги персонажей в их фракциях."
      set:
        description: "Установить ранг персонажа во фракции по его номеру, ID или названию."
        syntax: "<игрок> <ранг>"
        message: "{player} установил ранг {target} на {rank}."
      promote:
        description: "Повысить игрока во фракции."
        syntax: "<игрок>"
        message: "{player} повышает {target} в ранге."
      demote:
        description: "Понизить игрока во фракции."
        syntax: "<игрок>"
        message: "{player} понижает {target} в ранге."
  condition:
    faction:
      name: Персонаж, состоящий в определенной фракции
      text: Фракция {operator} {faction}
      message: Выберите фракцию
    rank:
      name: Персонаж с определенным рангом в какой-либо фракции
      text: Ранг {faction} {operator} {rank}
      message: Выберите ранг
    factions: Фракции
    ranks: Ранги
  error:
    faction:
      invalid: "'{faction}' не является фракцией!"
      creation_refused: Эта фракция не принимает такого персонажа.
      transfer_refused: "{target} нельзя выдать стартовый набор фракции {faction}."
      wrong_species: "{target} не относится к расе фракции {faction}."
      no_kit: "У фракции {faction} нет стартового набора, который можно выдать."
      kit_incomplete: "Эти предметы стартового набора не удалось выдать {target}: {items}"
      no_character: "У {target} нет персонажа."
    rank:
      cannot_promote: Вы не можете повысить никого из этих игроков.
      cannot_demote: Вы не можете понизить никого из этих игроков.
      not_found: "Ни в одной из фракций этих персонажей нет ранга '{rank}'."
  notification:
    demote_rank: Вы были понижены до ранга {rank}.
    promote_rank: Вы были повышены до ранга {rank}.
    faction_kit_given: Вы получили стартовый набор фракции {faction}.
    faction_kit_incomplete: "Эти предметы Вашего стартового набора не удалось Вам выдать: {items}"
    rank_changed: Ваш ранг во фракции был изменен на {rank}.
    whitelist_taken: Вы больше не можете создавать персонажей, которые начинают игру во фракции {faction}.
    whitelist_given: Теперь Вы можете создавать персонажей, которые начинают игру во фракции {faction}.
  faction:
    unknown:
      title: "Неизвестная фракция"
      description: "У этой фракции нет описания."
  permission:
    manage_ranks:
      name: Управление рангами фракций
      description: Дает доступ к повышению и понижению любого персонажа независимо от рангов.
