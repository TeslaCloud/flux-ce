    max_value: 300
    default_value: 15
  map_scenes_animated:
    name: config.map_scenes.animated.name
    description: config.map_scenes.animated.desc
    category: map_scenes
    type: boolean
    default_value: false
  map_scenes_rotate_speed:
    name: config.map_scenes.rotate_speed.name
    description: config.map_scenes.rotate_speed.desc
    category: map_scenes
    type: number
    min_value: 0
    max_value: 1
    decimals: 2
    default_value: 0.05
