en:
  config:
    quiz:
      title: Entry Quiz
      desc: Settings of the quiz that players have to pass before they can play.
      enabled:
        name: Enable Quiz
        desc: Whether players have to pass the entry quiz before they can create or load a character. Has no effect while no questions are registered.
      pass_percentage:
        name: Pass Percentage
        desc: Share of the questions, in percent, that a player has to answer correctly to pass the quiz.
      kick_on_fail:
        name: Kick On Fail
        desc: Whether players who fail the quiz are kicked from the server. When disabled, they can try again after the retry delay.
      retry_delay:
        name: Retry Delay
        desc: How many seconds a player who failed the quiz has to wait before they can try again. Only used when failing does not kick. Set to 0 to disable.
  error:
    quiz:
      not_passed: You have to pass the entry quiz first.
      kicked: You did not pass the entry quiz.
  ui:
    quiz:
      title: ENTRY QUIZ
      intro: Answer the questions below before you create or load a character.
      required: "At least {percent}% of your answers have to be correct."
      required_all: Every answer has to be correct.
      fail_kick: If you fail, you will be disconnected from the server.
      fail_retry: "If you fail, you can try again in {time}."
      submit: SUBMIT
      disconnect: DISCONNECT
      back: BACK
      incomplete: Answer every question first.
      failed: You did not answer enough questions correctly.
      retry_in: "You can try again in {time}."
      passed: You have passed the entry quiz.
