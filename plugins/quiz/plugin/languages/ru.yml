ru:
  config:
    quiz:
      title: Вступительный тест
      desc: Настройки теста, который игроки должны пройти, прежде чем начать играть.
      enabled:
        name: Включить тест
        desc: Должны ли игроки пройти вступительный тест, прежде чем создавать или загружать персонажа. Ни на что не влияет, пока не зарегистрировано ни одного вопроса.
      pass_percentage:
        name: Процент правильных ответов
        desc: Доля вопросов в процентах, на которые игрок должен ответить правильно, чтобы пройти тест.
      kick_on_fail:
        name: Кикать за провал
        desc: Отключать ли от сервера игроков, не прошедших тест. Если выключено, они могут попробовать снова после задержки.
      retry_delay:
        name: Задержка повторной попытки
        desc: Сколько секунд игрок, не прошедший тест, должен подождать перед новой попыткой. Используется, только если за провал не кикают. Установите 0, чтобы отключить.
  error:
    quiz:
      not_passed: Сначала вам нужно пройти вступительный тест.
      kicked: Вы не прошли вступительный тест.
  ui:
    quiz:
      title: ВСТУПИТЕЛЬНЫЙ ТЕСТ
      intro: Ответьте на вопросы ниже, прежде чем создавать или загружать персонажа.
      required: "Правильными должны быть не менее {percent}% ваших ответов."
      required_all: Все ответы должны быть правильными.
      fail_kick: Если вы не пройдете тест, вы будете отключены от сервера.
      fail_retry: "Если вы не пройдете тест, вы сможете попробовать снова через {time}."
      submit: ОТПРАВИТЬ
      disconnect: ОТКЛЮЧИТЬСЯ
      back: НАЗАД
      incomplete: Сначала ответьте на все вопросы.
      failed: Вы дали недостаточно правильных ответов.
      retry_in: "Вы сможете попробовать снова через {time}."
      passed: Вы прошли вступительный тест.
