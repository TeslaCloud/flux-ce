      empty: "Персонажей гейм-мастеров пока нет. Создайте их в главном меню."
      possess: Вселиться
      release: Отпустить
      taken: "Управляет {name}"
      banned: Заблокирован
      in_world: В мире
      delete: Удалить
      delete_title: Удаление персонажа
