ru:
  attribute:
    category:
      other: Прочее
    level:
      legendary: Легендарно
      heroic: Героически
      superb: Супер
      great: Отлично
      good: Хорошо
      fair: Нормально
      mediocre: Посредственно
      poor: Плохо
      terrible: Ужасно
    other:
      name: Неизвестный атрибут
      desc: У этого атрибута нет описания.
    strength:
      title: Сила
      short: СИЛ
      description:
        Физические способности и общая сила Вашего персонажа. Используется в силовых
        действиях типа выбивания дверей, поднятия тяжестей.
      legendary: О Вашей силе слагают легенды. То, на что нужно несколько человек, для Вас обычное дело, и мало что устоит в Вашей хватке. В ближнем бою Вы сила, которой почти ничто не может противостоять.
      heroic: Ваша сила граничит со сверхчеловеческой. Двери поддаются под Вашим плечом, Вы несёте взрослого мужчину, не сбавляя шага, а один Ваш удар может закончить драку.
      superb: Ваша сила близка к пределу человеческих возможностей. Вы можете поднимать огромные грузы и наносить значительный урон в ближнем бою.
      great: Вы обладаете могучей силой. Вы хорошо справляетесь с подавляющим большинством физических нагрузок.
      good: Ваша сила выше среднего. Переноска тяжестей даётся вам легко, Вы также можете без труда переносить человеческое тело.
      fair: Вы обладаете нормальной силой. Вы можете без особых усилий передвигать мебель средних габаритов и переносить не слишком тяжёлые грузы.
      mediocre: Ваша сила ниже среднего. Вы с трудом удерживаете в руках увесистые предметы.
      poor: Вы не обладаете силой в принципе. Вам трудно открыть туго закатанную банку или бутылку.
      terrible: Ваши мышцы атрофированы. Большинство повседневных действий и даже обыкновенное движение даётся Вам с трудом.
    reflexes:
      title: Рефлексы
      short: РЕФ
      description:
        Ловкость, скорость реакции, координация. Применяется для действий вроде
        карманных краж, взлома, акробатики, уклонений.
      legendary: Ваши рефлексы не укладываются в голове. Вы ловите то, падения чего другие даже не замечают, невредимым проходите сквозь опасность, и ни один замок или карман не защищён от Ваших пальцев.
      heroic: Ваши рефлексы почти сверхъестественны. Вы действуете раньше, чем другие успевают решиться, уходите от ударов, словно предвидя их, и Ваши руки никогда не дрожат.
      superb: Вы невероятно ловки. Для исполнения сложнейших каскадёрских трюков Вам даже не нужна страховка.
      great: Вы весьма ловки. Вы можете легко забраться на высокую преграду, а также исполнять разнообразные акробатические трюки.
      good: Ваша ловкость выше среднего. Вы весьма быстро взбираетесь по лестницам и вряд ли потеряете равновесие в нормльной ситуации.
      fair: Вы обладаете нормальной ловкостью. Вы отлично перепрыгиваете через невысокие преграды.
      mediocre: У Вас посредственная ловкость. Различные упражнения даются Вам с трудом.
      poor: Вас точно нельзя назвать ловким человеком. Летящий в Вас предмет Вы сможете поймать разве что лицом.
      terrible: Вы неуклюжи и медлительны. "Как слон в посудной лавке" - это про Вас.
    perception:
      title: Восприятие
      short: ВСП
      description:
        Работа всех органов чувств, внимательность и осторожность персонажа. Влияет
        на действия, где важна точность - стрельба, броски предметов. Сюда также
        входит умение что-то заметить, вроде мелкой детали или скрывающегося противника.
      legendary: От Вас ничто не ускользает. Вы читаете обстановку, едва войдя в помещение, различаете тишайший звук сквозь городской шум, а засаду, устроенную на Вас, Вы видите заранее.
      heroic: Ваши чувства отточены до необычайной остроты. Вы слышите шёпот сквозь стену, с одного взгляда выхватываете лицо из толпы, и почти ничто не застаёт Вас врасплох.
      superb: Вы обладаете незаурядной внимательностью. Вы можете легко обнаружить иголку в стоге сена.
      great: Ваша внимательность крайне высока. Вы можете заметить мельчайшие детали окружения.
      good: Вы весьма внимательны. Вас трудно обыграть в напёрстки.
      fair: Ваша внимательность в пределах нормы. Вы примечаете новую прическу близкого человека.
      mediocre: У Вас проблемы с внимательностью. Вы можете заметить стоящего вдалеке человека.
      poor: Ваши органы восприятия работают весьма плохо. Вы можете не заметить что-то прямо у себя под носом.
      terrible: У Вас присутствуют болезни, связанные со слухом или зрением. Вы глухи, или же обладаете очень плохим зрением.
    endurance:
      title: Выносливость
      short: ВНС
      description:
        Физическая крепость и общая тренированность организма, телосложение и
        стойкость. Используется в проверках на иммунитет, отравление; сдерживание
        рвоты. От выносливости зависит то, как Ваш персонаж будет переносить ранения.
      legendary: Вашей выносливости нет равных. Боль, голод и изнеможение едва затрагивают Вас, и Вы остаётесь на ногах ещё долго после того, как любой другой свалился бы.
      heroic: Ваше тело подобно крепости. Вы переносите раны, которые свалили бы других, идёте маршем много дней почти без еды и сна, а болезни просто обходят Вас стороной.
      superb: Ваша выносливость чрезвычайно высока. Вы можете перенести серьёзные ранения без значительных последствий для себя.
      great: Вы крайне выносливы. Вы почти не болеете и без труда осилите горный поход.
      good: Вы довольно выносливы. Физические нагрузки не сильно выматывают Вас.
      fair: У Вас нормальная выносливость. Вы легко переносите большинство болезней.
      mediocre: Вы не выносливы. Подъем по лестнице сильно выматывает Вас.
      poor: У Вас плохой иммунитет. Вы постоянно болеете и не можете переносить физические нагрузки.
      terrible: Вы постоянно вымотаны, Вам всегда хочется спать. Вы даже не помните, когда в последний раз были здоровыми.
    intelligence:
      title: Интеллект
      short: ИНТ
      description:
        Умственные способности персонажа, его образованность и знание о мире.
        Может использоваться при работе со сложными устройствами или при поиске уязвимых
        мест противника.
      legendary: Такой ум рождается раз в поколение. Едва ли найдётся предмет, который Вы не способны постичь, а Ваша проницательность превращает безвыходные ситуации в разрешимые.
      heroic: Ваш интеллект исключителен. Вы осваиваете новые области за считанные дни, видите насквозь задачи, ставящие в тупик экспертов, и просчитываете всё на несколько шагов вперёд всех вокруг.
      superb: Вы - настоящий гений. Ваш IQ намного выше среднего, Ваши знания охватывают множество самых разных сфер.
      great: Вы крайне умны. Сложные науки даются Вам довольно легко.
      good: Ваш IQ выше среднего. Вы весьма эрудированны и можете решать большинство поставленных задач.
      fair: У Вас нормальный уровень интеллекта. Получение образование далось Вам без особого труда.
      mediocre: Вы не слишком умны. Точные науки даются Вам с трудом.
      poor: Ваши умственные способности крайне малы. Вам тяжело излагать свои мысли.
      terrible: Вы слабоумны. Вам трудно выговаривать слова.
    determination:
      title: Решимость
      short: РШМ
      description:
        Сила воли и стойкость духа Вашего персонажа. От решимости зависит то, как
        он держится под давлением и превозмогает боль и страх.
      legendary: Ваша воля подобна стихии. Ни угрозы, ни мучения, ни безысходность не заставят Вас отступить, а Ваша решимость придаёт сил всем вокруг.
      heroic: Ваша решимость несокрушима. Страх не имеет над Вами власти, и Вы продолжаете бороться сквозь раны и отчаяние, которые сломили бы почти любого.
      superb: Ваша воля несгибаема. Боль, страх и усталость Вы замечаете и просто отодвигаете в сторону. Вы продолжаете идти там, где любой другой давно бы сдался.
      great: У Вас очень сильная воля. Вас трудно вывести из равновесия, а раны, которые остановили бы большинство людей, Вас лишь замедляют.
      good: Ваша решимость выше среднего. Вы не теряете голову в трудной ситуации и можете перетерпеть боль, когда это необходимо.
      fair: У Вас обычная сила воли. Какое-то время Вы можете держаться, стиснув зубы, но боль и страх действуют на Вас так же, как на всех.
      mediocre: Вы несколько слабовольны. Давление быстро выматывает Вас, а серьёзная рана почти лишает желания бороться.
      poor: Решимости у Вас немного. Вы легко поддаётесь боли и запугиванию и склонны отступать, когда становится тяжело.
      terrible: У Вас совсем нет воли. Малейшей боли или угрозы достаточно, чтобы полностью Вас сломить.
    charisma:
      title: Харизма
      short: ХАР
      description: Обаяние и сила характера Вашего персонажа. Влияет на торг, убеждение, обман и запугивание других персонажей.
      legendary: Ваше обаяние невозможно описать словами. Люди ловят каждое Ваше слово, следуют за Вами без раздумий, и даже Ваши враги ловят себя на желании заслужить Ваше одобрение.
      heroic: Вы пленяете людей. Пара Ваших слов способна успокоить толпу или превратить незнакомца в союзника, и Вы редко уходите с переговоров без того, за чем пришли.
      superb: Ваше обаяние поразительно. Люди мгновенно проникаются к Вам симпатией, легко доверяют Вам, и им трудно Вам отказать.
      great: Вы очень приятны в общении и убедительны. Вы хорошо разбираетесь в людях и знаете, что сказать, чтобы склонить их на свою сторону.
      good: Ваши навыки общения выше среднего. Вы производите хорошее впечатление, можете отговориться от мелких неприятностей и получаете у торговцев честные цены.
      fair: Вы ладите с людьми не хуже и не лучше других. Вы можете поддержать разговор и донести свою мысль, но никто не назовёт Вас мастером красноречия.
      mediocre: Вы несколько неловки в общении. Ваши слова часто звучат не так, как задумано, и люди склонны не замечать Вас или не принимать всерьёз.
      poor: Вы отталкиваете людей. Незнакомцы Вам не доверяют, торговцы завышают для Вас цены, а Ваши попытки кого-то убедить обычно проваливаются.
      terrible: Вы отталкиваете почти всех. Разговоры с Вами не ладятся с первого слова, и люди избегают Вас, когда только могут.
  skill:
    rank:
      untrained: Не обучен
      trained: Обучен
      expert: Эксперт
      master: Мастер
      legendary: Легенда
    other:
      name: Неизвестный навык
      desc: У этого навыка нет описания.
    athletics:
      title: Атлетика
      short: АТЛ
      description: Бег, лазание, прыжки, плавание и другие проявления чистой физической силы.
      untrained: У Вас нет атлетической подготовки, и Вы полагаетесь на ту форму, какая есть.
      trained: Вы умеете распределять силы на бегу, перелезать через забор и плавать, не выбиваясь из сил.
      expert: Вы взбираетесь по стенам, бежите по крышам и выбираетесь из передряг с отработанной лёгкостью.
      master: Ваше тело подобно отлаженному механизму, способному преодолеть почти любое физическое препятствие.
      legendary: Ваши атлетические подвиги кажутся зрителям невозможными, словно препятствия для Вас просто не существуют.
    close_combat:
      title: Ближний бой
      short: БЛБ
      description: Бой на расстоянии вытянутой руки кулаками, тупым оружием, клинками и дубинками.
      untrained: Когда дело доходит до драки, Вы машете руками наугад и надеетесь на лучшее.
      trained: Вы умеете бить кулаком, правильно держать оружие и не опускать защиту.
      expert: Вы дерётесь умело и дисциплинированно, читая противника и ударяя туда, где больнее.
      master: Мало кто устоит против Вас вблизи, ведь Вы обращаете каждую брешь в решающий удар.
      legendary: Ваше мастерство внушает страх, и бой на расстоянии вытянутой руки Вы уже выиграли.
    acrobatics:
      title: Акробатика
      short: АКР
      description: Равновесие, кувырки, уклонение и протискивание в узкие места.
      untrained: Вы держитесь на ногах на ровной земле, но не более того.
      trained: Вы можете удержать равновесие на узком карнизе и уйти в перекат при падении.
      expert: Вы перемахиваете через преграды, кувыркаетесь и выворачиваетесь из опасности с изящной точностью.
      master: Вы движетесь через завалы и падающие обломки, словно по открытой улице.
      legendary: Ваша ловкость граничит с невероятным, и сама гравитация, кажется, подчиняется Вашей воле.
    stealth:
      title: Скрытность
      short: СКР
      description: Незаметное и бесшумное передвижение, укрытие и слежка за другими.
      untrained: Вы примерно так же тихи, как любой, кто идёт по коридору.
      trained: Вы знаете, как смотреть под ноги и держаться в тени.
      expert: Вы проскальзываете мимо патрулей и камер почти без риска быть замеченным.
      master: Вы движетесь как призрак, и люди узнают, что Вы были рядом, лишь много позже Вашего ухода.
      legendary: Вы можете исчезнуть у всех на виду даже под самым пристальным наблюдением.
    larceny:
      title: Воровство
      short: ВОР
      description: Взлом замков, карманные кражи, ловкость рук и обход охраны.
      untrained: Вы не знали бы, с чего начать, окажись перед Вами замок или чужой карман.
      trained: Вы можете открыть простой замок и вытащить плохо лежащий кошелёк, пока никто не смотрит.
      expert: Большинство замков и карманов поддаётся Вашим быстрым и осторожным рукам.
      master: Вы вскрываете сложные замки и вытаскиваете ценности у настороженных жертв, не оставляя следов.
      legendary: Нет замка, который Вы не откроете, и кармана, который Вы не опустошите незаметно.
    marksmanship:
      title: Стрельба
      short: СТР
      description: Меткость при стрельбе из огнестрельного оружия, арбалетов и метательного оружия.
      untrained: Вы знаете, каким концом направлять оружие, но не намного больше.
      trained: Вы можете попасть в цель на разумном расстоянии и безопасно обращаться с огнестрельным оружием.
      expert: Ваши выстрелы уверенны и точны даже под давлением.
      master: Вы кладёте пули точно туда, куда хотите, почти на любом расстоянии.
      legendary: Ваша меткость сверхъестественна, и одного Вашего выстрела часто достаточно.
    survival:
      title: Выживание
      short: ВЫЖ
      description: Поиск еды, воды и укрытия, ориентирование и стойкость к суровым условиям под открытым небом.
      untrained: Вдали от знакомых улиц Вы заблудились бы и проголодались за один день.
      trained: Вы можете найти чистую воду, соорудить простое укрытие и не терять направления.
      expert: Вы с удобством живёте тем, что даёт земля, и избегаете опасностей дикой природы.
      master: Вы процветаете там, где другие гибнут, читая местность и погоду как открытую книгу.
      legendary: Ни дикая глушь, ни руины, ни пустошь не смогут Вас убить, как бы ни старались.
    fortitude:
      title: Стойкость
      short: СТК
      description: Сопротивление ядам, болезням, голоду, холоду и последствиям ран.
      untrained: Ваше тело так же уязвимо для болезней и лишений, как и у любого другого.
      trained: Вы научились держаться, несмотря на голод, холод и лёгкие недомогания.
      expert: Вы стряхиваете с себя яды и инфекции, которые уложили бы других.
      master: Ваше тело выдерживает испытания, которые убили бы большинство людей.
      legendary: Ваше здоровье почти несокрушимо, и очень немногое способно Вас свалить.
    observation:
      title: Наблюдательность
      short: НАБ
      description: Внимание к деталям, обнаружение скрытого и чтение обстановки.
      untrained: Вы замечаете то, что прямо перед Вами, и немногим больше.
      trained: Вы подмечаете детали, мимо которых проходят другие.
      expert: Внимательно присмотревшись, Вы обнаруживаете тайники, невольные знаки и ловушки.
      master: Очень немногое ускользает от Вашего внимания, как бы хорошо оно ни было скрыто.
      legendary: Вы видите то, чего не видят другие, и мельчайшая деталь рассказывает Вам целую историю.
    scavenging:
      title: Собирательство
      short: СОБ
      description: Поиск полезных припасов и материалов в руинах и отбросах.
      untrained: Вы роетесь в хламе и в основном уходите с хламом.
      trained: Вы знаете, где искать полезные мелочи, которые другие упускают.
      expert: Из каждых руин Вы возвращаетесь с чем-то стоящим.
      master: Вы находите припасы там, где все остальные клянутся, что ничего не осталось.
      legendary: Даже вычищенные до нитки руины, кажется, отдают Вам свои последние сокровища.
    medicine:
      title: Медицина
      short: МЕД
      description: Лечение ран и болезней, первая помощь и знание лекарств.
      untrained: Вы можете наложить повязку, но понятия не имеете, что делаете на самом деле.
      trained: Вы можете очистить и перевязать рану и лечить обычные недуги.
      expert: Вы уверенно вправляете кости, зашиваете раны и лечите серьёзные болезни.
      master: Вы проводите сложные операции подручными инструментами и возвращаете людей с того света.
      legendary: "Ваше врачебное мастерство граничит с чудом: Вы спасаете тех, от кого все остальные отказались."
    crafting:
      title: Ремесло
      short: РЕМ
      description: Изготовление, починка и импровизация инструментов, оружия и снаряжения.
      untrained: Вы можете забить гвоздь, но всё, что сложнее, Вам не по силам.
      trained: Вы можете починить простое снаряжение и собрать базовые инструменты.
      expert: Вы собираете надёжное снаряжение из хлама и чините почти всё, что ломается.
      master: Вы создаёте превосходное снаряжение из любых материалов, что оказались под рукой.
      legendary: Ваша работа вызывает восхищение, и Вы можете сделать почти что угодно почти из ничего.
    technology:
      title: Техника
      short: ТЕХ
      description: Электроника, компьютеры и механизмы.
      untrained: Машины и терминалы для Вас загадка.
      trained: Вы можете управлять обычной электроникой и простыми механизмами и чинить их.
      expert: Вы взламываете терминалы, перепаиваете устройства и поддерживаете механизмы в рабочем состоянии.
      master: Вы понимаете и подчиняете себе даже самые передовые технологии.
      legendary: Нет системы, которую Вы не смогли бы понять, обойти или собрать заново.
    lore:
      title: Эрудиция
      short: ЭРУ
      description: Знание истории, науки, культуры и мира в целом.
      untrained: Вы мало знаете сверх того, что видели своими глазами.
      trained: У Вас крепкое общее образование, и Вы знаете основы большинства предметов.
      expert: Вы глубоко разбираетесь в нескольких областях и помните малоизвестные факты.
      master: Учёные позавидовали бы широте и глубине Ваших знаний.
      legendary: Ваши знания энциклопедичны, и почти на любой вопрос у Вас найдётся ответ.
    persuasion:
      title: Убеждение
      short: УБЖ
      description: Склонение других на свою сторону доводами, обаянием и честными аргументами.
      untrained: Вы излагаете свою позицию и надеетесь, что с ней согласятся.
      trained: Вы можете ясно изложить довод и расположить к себе разумных людей.
      expert: Вы умеете находить общий язык и переубеждать даже скептиков.
      master: Ваши слова меняют мнения, казавшиеся высеченными в камне.
      legendary: Вы можете уговорить почти кого угодно почти на что угодно, и он ещё будет этому рад.
    deception:
      title: Обман
      short: ОБМ
      description: Ложь, блеф, маскировка и отвлечение внимания.
      untrained: Ваша ложь прозрачна, а лицо Вас выдаёт.
      trained: Вы можете убедительно солгать тому, у кого нет причин Вам не верить.
      expert: Вы блефуете с невозмутимым лицом и не путаетесь в своих историях.
      master: Вы плетёте ложь настолько убедительную, что ей верят даже подозрительные люди.
      legendary: Ваш обман безупречен, и правда такова, какой Вы её называете.
    intimidation:
      title: Запугивание
      short: ЗАП
      description: Принуждение других угрозами, напором и страхом.
      untrained: На Ваши угрозы обычно лишь пожимают плечами.
      trained: Вы можете заставить людей занервничать настолько, чтобы они задумались.
      expert: Тяжёлого взгляда и пары Ваших слов хватает, чтобы большинство людей отступило.
      master: Люди ломаются под Вашими угрозами и делают, что им велено.
      legendary: Одного Вашего присутствия достаточно, чтобы самые храбрые теряли самообладание.
    streetwise:
      title: Знание улиц
      short: УЛЦ
      description: Знание улиц, чёрного рынка, слухов и нужных людей.
      untrained: Вы мало знаете о том, как на самом деле устроена жизнь на улицах.
      trained: Вы знаете, где найти скупщика, слух или сделку в подворотне.
      expert: У Вас есть связи по всему городу, и Вы узнаёте о событиях раньше других.
      master: На улицах ничего не происходит без того, чтобы Вы вскоре об этом не узнали.
      legendary: Преступный мир Ваш дом, и каждая его дверь открыта для Вас.
    composure:
      title: Самообладание
      short: САМ
      description: Сохранение спокойствия под давлением и сопротивление страху, допросам и манипуляциям.
      untrained: Давление быстро берёт над Вами верх, и это заметно.
      trained: Вы можете сохранять трезвую голову, когда всё идёт не так.
      expert: Вы сохраняете спокойствие под огнём и ничего не выдаёте на допросе.
      master: Угрозы, допросы и паника стекают с Вас как дождь.
      legendary: Ваше спокойствие непоколебимо, что бы ни обрушил на Вас мир.
    focus:
      title: Концентрация
      short: КОН
      description: Сосредоточенность на задаче, несмотря на боль, отвлечения и усталость.
      untrained: Ваши мысли разбегаются, едва что-то другое привлекает Ваше внимание.
      trained: Вы можете сосредоточиться на задаче, несмотря на шум и небольшие неудобства.
      expert: Вы удерживаете внимание на работе сквозь боль и хаос.
      master: Стоит Вам на чём-то сосредоточиться, и ничто не может сбить Вашу концентрацию.
      legendary: Ваша сосредоточенность абсолютна и отсекает всё, кроме текущей задачи.
  command:
    charsetattribute:
      description: "Установить атрибут персонажа. Атрибуты: {attributes}"
      syntax: <цель> <атрибут> <значение>
      message: "{player} устанавливает {target} атрибут {attribute} на {value}."
    charsetskill:
      description: "Установить ранг навыка персонажа. Навыки: {skills}"
      syntax: <цель> <навык> <ранг>
      message: "{player} устанавливает {target} навык {skill} на ранг {value}."
    charattributeboost:
      description: "Усилить атрибут персонажа. Длительность 'perma' дает усиление, которое действует, пока его не снимут. Атрибуты: {attributes}"
      syntax: <цель> <атрибут> <значение> <длительность>
      message: "{player} усиливает {target} атрибут {attribute} на {value} на {time}."
      message_permanent: "{player} усиливает {target} атрибут {attribute} на {value} навсегда."
    charattributeboostclear:
      description: "Снять усиления с атрибута персонажа или со всех атрибутов, если атрибут не указан. Атрибуты: {attributes}"
      syntax: "<цель> [атрибут]"
      message: "{player} снимает с {target} усиления атрибута {attribute}."
      message_all: "{player} снимает с {target} все усиления атрибутов."
    charattributes:
      description: "Посмотреть атрибуты и навыки персонажа."
      syntax: <цель>
      header: "Атрибуты персонажа {target}:"
      line: "{attribute} ({id}): уровень {level}, усиление {boost}"
      skills_header: "Навыки персонажа {target}:"
      skill_line: "{skill} ({id}): ранг {rank}"
  condition:
    attribute:
      name: Игрок с определенным атрибутом
      text: Атрибут {attribute} {operator} {value}
      message1: Выберите атрибут
      message2: Выберите значение атрибута
    attributes: Атрибуты
    skill:
      name: Игрок с определенным рангом навыка
      text: Навык {skill} {operator} {value}
      message1: Выберите навык
      message2: Выберите ранг навыка
    skills: Навыки
  config:
    stats:
      title: Характеристики
      desc: Характеристики персонажей и то, на что они влияют в игре.
      creation_points:
        name: Очки характеристик при создании
        desc: Сколько очков новый персонаж распределяет между характеристиками. Сумма выбранных уровней характеристик должна быть равна этому числу.
      faction_bonuses:
        name: Бонусы фракций к характеристикам
        desc: Давать персонажам бонусы к характеристикам от их фракции в виде усилений, которые действуют, пока персонаж состоит в ней.
      perception_hearing:
        name: Дальность слуха за уровень восприятия
        desc: Сколько метров прибавляется к расстоянию, на котором персонаж слышит внутриигровую речь, за каждый уровень восприятия, и отнимается за каждый уровень ниже нуля. При значении 0 эффект отключён.
      endurance_stamina:
        name: "Запас сил за уровень выносливости, %"
        desc: На сколько процентов медленнее расходуется и быстрее восстанавливается запас сил за каждый уровень выносливости, и наоборот при уровне ниже нуля. При значении 0 эффект отключён.
      endurance_recovery:
        name: "Восстановление за уровень выносливости, %"
        desc: На сколько процентов ускоряются восстановление здоровья и заживление повреждённых частей тела за каждый уровень выносливости, и замедляются при уровне ниже нуля. Требуются плагины Damage и Limb Damage. При значении 0 эффект отключён.
      strength_lifting:
        name: "Подъём тяжестей за уровень силы, %"
        desc: На сколько процентов увеличиваются наибольшая масса предмета, который персонаж может поднять, и сила его броска за каждый уровень силы, и уменьшаются при уровне ниже нуля. При значении 0 эффект отключён.
      reflexes_fall:
        name: "Урон от падения за уровень рефлексов, %"
        desc: На сколько процентов меньше урона от падения получает персонаж за каждый уровень рефлексов, и больше за каждый уровень ниже нуля. Требуется плагин Damage. При значении 0 эффект отключён.
      charisma_prices:
        name: "Цены торговцев за уровень харизмы, %"
        desc: На сколько процентов дешевле торговцы продают персонажу за каждый уровень харизмы, и дороже при уровне ниже нуля. Цена никогда не опускается ниже той, что торговец платит за предмет. Требуется плагин Vendors. При значении 0 эффект отключён.
      rank_bonus:
        name: Мастерство за ранг навыка
        desc: Бонус, который каждый ранг изученного навыка прибавляет к броскам этого навыка. Изученный навык также прибавляет уровень персонажа, неизученный не прибавляет ничего.
      determination_pain:
        name: "Штрафы от ранений за уровень решимости, %"
        desc: На сколько процентов ослабевают замедление и дрожание прицела от повреждённых частей тела за каждый уровень решимости, и усиливаются при уровне ниже нуля. Требуется плагин Limb Damage. При значении 0 эффект отключён.
