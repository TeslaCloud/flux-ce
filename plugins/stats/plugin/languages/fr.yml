fr:
  attribute:
    category:
      other: "Autre"
    level:
      legendary: "Légendaire"
      heroic: "Héroïque"
      superb: "Superbe"
      great: "Excellent"
      good: "Bon"
      fair: "Correct"
      mediocre: "Médiocre"
      poor: "Faible"
      terrible: "Terrible"
    other:
      name: "Attribut inconnu"
      desc: "Cet attribut n'a pas de description."
    strength:
      title: "Force"
      short: "FRC"
      description: "La condition physique de votre personnage. Influe sur les chances de réussir une action de force brute, comme enfoncer une porte."
      legendary: "Votre force est digne des légendes. Ce qui demanderait plusieurs personnes est pour vous une simple formalité, et peu de choses résistent à votre poigne. Au corps à corps, vous êtes une force que presque rien ne peut arrêter."
      heroic: "Votre force frôle le surhumain. Les portes cèdent sous votre épaule, vous portez un adulte sans ralentir, et un seul de vos coups peut mettre fin à un combat."
      superb: "Votre force est celle d'un athlète olympique. Vous soulevez de lourdes charges avec un effort minime, et vos coups au corps à corps peuvent être mortels."
      great: "Vos muscles sont en excellente forme. Vous soulevez des objets lourds avec un certain effort, et au corps à corps vous êtes un adversaire redoutable."
      good: "Votre force est supérieure à la moyenne. Vous pouvez soulever des objets lourds au prix d'efforts éprouvants qui risquent de vous fatiguer, et vous savez bien vous défendre au corps à corps."
      fair: "Votre force est dans la moyenne. Vous avez du mal à soulever des objets lourds, et vous risquez de vous blesser si vous ne faites pas très attention. Au corps à corps, on peut facilement prendre le dessus sur vous."
      mediocre: "Votre force est plutôt faible. Le moindre objet un peu lourd vous paraît encombrant et difficile à manier. Au corps à corps, vos efforts sont en grande partie vains sans l'aide d'une arme."
      poor: "Vous n'avez pour ainsi dire aucune force. Le moindre effort physique, parfois même la marche, peut vous coûter énormément. Au corps à corps, presque n'importe qui prend facilement le dessus sur vous."
      terrible: "Aucune force. Fournir le moindre effort physique peut même vous nuire. Le corps à corps vous est inconnu : vous êtes si frêle qu'un coup de vent pourrait vous renverser."
    reflexes:
      title: "Réflexes"
      short: "REF"
      description: "La dextérité et le temps de réaction de votre personnage. Interviennent dans le crochetage, l'esquive, etc."
      legendary: "Vos réflexes défient l'entendement. Vous rattrapez ce que les autres ne voient même pas tomber, traversez le danger sans une égratignure, et aucune serrure ni aucune poche n'est à l'abri de vos doigts."
      heroic: "Vos réflexes sont presque surnaturels. Vous agissez avant que les autres aient même décidé de bouger, esquivez les coups comme si vous les aviez vus venir, et vos mains ne tremblent jamais."
      superb: "Vos réflexes sont aussi affûtés que ceux d'un ninja. Les prouesses d'agilité ne vous demandent aucun effort, et vos mains sont naturellement agiles et habiles. Vos coups au corps à corps portent presque à tous les coups, et vous esquivez ceux des autres avec aisance."
      great: "Vos réflexes sont vraiment excellents. Tout ce qui demande des réflexes vous vient avec une relative facilité, et certaines acrobaties vous sont naturelles. Vos coups au corps à corps portent facilement, et vos adversaires ont du mal à vous toucher."
      good: "Votre agilité est supérieure à celle de la moyenne des gens. Vous montez les escaliers avec aisance et perdez rarement l'équilibre dans la vie de tous les jours. Sans être un as du parkour ni un excellent combattant, vous avez des aptitudes notables."
      fair: "Votre agilité est celle d'un humain moyen. Vous vous déplacez normalement sans trop de peine, mais vous commencez à peiner pour escalader de grands obstacles ou sauter rapidement par-dessus quelque chose. Votre vitesse et votre dextérité n'ont rien de remarquable."
      mediocre: "Votre agilité est médiocre. Vous pouvez paraître un peu maladroit ou lent, et vous avez du mal à grimper ou à vous frayer un chemin sur un terrain accidenté. Vos coups de poing partent plus lentement que la moyenne."
      poor: "Votre agilité est bien inférieure à la moyenne. Vous êtes un coureur plutôt lent, et vous peinez dès qu'il s'agit de faire la course avec les autres."
      terrible: "Vous êtes très lent, au point que presque tout le monde, sinon tout le monde, peut vous suivre sans effort. Cela pourrait presque passer pour un handicap."
    perception:
      title: "Perception"
      short: "PER"
      description: "La vigilance générale de votre personnage. Influe sur les chances de remarquer assez vite quelque chose, ou quelque chose que votre adversaire ne voit pas."
      legendary: "Rien ne vous échappe. Vous cernez une pièce dès que vous y entrez, distinguez le moindre bruit dans le vacarme de la ville, et une embuscade qui vous est destinée est une embuscade que vous avez vue venir."
      heroic: "Vos sens sont aiguisés bien au-delà de l'ordinaire. Vous entendez un murmure à travers un mur, repérez un visage dans la foule d'un seul coup d'œil, et presque rien ne vous prend par surprise."
      superb: "Votre vue et votre ouïe sont extraordinaires. Trouver une aiguille dans une botte de foin est pour vous un jeu d'enfant, tout comme distinguer des jumeaux (voire des agents de la PC). Quiconque tente de passer discrètement aura bien du mal à vous échapper."
      great: "Votre sens de l'observation est tout à fait remarquable. Vous remarquez de petits détails même de loin, et de près, vous voyez les choses presque au ralenti. Identifier les bruits vous est aussi bien plus facile."
      good: "Votre capacité à observer de loin et à percevoir les bruits discrets est supérieure à la moyenne. Difficile à battre au bonneteau, vous avez de bonnes chances de repérer un ennemi avant qu'il ne vous repère, et vous pouvez vous faufiler tout en restant attentif aux pas lointains."
      fair: "Vos sens fonctionnent correctement, sans rien de remarquable. Vous repérez facilement les changements soudains, et vous finissez par identifier les silhouettes lointaines. Entendre des pas qui approchent est difficile, mais faisable."
      mediocre: "Votre vue et votre ouïe ont quelques défauts courants. Vous pouvez remarquer des objets au loin, mais sans parvenir à les distinguer ni à les identifier. La plupart des bruits vous semblent confus et se ressemblent tous."
      poor: "Vos organes des sens sont défaillants et fonctionnent assez mal. Vous ne percevez que rarement les petits animaux ou les petits objets, si tant est que vous les perceviez. Inutile pour vous de tendre l'oreille aux bruits étouffés : ils vous embrouilleraient plus qu'ils ne vous renseigneraient."
      terrible: "Vos troubles de l'ouïe ou de la vue ont des effets dévastateurs. Vous êtes presque sourd ou vous voyez très mal. Même comprendre les signaux les plus simples des autres vous paraît très difficile."
    endurance:
      title: "Constitution"
      short: "CST"
      description: "La forme physique générale et la résistance de votre personnage. Détermine les coups qu'il peut encaisser."
      legendary: "Votre constitution est sans égale. La douleur, la faim et l'épuisement ont à peine prise sur vous, et vous tenez debout bien après que n'importe qui d'autre se serait effondré."
      heroic: "Votre corps est une forteresse. Vous ignorez des blessures qui terrasseraient les autres, marchez des jours entiers avec peu de nourriture et de sommeil, et la maladie vous épargne tout simplement."
      superb: "Votre corps est l'incarnation même de la résistance et de la discipline. Vous pouvez vous infliger toutes sortes de douleurs et d'épreuves, et vous en sortirez très probablement indemne."
      great: "Vous êtes extrêmement robuste. Vous ne tombez presque jamais malade et une randonnée en montagne ne vous fait pas peur."
      good: "Bien que solide, votre corps n'en est qu'au début de son parcours. Vous savez encaisser les coups et tenez plus longtemps que la plupart des gens dans les efforts physiques où d'autres flanchent."
      fair: "Comme presque tout le monde, votre condition physique est tout à fait ordinaire. Vous supportez la douleur et pouvez affronter les difficultés avec constance pendant un certain temps."
      mediocre: "Vous n'êtes pas très en forme ni très endurant, mais vous tenez le coup. Vous souffrez physiquement, par exemple en montant des escaliers et en vous fatiguant, mais cela ne va généralement pas plus loin."
      poor: "Votre corps est fragile, plus que celui de la plupart des gens. Vous attirez les maladies comme une flamme attire les papillons de nuit, et votre personnage souffre dès qu'il doit marcher un peu."
      terrible: "Vous êtes constamment épuisé et avez toujours envie de dormir. Vous ne vous souvenez même plus de la dernière fois où vous étiez vraiment en bonne santé."
    intelligence:
      title: "Intelligence"
      short: "INT"
      description: "La force de l'esprit. Détermine à quel point votre personnage est intelligent. Peut s'avérer utile pour malmener d'autres personnages sur le plan mental."
      legendary: "Votre esprit est de ceux qu'on ne rencontre qu'une fois par génération. Il n'existe guère de sujet que vous ne puissiez comprendre, et votre perspicacité rend solubles les situations les plus inextricables."
      heroic: "Votre intellect est exceptionnel. Vous maîtrisez de nouveaux domaines en quelques jours, percez à jour des problèmes qui laissent les experts perplexes, et avez toujours plusieurs coups d'avance sur votre entourage."
      superb: "Vous êtes un génie. Votre QI est bien au-dessus de la moyenne, et vos connaissances couvrent de nombreux domaines très différents. Peu de gens peuvent rivaliser avec vous dans une joute d'esprit."
      great: "Vous êtes extrêmement intelligent. Les sciences complexes vous viennent assez facilement. Vous avez l'esprit vif et trouvez des solutions bien plus vite que la plupart des gens."
      good: "Votre QI est supérieur à la moyenne. Vous êtes très cultivé et pouvez résoudre la plupart des problèmes. Vous prenez souvent des décisions presque parfaites."
      fair: "Votre intelligence est dans la norme. Vous avez reçu une éducation correcte. Vous savez vous débrouiller face à la plupart des problèmes et des situations qui se présentent."
      mediocre: "Vous n'êtes pas très malin. Les sciences exactes vous donnent du fil à retordre. Vous pouvez venir à bout d'un problème si vous y réfléchissez suffisamment."
      poor: "Vos capacités intellectuelles sont insignifiantes. Vous avez du mal à exprimer vos pensées. Il vous sera sans doute assez difficile de vous sortir des situations qui demandent une réflexion stratégique."
      terrible: "Vous avez l'esprit faible. Vous avez du mal à prononcer les mots. Les situations difficiles sont pour vous presque insurmontables."
    determination:
      title: "Détermination"
      short: "DET"
      description: "La volonté et la résolution de votre personnage. Détermine dans quelle mesure il tient bon face à la douleur, à la peur et à la pression."
      legendary: "Votre volonté est une force de la nature. Aucune menace, aucun tourment ni aucun désespoir ne peut vous faire céder, et votre résolution raffermit tous ceux qui vous entourent."
      heroic: "Votre résolution est inébranlable. La peur n'a aucune prise sur vous, et vous continuez à vous battre malgré des blessures et un désespoir qui briseraient presque n'importe qui."
      superb: "Votre volonté est indestructible. La douleur, la peur et l'épuisement, vous les remarquez, puis vous les mettez de côté. Vous continuez bien après que n'importe qui d'autre aurait abandonné."
      great: "Vous avez une volonté remarquable. Il en faut beaucoup pour vous ébranler, et des blessures qui arrêteraient la plupart des gens ne font que vous ralentir."
      good: "Votre résolution est supérieure à la moyenne. Vous gardez la tête froide dans les situations délicates et savez surmonter la douleur quand il le faut."
      fair: "Votre volonté est celle d'une personne ordinaire. Vous pouvez serrer les dents un moment, mais la douleur et la peur vous atteignent comme tout le monde."
      mediocre: "Vous manquez un peu de volonté. La pression vous use rapidement, et une mauvaise blessure vous enlève l'essentiel de votre combativité."
      poor: "Vous avez peu de résolution. Vous cédez facilement à la douleur et à l'intimidation, et avez tendance à reculer quand les choses se corsent."
      terrible: "Vous n'avez aucune volonté propre. La moindre douleur ou la moindre menace suffit à vous briser complètement."
    charisma:
      title: "Charisme"
      short: "CHA"
      description: "La présence et la force de caractère de votre personnage. Influe sur le marchandage, la persuasion, le mensonge et l'intimidation envers les autres personnages."
      legendary: "Votre présence est d'un magnétisme indescriptible. Les gens sont suspendus à vos lèvres, vous suivent sans poser de questions, et même vos ennemis en viennent à rechercher votre approbation."
      heroic: "Vous êtes captivant. Quelques mots de votre part suffisent à calmer une foule ou à faire d'un inconnu un allié, et vous quittez rarement une négociation sans avoir obtenu ce que vous étiez venu chercher."
      superb: "Votre charme est remarquable. Les gens se prennent instantanément de sympathie pour vous, vous font facilement confiance et ont du mal à vous dire non."
      great: "Vous êtes très sympathique et persuasif. Vous cernez bien les gens et savez exactement quoi dire pour les rallier à votre cause."
      good: "Vos aptitudes sociales sont supérieures à la moyenne. Vous faites bonne impression, savez vous sortir de petits ennuis par la parole et obtenez des prix honnêtes auprès des marchands."
      fair: "Vous vous entendez avec les gens comme tout le monde. Vous savez tenir une conversation et faire valoir votre point de vue, mais personne ne vous qualifierait de beau parleur."
      mediocre: "Vous êtes un peu maladroit avec les autres. Vos paroles sortent souvent de travers, et les gens ont tendance à vous ignorer ou à vous prendre moins au sérieux."
      poor: "Vous rebutez les gens. Les inconnus se méfient de vous, les marchands vous font payer plus cher, et vos tentatives pour persuader qui que ce soit tombent généralement à plat."
      terrible: "Vous rebutez presque tout le monde. Les conversations avec vous tournent mal dès le premier mot, et les gens vous évitent dès qu'ils le peuvent."
  skill:
    rank:
      untrained: "Non formé"
      trained: "Formé"
      expert: "Expert"
      master: "Maître"
      legendary: "Légendaire"
    other:
      name: "Compétence inconnue"
      desc: "Cette compétence n'a pas de description."
    athletics:
      title: "Athlétisme"
      short: "ATH"
      description: "Courir, grimper, sauter, nager et autres prouesses d'effort physique pur."
      untrained: "Vous n'avez aucune formation en athlétisme et comptez sur la forme physique que vous avez, quelle qu'elle soit."
      trained: "Vous savez gérer votre allure à la course, escalader une clôture et nager sans gaspiller vos forces."
      expert: "Vous escaladez les murs, sprintez sur les toits et vous tirez d'affaire avec l'aisance de l'habitude."
      master: "Votre corps est une machine parfaitement réglée, capable de franchir presque n'importe quel obstacle physique."
      legendary: "Vos prouesses athlétiques paraissent impossibles aux yeux des spectateurs, comme si les obstacles n'existaient tout simplement pas pour vous."
    close_combat:
      title: "Corps à corps"
      short: "CAC"
      description: "Se battre à bout de bras avec les poings, des armes contondantes, des lames et des matraques."
      untrained: "Quand le combat devient rapproché, vous frappez au hasard en espérant que ça passe."
      trained: "Vous savez donner un coup de poing, tenir correctement une arme et garder votre garde haute."
      expert: "Vous vous battez avec habileté et discipline, lisez votre adversaire et frappez là où ça fait mal."
      master: "Peu de gens peuvent vous tenir tête de près : vous transformez chaque ouverture en coup décisif."
      legendary: "Votre talent est redoutable, et un combat à bout de bras est un combat que vous avez déjà gagné."
    acrobatics:
      title: "Acrobaties"
      short: "ACR"
      description: "L'équilibre, les roulades, l'esquive et l'art de se faufiler dans les espaces étroits."
      untrained: "Vous tenez debout sur un sol plat, mais guère plus."
      trained: "Vous savez garder l'équilibre sur une corniche étroite et amortir une chute par une roulade."
      expert: "Vous sautez, roulez et vous contorsionnez pour échapper au danger avec une précision gracieuse."
      master: "Vous traversez un terrain encombré et une pluie de débris comme s'il s'agissait d'une rue dégagée."
      legendary: "Votre agilité frôle l'irréel, et la gravité semble se plier à votre volonté."
    stealth:
      title: "Discrétion"
      short: "DIS"
      description: "Se déplacer sans être vu ni entendu, se cacher et filer les autres."
      untrained: "Vous êtes à peu près aussi discret que n'importe qui marchant dans un couloir."
      trained: "Vous savez regarder où vous mettez les pieds et rester dans l'ombre."
      expert: "Vous passez entre les patrouilles et les caméras avec peu de risques d'être repéré."
      master: "Vous vous déplacez comme un fantôme, et l'on n'apprend que vous étiez là que bien après votre départ."
      legendary: "Vous pouvez disparaître à la vue de tous, même sous la surveillance la plus étroite."
    larceny:
      title: "Larcin"
      short: "LAR"
      description: "Crocheter les serrures, faire les poches, l'escamotage et le contournement des dispositifs de sécurité."
      untrained: "Vous ne sauriez pas par où commencer face à une serrure ou à la poche d'un inconnu."
      trained: "Vous savez ouvrir des serrures simples et subtiliser un portefeuille mal rangé quand personne ne regarde."
      expert: "La plupart des serrures et des poches cèdent à vos mains rapides et soigneuses."
      master: "Vous venez à bout de serrures complexes et dérobez des objets de valeur à des cibles méfiantes sans laisser de trace."
      legendary: "Il n'existe aucune serrure que vous ne puissiez ouvrir ni aucune poche que vous ne puissiez vider sans être remarqué."
    marksmanship:
      title: "Tir"
      short: "TIR"
      description: "La précision avec les armes à feu, les arbalètes et les armes de jet."
      untrained: "Vous savez dans quel sens pointer une arme, mais guère plus."
      trained: "Vous savez toucher une cible à une distance raisonnable et manier une arme à feu en toute sécurité."
      expert: "Vos tirs restent stables et précis, même sous pression."
      master: "Vous placez vos balles exactement où vous le voulez, à presque n'importe quelle distance."
      legendary: "Votre visée est stupéfiante, et un seul de vos tirs suffit souvent."
    survival:
      title: "Survie"
      short: "SUR"
      description: "Trouver de la nourriture, de l'eau et un abri, garder ses repères et endurer les conditions difficiles en extérieur."
      untrained: "Loin des rues que vous connaissez, vous seriez perdu et affamé en moins d'une journée."
      trained: "Vous savez trouver de l'eau potable, construire un abri sommaire et garder vos repères."
      expert: "Vous vivez confortablement de ce que la nature offre et évitez les dangers des contrées sauvages."
      master: "Vous prospérez là où d'autres périssent, et lisez le terrain et la météo comme un livre ouvert."
      legendary: "Aucune étendue sauvage, aucune ruine ni aucun désert ne peut avoir raison de vous, malgré tous ses efforts."
    fortitude:
      title: "Robustesse"
      short: "ROB"
      description: "Résister au poison, à la maladie, à la faim, au froid et aux séquelles des blessures."
      untrained: "Votre corps est aussi vulnérable que celui de n'importe qui face à la maladie et aux épreuves."
      trained: "Vous avez appris à tenir bon malgré la faim, le froid et les maladies bénignes."
      expert: "Vous surmontez des toxines et des infections qui terrasseraient les autres."
      master: "Votre corps endure des épreuves qui tueraient la plupart des gens."
      legendary: "Votre constitution est presque indomptable, et bien peu de choses peuvent vous abattre."
    observation:
      title: "Observation"
      short: "OBS"
      description: "Repérer les détails, remarquer ce qui est caché et analyser une scène."
      untrained: "Vous remarquez ce qui se trouve juste devant vous, et guère plus."
      trained: "Vous relevez des détails devant lesquels les autres passent sans les voir."
      expert: "D'un regard attentif, vous repérez les choses cachées, les signes trahissant quelqu'un et les pièges."
      master: "Très peu de choses échappent à votre attention, aussi bien dissimulées soient-elles."
      legendary: "Vous voyez ce que les autres ne peuvent pas voir, et le moindre détail vous raconte toute une histoire."
    scavenging:
      title: "Fouille"
      short: "FOU"
      description: "Fouiller les ruines et les déchets à la recherche de fournitures et de matériaux utiles."
      untrained: "Vous fouillez dans le bric-à-brac et en ressortez surtout avec du bric-à-brac."
      trained: "Vous savez où chercher les petites choses utiles que les autres ratent."
      expert: "Vous revenez de chaque ruine avec quelque chose qui en vaut la peine."
      master: "Vous trouvez des fournitures là où tout le monde jure qu'il ne reste plus rien."
      legendary: "Même les ruines pillées jusqu'à l'os semblent vous livrer leurs derniers trésors."
    medicine:
      title: "Médecine"
      short: "MED"
      description: "Soigner les blessures et les maladies, les premiers secours et la connaissance des médicaments."
      untrained: "Vous savez poser un bandage, mais vous n'avez aucune idée de ce que vous faites vraiment."
      trained: "Vous savez nettoyer et panser les plaies et soigner les affections courantes."
      expert: "Vous réduisez les fractures, suturez les plaies et soignez les maladies graves avec assurance."
      master: "Vous réalisez des interventions complexes avec des outils de fortune et ramenez les gens du bord du gouffre."
      legendary: "Votre talent médical tient presque du miracle : vous sauvez ceux que tout le monde avait abandonnés."
    crafting:
      title: "Artisanat"
      short: "ART"
      description: "Fabriquer, réparer et improviser des outils, des armes et de l'équipement."
      untrained: "Vous savez planter un clou, mais tout ce qui est plus compliqué vous dépasse."
      trained: "Vous savez réparer du matériel simple et assembler des outils de base."
      expert: "Vous fabriquez du matériel fiable à partir de ferraille et réparez presque tout ce qui casse."
      master: "Vous fabriquez de l'équipement de qualité avec les matériaux qui vous tombent sous la main."
      legendary: "Votre travail est une merveille, et vous pouvez fabriquer presque n'importe quoi à partir de presque rien."
    technology:
      title: "Technologie"
      short: "TEC"
      description: "L'électronique, l'informatique et les machines."
      untrained: "Les machines et les terminaux sont un mystère pour vous."
      trained: "Vous savez utiliser et réparer l'électronique courante et les machines simples."
      expert: "Vous piratez des terminaux, recâblez des appareils et assurez le bon fonctionnement des machines."
      master: "Vous comprenez et manipulez même la technologie la plus avancée."
      legendary: "Il n'existe aucun système que vous ne puissiez comprendre, contourner ou reconstruire."
    lore:
      title: "Savoir"
      short: "SAV"
      description: "La connaissance de l'histoire, des sciences, de la culture et du monde en général."
      untrained: "Vous ne savez pas grand-chose au-delà de ce que vous avez vu de vos propres yeux."
      trained: "Vous avez une solide culture générale et connaissez les bases de la plupart des sujets."
      expert: "Vous avez des connaissances approfondies dans plusieurs domaines et vous souvenez de faits obscurs."
      master: "Les érudits envieraient l'étendue et la profondeur de vos connaissances."
      legendary: "Votre savoir est encyclopédique, et vous avez une réponse à presque toutes les questions."
    persuasion:
      title: "Persuasion"
      short: "PRS"
      description: "Convaincre les autres par la raison, le charme et des arguments honnêtes."
      untrained: "Vous exposez votre point de vue en espérant que les autres seront d'accord."
      trained: "Vous savez présenter un argument clairement et convaincre les personnes raisonnables."
      expert: "Vous savez trouver un terrain d'entente et rallier même les sceptiques."
      master: "Vos paroles peuvent faire changer d'avis des gens qui semblaient inflexibles."
      legendary: "Vous pouvez convaincre presque n'importe qui de presque n'importe quoi, et lui faire plaisir par-dessus le marché."
    deception:
      title: "Tromperie"
      short: "TRO"
      description: "Le mensonge, le bluff, les déguisements et la diversion."
      untrained: "Vos mensonges sont cousus de fil blanc, et votre visage vous trahit."
      trained: "Vous savez mentir de façon convaincante à quelqu'un qui n'a aucune raison de douter de vous."
      expert: "Vous bluffez sans sourciller et gardez des histoires cohérentes."
      master: "Vous tissez des mensonges si convaincants que même les personnes méfiantes y croient."
      legendary: "Vos tromperies sont parfaites, et la vérité est ce que vous dites qu'elle est."
    intimidation:
      title: "Intimidation"
      short: "ITM"
      description: "Contraindre les autres par la menace, la présence et la peur."
      untrained: "Vos menaces sont en général accueillies par un haussement d'épaules."
      trained: "Vous savez mettre les gens assez mal à l'aise pour qu'ils y réfléchissent à deux fois."
      expert: "Un regard dur et quelques mots de votre part suffisent à faire reculer la plupart des gens."
      master: "Les gens s'effondrent sous vos menaces et font ce qu'on leur dit."
      legendary: "Votre seule présence suffit à faire perdre leurs moyens aux plus courageux."
    streetwise:
      title: "Sens de la rue"
      short: "RUE"
      description: "Connaître la rue, le marché noir, les rumeurs et les gens qui comptent."
      untrained: "Vous ne savez pas grand-chose de la façon dont les choses fonctionnent vraiment dans la rue."
      trained: "Vous savez où trouver un receleur, une rumeur ou une affaire dans une ruelle."
      expert: "Vous avez des contacts dans toute la ville et entendez parler des choses avant les autres."
      master: "Rien ne se passe dans la rue sans que vous l'appreniez peu après."
      legendary: "La pègre est votre maison, et toutes ses portes s'ouvrent devant vous."
    composure:
      title: "Sang-froid"
      short: "SGF"
      description: "Garder son calme sous la pression et résister à la peur, aux interrogatoires et à la manipulation."
      untrained: "La pression vous gagne vite, et cela se voit."
      trained: "Vous savez garder la tête froide quand les choses tournent mal."
      expert: "Vous restez calme sous le feu et ne laissez rien paraître lors d'un interrogatoire."
      master: "Les menaces, les interrogatoires et la panique glissent sur vous comme la pluie."
      legendary: "Votre calme est inébranlable, quoi que le monde vous fasse subir."
    focus:
      title: "Concentration"
      short: "FOC"
      description: "Se concentrer sur une tâche malgré la douleur, les distractions et la fatigue."
      untrained: "Votre esprit vagabonde dès que quelque chose d'autre attire votre attention."
      trained: "Vous savez vous concentrer sur une tâche malgré le bruit et de petits désagréments."
      expert: "Vous gardez l'attention fixée sur votre travail malgré la douleur et le chaos."
      master: "Une fois que vous avez décidé de faire quelque chose, rien ne peut briser votre concentration."
      legendary: "Votre concentration est absolue : plus rien n'existe en dehors de la tâche à accomplir."
  command:
    attribute:
      description: "Définit, renforce et affiche les attributs des personnages."
      set:
        description: "Définit un attribut d'un personnage. Attributs : {attributes}"
        syntax: "<cible> <attribut> <valeur>"
        message: "{player} a défini l'attribut {attribute} de {target} à {value}."
      boost:
        description: "Accorde un bonus à un attribut d'un personnage. Une durée « perma » donne un bonus qui dure jusqu'à ce qu'il soit retiré. Attributs : {attributes}"
        syntax: "<cible> <attribut> <valeur> <durée>"
        message: "{player} a accordé à {target} un bonus de {value} à l'attribut {attribute} pour {time}."
        message_permanent: "{player} a accordé à {target} un bonus permanent de {value} à l'attribut {attribute}."
      clearboosts:
        description: "Retire les bonus d'un attribut d'un personnage, ou de tous ses attributs si aucun n'est indiqué. Attributs : {attributes}"
        syntax: "<cible> [attribut]"
        message: "{player} a retiré les bonus de l'attribut {attribute} de {target}."
        message_all: "{player} a retiré tous les bonus d'attributs de {target}."
      list:
        description: "Affiche les attributs et les compétences d'un personnage."
        syntax: "<cible>"
        header: "Attributs de {target} :"
        line: "{attribute} ({id}) : niveau {level}, bonus {boost}"
        skills_header: "Compétences de {target} :"
        skill_line: "{skill} ({id}) : rang {rank}"
    charsetskill:
      description: "Définit le rang d'une compétence d'un personnage. Compétences : {skills}"
      syntax: "<cible> <compétence> <rang>"
      message: "{player} a défini la compétence {skill} de {target} au rang {value}."
  condition:
    attribute:
      name: "Valeur d'attribut correspondante"
      text: "Attribut {attribute} {operator} {value}"
      message1: "Nom de l'attribut"
      message2: "Valeur de l'attribut"
    attributes: "Attributs"
    skill:
      name: "Rang de compétence correspondant"
      text: "Compétence {skill} {operator} {value}"
      message1: "Nom de la compétence"
      message2: "Rang de la compétence"
    skills: "Compétences"
  config:
    stats:
      title: "Statistiques"
      desc: "Les statistiques des personnages et ce qu'elles changent en jeu."
      creation_points:
        name: "Points de statistiques à la création"
        desc: "Nombre de points qu'un nouveau personnage peut répartir entre ses statistiques. La somme des niveaux choisis doit être égale à ce nombre, et aucune statistique ne peut dépasser 3 à la création."
      faction_bonuses:
        name: "Bonus de statistiques de faction"
        desc: "Accorde aux personnages les bonus de statistiques de leur faction, sous forme de bonus qui durent tant qu'ils en font partie."
      perception_hearing:
        name: "Portée auditive par niveau de perception"
        desc: "Mètres ajoutés à la portée à laquelle un personnage entend les paroles en RP pour chaque niveau de perception, et retirés pour chaque niveau en dessous de zéro. 0 désactive l'effet."
      endurance_stamina:
        name: "Endurance par niveau de constitution, %"
        desc: "Pourcentage dont l'endurance s'épuise plus lentement et se régénère plus vite pour chaque niveau de constitution, et l'inverse en dessous de zéro. 0 désactive l'effet."
      endurance_recovery:
        name: "Récupération par niveau de constitution, %"
        desc: "Pourcentage dont la régénération de la santé et la récupération des membres blessés s'accélèrent pour chaque niveau de constitution, et ralentissent en dessous de zéro. Nécessite les plugins Damage et Limb Damage. 0 désactive l'effet."
      strength_lifting:
        name: "Port de charge par niveau de force, %"
        desc: "Pourcentage dont augmentent l'objet le plus lourd qu'un personnage peut soulever et la puissance de ses lancers pour chaque niveau de force, et dont ils diminuent en dessous de zéro. 0 désactive l'effet."
      reflexes_fall:
        name: "Dégâts de chute par niveau de réflexes, %"
        desc: "Pourcentage des dégâts de chute qu'un personnage évite pour chaque niveau de réflexes, et qu'il subit en plus pour chaque niveau en dessous de zéro. Nécessite le plugin Damage. 0 désactive l'effet."
      charisma_prices:
        name: "Prix des marchands par niveau de charisme, %"
        desc: "Pourcentage dont les marchands vendent moins cher à un personnage pour chaque niveau de charisme, et plus cher en dessous de zéro. Un prix ne descend jamais en dessous de ce que le marchand paie pour l'objet. Nécessite le plugin Vendors. 0 désactive l'effet."
      rank_bonus:
        name: "Maîtrise par rang de compétence"
        desc: "Bonus que chaque rang d'une compétence formée ajoute aux jets de cette compétence. Une compétence formée ajoute aussi le niveau du personnage, une compétence non formée n'ajoute rien."
      determination_pain:
        name: "Pénalités de blessure par niveau de détermination, %"
        desc: "Pourcentage dont le ralentissement et la dérive de la visée dus aux membres blessés s'atténuent pour chaque niveau de détermination, et s'aggravent en dessous de zéro. Nécessite le plugin Limb Damage. 0 désactive l'effet."
