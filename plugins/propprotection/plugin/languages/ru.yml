ru:
  config:
    prop_protection:
      title: Защита пропов
      desc: Владение энтити и основанные на нем правила песочницы.
      owned:
        name: Защищать чужие энтити
        desc: Запрещать ли игрокам поднимать, замораживать, управлять и применять инструменты и свойства к энтити других персонажей.
      map:
        name: Защищать энтити карты
        desc: Запрещать ли игрокам делать то же самое с энтити, которые являются частью карты.
      world:
        name: Защищать ничьи энтити
        desc: Запрещать ли игрокам делать то же самое с энтити, которые никому не принадлежат, например с предметами, игроками, рэгдоллами и сохраненными пропами.
      players:
        name: Защищать игроков от физгана
        desc: Запрещать ли игрокам поднимать других игроков физганом.
      vehicles:
        name: Защищать занятый транспорт от физгана
        desc: Запрещать ли игрокам поднимать транспорт, в котором есть водитель, включая их собственный.
      ragdolls:
        name: Защищать рэгдоллы игроков от физгана
        desc: Запрещать ли игрокам поднимать рэгдоллы мертвых и сбитых с ног игроков.
      owner_display:
        name: Показывать владельцев энтити
        desc: Видят ли игроки, кому принадлежит энтити, на который они смотрят. Администрация, обходящая защиту пропов, видит это всегда.
      removal_delay:
        name: Задержка удаления брошенных энтити
        desc: Сколько секунд энтити игрока остаются после того, как он отключился или сменил персонажа. Если игрок вернется вовремя, энтити останутся у него. Установите 0, чтобы никогда их не удалять.
      remove_staff:
        name: Удалять брошенные энтити администрации
        desc: Удалять ли после ухода также энтити администрации, обходящей защиту пропов.
      prop_kill:
        name: Защита от пропкилла
        desc: Защищать ли игроков от ударов пропов, которые удерживаются физганом, только что были им отпущены или только что были созданы.
      prop_kill_time:
        name: Время защиты от пропкилла
        desc: Сколько секунд проп остается безвредным для игроков после того, как был создан или отпущен физганом.
  error:
    prop_protection:
      not_yours: Это вам не принадлежит!
      protected: Этот энтити защищен!
  notification:
    prop_protection:
      returned: "Ваши энтити снова принадлежат вам ({count})."
  settings:
    prop_protection:
      show_owners:
        name: Показывать владельцев энтити
        desc: Показывать ли над энтити, на который вы смотрите, его владельца.
  ui:
    prop_protection:
      owner: "Владелец: {name}"
      owner_you: Это принадлежит вам
      owner_away: Владелец отсутствует
