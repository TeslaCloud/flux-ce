ru:
  config:
    mapcleaner:
      title: Очистка карты
      desc: Настройка удаления лишних объектов с карты.
      classes:
        name: Удаляемые классы объектов
        desc: "Классы объектов, которые удаляются с карты при ее загрузке и после очистки карты. Звездочка заменяет любое количество символов, например weapon_*. Удаляются только объекты, созданные самой картой."
      physics:
        name: Удалять физические объекты карты
        desc: Удалять ли физические объекты (пропы) карты при ее загрузке и после очистки карты.
      vehicles:
        name: Удалять транспорт карты
        desc: Удалять ли транспорт карты при ее загрузке и после очистки карты. Сюда входят и сиденья, встроенные в карту.
