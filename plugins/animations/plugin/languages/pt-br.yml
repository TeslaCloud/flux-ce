  config:
    animations:
      title: Animações
      desc: Posturas e gestos que os jogadores escolhem no menu de contexto.
      cooldown:
        name: Tempo de espera entre animações
        desc: Quantos segundos um jogador precisa esperar após iniciar uma animação antes de poder iniciar outra. Defina como 0 para desativar.
