        name: Terceira pessoa durante animações
        desc: Define se os jogadores veem o personagem em terceira pessoa enquanto reproduzem uma animação.
  error:
    animations:
      busy: Você já está reproduzindo uma animação!
      cooldown: "Você precisa esperar {time} s. antes de poder reproduzir outra animação."
      crouching: Você não pode fazer isso enquanto se agacha!
      model: O modelo do seu personagem não consegue reproduzir esta animação!
      not_on_ground: Você precisa estar de pé no chão!
      wall_behind: Você precisa estar de pé com as costas contra uma parede!
      wall_front: Você precisa estar de pé bem em frente a uma parede, de frente para ela!
  ui:
    animations:
