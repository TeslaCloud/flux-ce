ru:
  config:
    display_typing:
      title: Индикатор написания текста
      desc: Настройка индикатора, обозначающего, что игрок в данный момент набирает сообщение в чат.
      exact_message:
        name: Отображать точное содержимое
        desc: Позволять игрокам видеть текст, который набирает игрок поблизости, прямо во время набора. Если отключено, показывается только индикатор, а сам текст не отправляется другим игрокам.
      range:
        name: Дальность индикатора
        desc: Расстояние в юнитах, с которого игроки видят, что кто-то набирает сообщение. Виды речи, такие как шёпот и крик, изменяют его.
      through_walls:
        name: Индикаторы сквозь стены
        desc: Показывать индикаторы игроков, которые находятся в пределах дальности, но скрыты за стеной.
  settings:
    display_typing:
      bubbles:
        name: Индикаторы набора текста
        desc: Показывать индикатор для игроков поблизости, которые набирают сообщение.
      live_text:
        name: Набираемый текст
        desc: Показывать, что именно набирают игроки поблизости, прямо во время набора, если это разрешено сервером.
  ui:
    hud:
      display_typing:
        typing: ПЕЧАТАЕТ...
