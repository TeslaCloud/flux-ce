  hint:
    inventory: Arraste um item para fora da tela do inventário para largá-lo.
  notification:
    item_given: "Você recebeu {item} x {amount}."
    items_unplaced: "{amount} dos seus itens não couberam nos seus inventários. Eles ficam guardados e voltam quando houver espaço para eles ao carregar o personagem de novo."
    items_unplaced_log: "{player} ({steam_id}) tem {amount} itens que não couberam nos inventários do personagem."
