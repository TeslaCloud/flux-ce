ru:
  condition:
    has_item:
      name: Игрок с определенным предметом в инвентаре
      text: Имеет предмет {operator} {item}
      message: Введите id предмета
    has_item_data:
      name: Персонаж с предметом, содержащим определенное значение данных
      text: Имеет предмет {item} с данными {key} {operator} {value}
      message1: Введите id предмета
      message2: Введите индекс данных
      message3: Введите значение данных
  config:
    items:
      title: Предметы
      desc: Настройки предметов и предметов, лежащих в мире.
      destroy:
        name: Разрешить уничтожение предметов
        desc: Могут ли игроки уничтожать предметы из своего инвентаря через меню предмета. Отдельный предмет может разрешать или запрещать это независимо от данной настройки.
      entity_health:
        name: Прочность выброшенных предметов
        desc: Сколько урона выдерживает лежащий в мире предмет, прежде чем будет уничтожен. Значение 0 делает выброшенные предметы неразрушимыми. Применяется к предметам, выброшенным после изменения.
      drop_ownership:
        name: Запрет на предметы других своих персонажей
        desc: Запрещать ли игрокам подбирать и использовать предметы, выброшенные другим их персонажем.
      ammo_requires_weapon:
        name: Боеприпасы требуют оружия
        desc: Можно ли заряжать боеприпасы только при наличии у игрока оружия, которое их использует.
      drop_weapons_on_death:
        name: Выпадение оружия при смерти
        desc: Выпадает ли экипированное оружие игрока в мир, когда игрок погибает.
  error:
    item:
      other_character: Вы не можете трогать предмет, выброшенный другим вашим персонажем.
      no_weapon_for_ammo: У вас нет оружия, которое использует эти боеприпасы.
      destroy_not_empty: Опустошите этот предмет, прежде чем уничтожать его.
  item:
    category:
      consumables: Расходные материалы
      equipment: Экипировка
      clothing: Одежда
      other: Разное
      weapon: Оружие
      ammo: Боеприпасы
      throwable: Метательное
    slot:
      primary: Основное
      secondary: Второстепенное
      heavy: Тяжелое
      melee: Холодное
      throwable: Метательное
    option:
      use: Использовать
      take: Взять
      drop: Выбросить
      cancel: Отмена
      equip: Экипировать
      unequip: Снять
      unload: Разрядить
      load: Зарядить
      destroy: Уничтожить
  ui:
    item:
      destroy_title: Уничтожение предмета
      destroy_message: "Вы уверены, что хотите уничтожить {item}? Это действие нельзя отменить."
