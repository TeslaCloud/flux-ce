es:
  condition:
    has_item:
      name: Personaje con cierto objeto en el inventario
      text: "Tiene el objeto {operator} {item}"
      message: Introduce el id del objeto
    has_item_data:
      name: Personaje con un objeto que contiene cierto valor de datos
      text: "Tiene el objeto {item} con el dato {key} {operator} {value}"
