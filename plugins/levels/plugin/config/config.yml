categories:
  levels:
    name: config.levels.title
    description: config.levels.desc
configs:
  levels_max_level:
    name: config.levels.max_level.name
    description: config.levels.max_level.desc
    category: levels
    type: number
    min_value: 1
    max_value: 100
    static: true
    default_value: 20
  levels_experience_per_level:
    name: config.levels.experience_per_level.name
    description: config.levels.experience_per_level.desc
    category: levels
    type: number
    min_value: 1
    max_value: 100000
    default_value: 1000
  levels_skill_points_per_level:
    name: config.levels.skill_points_per_level.name
    description: config.levels.skill_points_per_level.desc
    category: levels
    type: number
    min_value: 0
    max_value: 10
    default_value: 1
  levels_boost_every:
    name: config.levels.boost_every.name
    description: config.levels.boost_every.desc
    category: levels
    type: number
    min_value: 0
    max_value: 100
    default_value: 5
  levels_boost_points:
    name: config.levels.boost_points.name
    description: config.levels.boost_points.desc
    category: levels
    type: number
    min_value: 0
    max_value: 10
    default_value: 2
  levels_health_base:
    name: config.levels.health_base.name
    description: config.levels.health_base.desc
    category: levels
    type: number
    min_value: 1
    max_value: 1000
    default_value: 10
  levels_health_per_level:
    name: config.levels.health_per_level.name
    description: config.levels.health_per_level.desc
    category: levels
    type: number
    min_value: 0
    max_value: 100
    default_value: 3
  levels_combat_experience:
    name: config.levels.combat_experience.name
    description: config.levels.combat_experience.desc
    category: levels
    type: boolean
    default_value: false
  levels_experience_per_damage:
    name: config.levels.experience_per_damage.name
    description: config.levels.experience_per_damage.desc
    category: levels
    type: number
    min_value: 0
    max_value: 1000
    decimals: 2
    default_value: 2
  levels_experience_per_kill:
    name: config.levels.experience_per_kill.name
    description: config.levels.experience_per_kill.desc
    category: levels
    type: number
    min_value: 0
    max_value: 100000
    default_value: 50
  levels_server_progression:
    name: config.levels.server_progression.name
    description: config.levels.server_progression.desc
    category: levels
    type: boolean
    default_value: true
  levels_server_days_per_level:
    name: config.levels.server_days_per_level.name
    description: config.levels.server_days_per_level.desc
    category: levels
    type: number
    min_value: 0.01
    max_value: 365
    decimals: 2
    default_value: 7
  levels_server_ramp_level:
    name: config.levels.server_ramp_level.name
    description: config.levels.server_ramp_level.desc
    category: levels
    type: number
    min_value: 1
    max_value: 100
    default_value: 4
  levels_server_ramp_days:
    name: config.levels.server_ramp_days.name
    description: config.levels.server_ramp_days.desc
    category: levels
    type: number
    min_value: 0
    max_value: 365
    decimals: 2
    default_value: 1
  levels_server_cap_offset:
    name: config.levels.server_cap_offset.name
    description: config.levels.server_cap_offset.desc
    category: levels
    type: number
    min_value: 0
    max_value: 100
    default_value: 2
  levels_server_floor_offset:
    name: config.levels.server_floor_offset.name
    description: config.levels.server_floor_offset.desc
    category: levels
    type: number
    min_value: 0
    max_value: 100
    default_value: 2
