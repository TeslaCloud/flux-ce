ru:
  command:
    level:
      description: "Посмотреть или установить уровень персонажей."
      get:
        description: "Посмотреть уровень и опыт персонажа."
        syntax: <цель>
        message: "{target} имеет уровень {level} из {max_level} и {experience} / {needed} опыта, до следующего уровня не хватает {remaining}."
        message_max: "{target} имеет уровень {level}, наивысший."
        message_capped: "{target} имеет уровень {level} из {max_level} и {experience} накопленного опыта. Его сдерживает предел уровня {cap}, пока не вырастет уровень сервера."
      set:
        description: "Установить уровень персонажа, от {floor} до {max_level}. Его опыт сбрасывается, а нераспределённые очки навыков и атрибутов пересчитываются под новый уровень. Верхний предел уровня не действует, а нижний действует."
        syntax: <цель> <уровень>
        message: "{player} устанавливает {target} уровень {level}."
    experience:
      description: "Выдать опыт персонажам."
      add:
        description: "Выдать персонажу опыт. Отрицательное количество отнимает опыт и может понизить уровень. Верхний предел уровня не действует, но персонаж никогда не опускается ниже нижнего предела."
        syntax: <цель> <количество>
        message: "{player} выдаёт {target} {amount} опыта."
        message_taken: "{player} отнимает у {target} {amount} опыта."
    serverlevel:
      description: "Посмотреть или установить уровень сервера."
      get:
        description: "Посмотреть уровень сервера, время до следующего, а также нижний и верхний пределы уровня персонажей."
        message: "Уровень сервера {level} из {max_level}: с его начала прошло {elapsed}, уровень {next_level} наступит через {time}."
        message_max: "Уровень сервера {level}, наивысший."
        limits: "Персонажи поднимаются как минимум до уровня {floor} и могут прокачаться опытом не выше уровня {cap}."
        progression_off: Рост уровня сервера отключён, поэтому нижнего и верхнего пределов уровня нет.
      set:
        description: "Установить уровень сервера, от -1 до {max_level}. Сервер ставится в самое начало этого уровня, а персонажи приводятся в соответствие с новыми пределами уровня."
        syntax: <уровень>
        message: "{player} устанавливает уровень сервера {level}."
  config:
    levels:
      title: Уровни
      desc: Уровни персонажей, опыт, очки за уровень и максимальное здоровье.
      max_level:
        name: Максимальный уровень
        desc: Наивысший уровень, которого может достичь персонаж. Меняется только в файлах конфигурации.
      experience_per_level:
        name: Опыт за уровень
        desc: Сколько опыта нужно персонажу, чтобы подняться на один уровень. Каждый уровень требует одинаковое количество.
      skill_points_per_level:
        name: Очки навыков за уровень
        desc: Сколько очков навыков получает персонаж за каждый уровень после первого. Очко навыка повышает навык на один ранг.
      boost_every:
        name: Очки атрибутов каждые
        desc: Раз во сколько уровней персонаж получает очки атрибутов. При значении 0 не даются.
      boost_points:
        name: Очки атрибутов
        desc: Сколько очков атрибутов получает персонаж каждый раз, когда достигает уровня, который их даёт. Очко атрибута повышает характеристику на один уровень.
      health_base:
        name: Базовое здоровье
        desc: Максимальное здоровье персонажа 1 уровня до прибавки от выносливости. Выносливость прибавляет свой уровень, умноженный на уровень персонажа.
      health_per_level:
        name: Здоровье за уровень
        desc: Сколько максимального здоровья получает персонаж за каждый уровень после первого.
      combat_experience:
        name: Боевой опыт
        desc: Получают ли игроки опыт за урон, нанесённый NPC и другим игрокам, и за убитых NPC.
      experience_per_damage:
        name: Опыт за урон
        desc: Сколько опыта получает игрок за каждую единицу урона, нанесённую NPC или другому игроку, пока включён боевой опыт.
      experience_per_kill:
        name: Опыт за убийство
        desc: Сколько опыта получает игрок за убийство NPC, пока включён боевой опыт. Умножается на десятую часть максимального здоровья NPC, но не меньше чем на 1.
      server_progression:
        name: Рост уровня сервера
        desc: Ограничивает ли уровень сервера уровни персонажей. Уровень сервера начинается с -1 при первом запуске плагина и растёт с реальным временем. Персонажи не могут прокачаться опытом выше уровня сервера плюс смещение верхнего предела и копят опыт, пока предел не вырастет, а также поднимаются до уровня сервера минус смещение нижнего предела.
      server_days_per_level:
        name: Дней на уровень сервера
        desc: Сколько дней реального времени сервер тратит на один уровень, для каждого уровня ниже уровня дополнительных дней.
      server_ramp_level:
        name: Уровень дополнительных дней
        desc: Первый уровень сервера, который длится дольше предыдущего на дополнительные дни за уровень сервера. Каждый следующий уровень длится ещё на столько же дольше.
      server_ramp_days:
        name: Дополнительных дней за уровень сервера
        desc: Сколько дней реального времени каждый уровень сервера, начиная с уровня дополнительных дней, длится сверх предыдущего. При значении 0 все уровни длятся одинаково.
      server_cap_offset:
        name: Смещение верхнего предела
        desc: На сколько уровней выше уровня сервера персонажи могут подняться опытом. Команды администрации им не ограничены.
      server_floor_offset:
        name: Смещение нижнего предела
        desc: На сколько уровней ниже уровня сервера поднимаются персонажи.
  error:
    levels:
      no_character: "У игрока {target} нет активного персонажа!"
      no_active_character: У вас нет активного персонажа!
      invalid_skill: На этот навык нельзя тратить очки навыков!
      invalid_stat: На эту характеристику нельзя тратить очки атрибутов!
      no_skill_points: У вас не осталось очков навыков!
      no_attribute_points: У вас не осталось очков атрибутов!
      skill_maxed: Этот навык уже на наивысшем ранге!
      stat_maxed: Эта характеристика уже на наивысшем уровне!
      cannot_raise: Этот атрибут сейчас нельзя повысить!
  notification:
    levels:
      level_up: Вы достигли уровня {level}!
      level_set: Ваш уровень установлен на {level}.
      experience_given: Вам выдано {amount} опыта.
      experience_taken: "У вас отнято {amount} опыта."
